<svg viewBox="0 0 1010 575" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dia103-title dia103-desc">
  <title id="dia103-title">DIA-103 · Hosting and deploy: GitHub push to Cloudflare Pages to the live URLs</title>
  <desc id="dia103-desc">Reads left to right. The owner pushes a branch to GitHub (step 1). Cloudflare's GitHub App tells the Cloudflare Pages project alonzo-anthologies to build (step 2). The project runs bash ./build.sh with NODE_VERSION 22.16.0 and publishes site/public, the folder named in wrangler.toml (step 3). The main branch goes to production at alonzo-anthologies.pages.dev, today deployment c7455b17 of commit c6dadfe (step 4); any other branch goes to a public preview URL (step 5). The Cloudflare API token sits in the gitignored _ENV folder on the owner's machine and is used only for read-only API checks (step 6). Drawn dashed below: the archived GitLab project, read-only and connected to nothing live, and the legacy Pages project zo-garden, which the same GitHub push also builds, so zo-garden.pages.dev serves a duplicate of the current site.</desc>
