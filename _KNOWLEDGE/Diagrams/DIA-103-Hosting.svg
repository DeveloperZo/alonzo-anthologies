<svg viewBox="0 0 1000 662" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s103-title s103-desc">
  <title id="s103-title">DIA-103 · From sent to seen</title>
  <desc id="s103-desc">Six numbered steps. One: a change arrives at the online copy (GitHub) from Zo's computer, and the online copy tells the publisher (Cloudflare Pages) that a change has arrived. Two: the publisher hands the work to the page maker (Quartz, run by build.sh). Three: the page maker turns the work into web pages, on the publisher's machines. Four: the pages come back. Five: the publisher puts them on the internet. A change to the main copy goes to the live site, alonzo-anthologies.pages.dev. A change to any other copy becomes a trial copy at its own address, which is also public. Six: a visitor opens the live site and sees the change. Separately, the same change is published on the old duplicate site (zo-garden), which is left over until it is retired. Nobody uploads anything by hand. If the pages cannot be made, the site keeps showing the pages it had and no alarm goes off.</desc>
  <defs>
    <style>
      :root {
        --bg: #FAFAF8; --paper: #F2EEE3; --text: #2A2A35; --muted: #6B6873; --muted2: #9D9A95; --line: #E2DFD6;
        --red: #A85B49; --blue: #4F627F; --blue-soft: #DEE3EC; --green: #5A8270; --green-soft: #DEE8E1; --amber: #A28438; --amber-soft: #F0E5CD;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1B1D23; --paper: #1E2128; --text: #E8E5DC; --muted: #B8B5AD; --muted2: #908D87; --line: #3E3D38;
          --red: #D29183; --blue: #94A6C4; --blue-soft: #2A323F; --green: #92BAA6; --green-soft: #233029; --amber: #D6B574; --amber-soft: #3B3220;
        }
      }
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      text.m, tspan.m { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
      [fill="#FAFAF8"] { fill: var(--bg); } [fill="#F2EEE3"] { fill: var(--paper); }
      [fill="#2A2A35"] { fill: var(--text); }
      [fill="#6B6873"] { fill: var(--muted); } [fill="#9D9A95"] { fill: var(--muted2); }
      [stroke="#E2DFD6"] { stroke: var(--line); } [stroke="#9D9A95"] { stroke: var(--muted2); }
      [fill="#A85B49"] { fill: var(--red); }
      [fill="#4F627F"] { fill: var(--blue); } [stroke="#4F627F"] { stroke: var(--blue); } [fill="#DEE3EC"] { fill: var(--blue-soft); }
      [fill="#5A8270"] { fill: var(--green); } [stroke="#5A8270"] { stroke: var(--green); } [fill="#DEE8E1"] { fill: var(--green-soft); }
      [fill="#A28438"] { fill: var(--amber); } [stroke="#A28438"] { stroke: var(--amber); } [fill="#F0E5CD"] { fill: var(--amber-soft); }
      [stroke="#6B6873"] { stroke: var(--muted); } [stroke="#A85B49"] { stroke: var(--red); } [stroke="#2A2A35"] { stroke: var(--text); }
    </style>
    <marker id="s103-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L9,5 L0,9 Z" fill="#4F627F"/></marker>
    <marker id="s103-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L9,5 L0,9 Z" fill="#A28438"/></marker>
    <marker id="s103-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L9,5 L0,9 Z" fill="#6B6873"/></marker>
  </defs>
  <rect width="1000" height="662" fill="#F2EEE3"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#A85B49" letter-spacing="0.04em">DIA-103 · FROM SENT TO SEEN</text>
  <text x="500" y="58" font-size="14" fill="#6B6873" text-anchor="middle">What happens after a change is sent up, until a visitor sees it?</text>
  <line x1="244" y1="180" x2="387" y2="180" stroke="#4F627F" stroke-width="2.5" marker-end="url(#s103-blue)"/>
  <line x1="610" y1="180" x2="753" y2="180" stroke="#4F627F" stroke-width="2.5" marker-end="url(#s103-blue)"/>
  <line x1="756" y1="216" x2="613" y2="216" stroke="#4F627F" stroke-width="2.5" marker-end="url(#s103-blue)"/>
  <line x1="500" y1="242" x2="500" y2="337" stroke="#4F627F" stroke-width="2.5" marker-end="url(#s103-blue)"/>
  <line x1="500" y1="300" x2="866" y2="300" stroke="#4F627F" stroke-width="2.5"/>
  <line x1="866" y1="299" x2="866" y2="337" stroke="#4F627F" stroke-width="2.5" marker-end="url(#s103-blue)"/>
  <line x1="500" y1="432" x2="500" y2="487" stroke="#4F627F" stroke-width="2.5" marker-end="url(#s103-blue)"/>
  <line x1="134" y1="242" x2="134" y2="337" stroke="#6B6873" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#s103-gray)"/>
  <rect x="24" y="150" width="220" height="92" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="134.0" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#5A8270">THE ONLINE COPY</text>
  <text x="134.0" y="197" text-anchor="middle" font-size="13" fill="#5A8270">a change arrives here</text>
  <text x="134.0" y="215" text-anchor="middle" font-size="13" fill="#5A8270">from Zo's computer (DIA-102)</text>
  <text x="134.0" y="234" text-anchor="middle" font-size="11" fill="#6B6873">GitHub</text>
  <rect x="390" y="150" width="220" height="92" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="500.0" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#5A8270">THE PUBLISHER</text>
  <text x="500.0" y="197" text-anchor="middle" font-size="13" fill="#5A8270">starts by itself, then puts</text>
  <text x="500.0" y="215" text-anchor="middle" font-size="13" fill="#5A8270">the pages on the internet</text>
  <text x="500.0" y="234" text-anchor="middle" font-size="11" fill="#6B6873">Cloudflare Pages</text>
  <rect x="756" y="150" width="220" height="92" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="866.0" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#5A8270">THE PAGE MAKER</text>
  <text x="866.0" y="197" text-anchor="middle" font-size="13" fill="#5A8270">turns the work into web pages</text>
  <text x="866.0" y="215" text-anchor="middle" font-size="13" fill="#5A8270">on the publisher's machines</text>
  <text x="866.0" y="234" text-anchor="middle" font-size="11" fill="#6B6873">Quartz, run by build.sh</text>
  <rect x="24" y="340" width="220" height="92" rx="12" fill="#FAFAF8" stroke="#6B6873" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="134.0" y="366" font-size="14.5" fill="#6B6873" text-anchor="middle" font-weight="700">THE OLD DUPLICATE SITE</text>
  <text x="134.0" y="387" font-size="13" fill="#6B6873" text-anchor="middle">a second copy of the live site</text>
  <text x="134.0" y="405" font-size="13" fill="#6B6873" text-anchor="middle">left over until it is retired</text>
  <text x="134.0" y="424" font-size="11" fill="#6B6873" text-anchor="middle">zo-garden</text>
  <rect x="390" y="340" width="220" height="92" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="500.0" y="366" text-anchor="middle" font-size="16" font-weight="700" fill="#5A8270">THE LIVE SITE</text>
  <text x="500.0" y="387" text-anchor="middle" font-size="13" fill="#5A8270">the real site</text>
  <text x="500.0" y="405" text-anchor="middle" font-size="13" fill="#5A8270">open to everyone</text>
  <text x="500.0" y="424" text-anchor="middle" font-size="11" fill="#6B6873">alonzo-anthologies.pages.dev</text>
  <rect x="756" y="340" width="220" height="92" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="866.0" y="366" text-anchor="middle" font-size="16" font-weight="700" fill="#5A8270">A TRIAL COPY</text>
  <text x="866.0" y="387" text-anchor="middle" font-size="13" fill="#5A8270">a try-out, at its own address</text>
  <text x="866.0" y="405" text-anchor="middle" font-size="13" fill="#5A8270">public too: anyone can open it</text>
  <text x="866.0" y="424" text-anchor="middle" font-size="11" fill="#6B6873">branch preview</text>
  <rect x="390" y="490" width="220" height="64" rx="32" fill="#DEE3EC" stroke="#4F627F" stroke-width="2"/>
  <text x="500" y="518" font-size="15" fill="#4F627F" text-anchor="middle" font-weight="700">A VISITOR</text>
  <text x="500" y="537" font-size="13" fill="#4F627F" text-anchor="middle">sees the change</text>
  <circle cx="317" cy="180" r="11" fill="#FAFAF8" stroke="#4F627F" stroke-width="1.8"/>
  <text x="317" y="184.5" font-size="12.5" fill="#4F627F" text-anchor="middle" font-weight="700">1</text>
  <circle cx="683" cy="180" r="11" fill="#FAFAF8" stroke="#4F627F" stroke-width="1.8"/>
  <text x="683" y="184.5" font-size="12.5" fill="#4F627F" text-anchor="middle" font-weight="700">2</text>
  <circle cx="756" cy="150" r="11" fill="#FAFAF8" stroke="#4F627F" stroke-width="1.8"/>
  <text x="756" y="154.5" font-size="12.5" fill="#4F627F" text-anchor="middle" font-weight="700">3</text>
  <circle cx="683" cy="216" r="11" fill="#FAFAF8" stroke="#4F627F" stroke-width="1.8"/>
  <text x="683" y="220.5" font-size="12.5" fill="#4F627F" text-anchor="middle" font-weight="700">4</text>
  <circle cx="500" cy="272" r="11" fill="#FAFAF8" stroke="#4F627F" stroke-width="1.8"/>
  <text x="500" y="276.5" font-size="12.5" fill="#4F627F" text-anchor="middle" font-weight="700">5</text>
  <circle cx="500" cy="458" r="11" fill="#FAFAF8" stroke="#4F627F" stroke-width="1.8"/>
  <text x="500" y="462.5" font-size="12.5" fill="#4F627F" text-anchor="middle" font-weight="700">6</text>
  <text x="317" y="138" font-size="12.5" fill="#4F627F" text-anchor="middle" font-weight="600">says a change</text>
  <text x="317" y="154" font-size="12.5" fill="#4F627F" text-anchor="middle" font-weight="600">has arrived</text>
  <text x="683" y="138" font-size="12.5" fill="#4F627F" text-anchor="middle" font-weight="600">hands the</text>
  <text x="683" y="154" font-size="12.5" fill="#4F627F" text-anchor="middle" font-weight="600">work over</text>
  <text x="683" y="244" font-size="12.5" fill="#6B6873" text-anchor="middle">the pages come back</text>
  <text x="520" y="268" font-size="12.5" fill="#4F627F" font-weight="600">puts the pages up</text>
  <text x="488" y="322" font-size="12.5" fill="#4F627F" text-anchor="end" font-weight="600">a change to the main copy</text>
  <text x="854" y="322" font-size="12.5" fill="#4F627F" text-anchor="end" font-weight="600">a change to any other copy</text>
  <text x="520" y="462.5" font-size="12.5" fill="#4F627F" font-weight="600">opens the live site</text>
  <text x="148" y="286" font-size="12.5" fill="#6B6873">the same change is</text>
  <text x="148" y="302" font-size="12.5" fill="#6B6873">published here too</text>
  <text x="24" y="478" font-size="12" fill="#6B6873" font-weight="700" letter-spacing="0.03em">IF THE PAGES CANNOT BE MADE</text>
  <text x="24" y="502" font-size="13.5" fill="#2A2A35">Nothing changes. The site keeps</text>
  <text x="24" y="521" font-size="13.5" fill="#2A2A35">showing the pages it had.</text>
  <text x="24" y="540" font-size="13.5" fill="#2A2A35">No alarm goes off.</text>
  <text x="700" y="478" font-size="12" fill="#6B6873" font-weight="700" letter-spacing="0.03em">NOBODY UPLOADS BY HAND</text>
  <text x="700" y="502" font-size="13.5" fill="#2A2A35">Sending the change up is all it</text>
  <text x="700" y="521" font-size="13.5" fill="#2A2A35">takes. The rest happens by itself.</text>
  <circle cx="36" cy="596" r="11" fill="#FAFAF8" stroke="#4F627F" stroke-width="1.8"/>
  <text x="36" y="600.5" font-size="12.5" fill="#4F627F" text-anchor="middle" font-weight="700">n</text>
  <text x="56" y="600.5" font-size="12.5" fill="#6B6873">a step, in order</text>
  <rect x="200" y="588" width="24" height="16" rx="4" fill="#DEE8E1" stroke="#5A8270" stroke-width="1.5"/>
  <text x="232" y="600" font-size="12.5" fill="#6B6873">in use</text>
  <rect x="310" y="588" width="24" height="16" rx="4" fill="#FAFAF8" stroke="#6B6873" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="342" y="600" font-size="12.5" fill="#6B6873">left over</text>
  <text x="500" y="640" font-size="13.5" fill="#A85B49" text-anchor="middle" font-weight="600">DIA-103 · From sent to seen: the publisher has the pages made, then puts the main copy on the live site.</text>
</svg>
