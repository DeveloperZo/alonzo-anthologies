<svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d110-title d110-desc">
  <title id="d110-title">DIA-110 · Startup and failure: what comes back after a restart, and what stops when a piece is down</title>
  <desc id="d110-desc">Reads left to right, which is startup order. An arrow from A to B means B needs A. On the left, Windows starts after a restart or update, and someone must log in. Three programs on Windows follow the login. Tailscale comes back at login; if it is down the laptop cannot find the desktop. Docker Desktop does not start by itself, you must start it; if it is down the relay, chat, record and media all stop. Ollama comes back at login; if it is down no model answers. On the right, a frame holds four containers that come back once Docker Desktop is up. LiteLLM, the relay, needs Ollama; if it is down no tool or chat gets an answer. Open WebUI needs LiteLLM; if it is down there is no browser chat but tools still work. Langfuse is used by LiteLLM but not required; if it is down answers still come but there is no record. Jellyfin needs nothing else; if it is down there is no media and nothing else is affected. A note records a known fault: Docker Desktop can fail to start because of a stale socket, and the fix is written in the project context file.</desc>
  <defs>
    <style>
      :root {
        --bg: #FAFAF8; --paper: #F2EEE3; --text: #2A2A35; --muted: #6B6873; --muted2: #9D9A95; --line: #E2DFD6;
        --red: #A85B49;   --red-soft: #EDD8CE;
        --amber: #A28438; --amber-soft: #F0E5CD;
        --blue: #4F627F;  --blue-soft: #DEE3EC;
        --green: #5A8270; --green-soft: #DEE8E1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1B1D23; --paper: #1E2128; --text: #E8E5DC; --muted: #B8B5AD; --muted2: #908D87; --line: #3E3D38;
          --red: #D29183;   --red-soft: #3D2925;
          --amber: #D6B574; --amber-soft: #3B3220;
          --blue: #94A6C4;  --blue-soft: #2A323F;
          --green: #92BAA6; --green-soft: #233029;
        }
      }
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      text.m, tspan.m { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
      [fill="#FAFAF8"] { fill: var(--bg); } [fill="#F2EEE3"] { fill: var(--paper); }
      [fill="#2A2A35"] { fill: var(--text); } [stroke="#2A2A35"] { stroke: var(--text); }
      [fill="#6B6873"] { fill: var(--muted); } [fill="#9D9A95"] { fill: var(--muted2); }
      [fill="#E2DFD6"] { fill: var(--line); } [stroke="#E2DFD6"] { stroke: var(--line); } [stroke="#9D9A95"] { stroke: var(--muted2); } [stroke="#6B6873"] { stroke: var(--muted); }
      [fill="#A85B49"] { fill: var(--red); } [stroke="#A85B49"] { stroke: var(--red); } [fill="#EDD8CE"] { fill: var(--red-soft); }
      [fill="#A28438"] { fill: var(--amber); } [stroke="#A28438"] { stroke: var(--amber); } [fill="#F0E5CD"] { fill: var(--amber-soft); }
      [fill="#4F627F"] { fill: var(--blue); } [stroke="#4F627F"] { stroke: var(--blue); } [fill="#DEE3EC"] { fill: var(--blue-soft); }
      [fill="#5A8270"] { fill: var(--green); } [stroke="#5A8270"] { stroke: var(--green); } [fill="#DEE8E1"] { fill: var(--green-soft); }
    </style>
    <marker id="d110-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L9,5 L0,9 Z" fill="#4F627F"/></marker>
    <marker id="d110-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L9,5 L0,9 Z" fill="#A28438"/></marker>
    <marker id="d110-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L9,5 L0,9 Z" fill="#6B6873"/></marker>
  </defs>
  <rect width="1000" height="680" fill="#F2EEE3"/>

  <!-- header -->
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#A85B49" letter-spacing="0.04em">DIA-110 · STARTUP AND FAILURE</text>
  <text x="500" y="58" text-anchor="middle" font-size="14" fill="#6B6873">After a restart, what comes back by itself, and what stops when a piece is down?</text>

  <!-- container frame -->
  <rect x="504" y="82" width="472" height="458" rx="8" fill="none" stroke="#9D9A95" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="520" y="103" font-size="12" font-weight="700" fill="#6B6873" letter-spacing="0.03em">CONTAINERS · come back once Docker Desktop is up</text>

  <!-- arrows (drawn before nodes) -->
  <!-- Windows to the three programs: one bracket -->
  <line x1="211" y1="168" x2="211" y2="468" stroke="#6B6873" stroke-width="1.5"/>
  <line x1="211" y1="168" x2="230" y2="168" stroke="#6B6873" stroke-width="1.5" marker-end="url(#d110-gray)"/>
  <line x1="192" y1="318" x2="230" y2="318" stroke="#6B6873" stroke-width="1.5" marker-end="url(#d110-gray)"/>
  <line x1="211" y1="468" x2="230" y2="468" stroke="#6B6873" stroke-width="1.5" marker-end="url(#d110-gray)"/>
  <!-- Docker Desktop to the container frame -->
  <line x1="460" y1="318" x2="503" y2="318" stroke="#A28438" stroke-width="2.5" marker-end="url(#d110-amber)"/>
  <!-- Ollama to LiteLLM -->
  <line x1="460" y1="468" x2="520" y2="468" stroke="#4F627F" stroke-width="2.5" marker-end="url(#d110-blue)"/>
  <!-- LiteLLM to Open WebUI -->
  <line x1="724" y1="468" x2="756" y2="468" stroke="#4F627F" stroke-width="2.5" marker-end="url(#d110-blue)"/>
  <!-- LiteLLM to Langfuse: used, not required -->
  <path d="M622,420 V318 H756" fill="none" stroke="#4F627F" stroke-width="1.5" marker-end="url(#d110-blue)"/>
  <text x="689" y="308" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4F627F">not required</text>

  <!-- column 1: Windows -->
  <rect x="24" y="270" width="168" height="96" rx="2" fill="#FAFAF8" stroke="#6B6873" stroke-width="3"/>
  <text x="108" y="296" text-anchor="middle" font-size="16" font-weight="700" fill="#6B6873">WINDOWS STARTS</text>
  <text x="108" y="318" text-anchor="middle" font-size="13" fill="#6B6873">after a restart</text>
  <text x="108" y="338" text-anchor="middle" font-size="13" fill="#6B6873">or update</text>
  <text x="108" y="358" text-anchor="middle" font-size="13" font-weight="700" fill="#A28438">you must log in</text>

  <!-- column 2: programs on Windows -->
  <rect x="230" y="120" width="230" height="96" rx="2" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="345" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#5A8270">TAILSCALE</text>
  <text x="345" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#5A8270">comes back at login</text>
  <text x="345" y="188" text-anchor="middle" font-size="13" font-style="italic" fill="#5A8270">if down: laptop cannot find</text>
  <text x="345" y="208" text-anchor="middle" font-size="13" font-style="italic" fill="#5A8270">the desktop</text>

  <rect x="230" y="270" width="230" height="96" rx="2" fill="#F0E5CD" stroke="#A28438" stroke-width="2"/>
  <text x="345" y="296" text-anchor="middle" font-size="16" font-weight="700" fill="#A28438">DOCKER DESKTOP</text>
  <text x="345" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#A28438">you must start it</text>
  <text x="345" y="338" text-anchor="middle" font-size="13" font-style="italic" fill="#A28438">if down: relay, chat, record,</text>
  <text x="345" y="358" text-anchor="middle" font-size="13" font-style="italic" fill="#A28438">media all stop</text>

  <rect x="230" y="420" width="230" height="96" rx="2" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="345" y="452" text-anchor="middle" font-size="16" font-weight="700" fill="#5A8270">OLLAMA</text>
  <text x="345" y="474" text-anchor="middle" font-size="13" font-weight="700" fill="#5A8270">comes back at login</text>
  <text x="345" y="494" text-anchor="middle" font-size="13" font-style="italic" fill="#5A8270">if down: no model answers</text>

  <!-- containers -->
  <rect x="756" y="120" width="204" height="96" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="858" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#5A8270">JELLYFIN</text>
  <text x="858" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#5A8270">follows Docker Desktop</text>
  <text x="858" y="188" text-anchor="middle" font-size="13" font-style="italic" fill="#5A8270">if down: no media;</text>
  <text x="858" y="208" text-anchor="middle" font-size="13" font-style="italic" fill="#5A8270">nothing else affected</text>

  <rect x="762" y="276" width="204" height="96" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <rect x="756" y="270" width="204" height="96" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="858" y="296" text-anchor="middle" font-size="16" font-weight="700" fill="#5A8270">LANGFUSE</text>
  <text x="858" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#5A8270">follows Docker Desktop</text>
  <text x="858" y="338" text-anchor="middle" font-size="13" font-style="italic" fill="#5A8270">if down: answers come,</text>
  <text x="858" y="358" text-anchor="middle" font-size="13" font-style="italic" fill="#5A8270">but no record</text>

  <rect x="520" y="420" width="204" height="96" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="622" y="446" text-anchor="middle" font-size="16" font-weight="700" fill="#5A8270">LITELLM (the relay)</text>
  <text x="622" y="468" text-anchor="middle" font-size="13" font-weight="700" fill="#5A8270">follows Docker Desktop</text>
  <text x="622" y="488" text-anchor="middle" font-size="13" font-style="italic" fill="#5A8270">if down: no tool or chat</text>
  <text x="622" y="508" text-anchor="middle" font-size="13" font-style="italic" fill="#5A8270">gets an answer</text>

  <rect x="756" y="420" width="204" height="96" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="858" y="446" text-anchor="middle" font-size="16" font-weight="700" fill="#5A8270">OPEN WEBUI</text>
  <text x="858" y="468" text-anchor="middle" font-size="13" font-weight="700" fill="#5A8270">follows Docker Desktop</text>
  <text x="858" y="488" text-anchor="middle" font-size="13" font-style="italic" fill="#5A8270">if down: no browser chat;</text>
  <text x="858" y="508" text-anchor="middle" font-size="13" font-style="italic" fill="#5A8270">tools still work</text>

  <!-- known fault note -->
  <line x1="25" y1="542" x2="25" y2="584" stroke="#A28438" stroke-width="2.5"/>
  <text x="36" y="559" font-size="12.5" font-weight="600" fill="#A28438">Known fault: Docker Desktop can fail to start (stale socket).</text>
  <text x="36" y="579" font-size="12.5" font-weight="600" fill="#A28438">Fix is in <tspan class="m">_KNOWLEDGE/Context/home-library.md</tspan>.</text>

  <!-- legend -->
  <line x1="24" y1="618" x2="60" y2="618" stroke="#4F627F" stroke-width="2.5" marker-end="url(#d110-blue)"/>
  <text x="70" y="622" font-size="12.5" fill="#6B6873">the thing at the tip needs the thing at the tail</text>
  <line x1="372" y1="618" x2="408" y2="618" stroke="#4F627F" stroke-width="1.5" marker-end="url(#d110-blue)"/>
  <text x="418" y="622" font-size="12.5" fill="#6B6873">used, but not required</text>
  <rect x="580" y="610" width="24" height="16" rx="2" fill="#F0E5CD" stroke="#A28438" stroke-width="2"/>
  <text x="614" y="622" font-size="12.5" fill="#6B6873">does not start by itself</text>
  <text x="786" y="622" font-size="12.5" font-weight="700" fill="#6B6873">bold line<tspan font-weight="400">  how it starts</tspan></text>

  <!-- caption -->
  <text x="500" y="658" text-anchor="middle" font-size="13.5" font-weight="600" fill="#A85B49">DIA-110 · Startup: after a restart, log in and start Docker Desktop by hand; until then the relay, chat, record and media are down.</text>
</svg>
