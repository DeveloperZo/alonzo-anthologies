<svg viewBox="0 0 960 740" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p1-t p1-d">
  <title id="p1-t">DIA-001 · The still</title>
  <desc id="p1-d">An engraved plate of a distilling apparatus. Loose letters fall into a funnel on a large retort that sits in a brick furnace with a fire drawn in rust. Vapour passes down a beak into a coiled worm inside a tub, and drips into a small receiving flask. A thin pipe returns from the receiver over the top of the apparatus back into the retort. A tap on the receiver fills a small glass.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredericka+the+Great&amp;family=Spectral:ital,wght@0,400;0,600;1,400&amp;display=swap');
      :root { --paper: #F2EEE3; --ink: #2A2A35; --soft: #6B6873; --accent: #A85B49; }
      @media (prefers-color-scheme: dark) { :root { --paper: #1E2128; --ink: #E8E5DC; --soft: #B8B5AD; --accent: #D29183; } }
      text { font-family: Spectral, Georgia, "Times New Roman", serif; fill: var(--ink); }
      .paper { fill: var(--paper); }
      .l { fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: var(--ink); stroke-width: 0.7; stroke-linecap: round; }
      .b { fill: var(--paper); stroke: var(--ink); stroke-width: 1.4; stroke-linejoin: round; }
      .s { fill: var(--ink); }
      .h { fill: url(#p1-h); stroke: none; }
      .hl { stroke: var(--ink); stroke-width: 0.6; }
      .tube-o { fill: none; stroke: var(--ink); stroke-width: 6.5; stroke-linejoin: round; stroke-linecap: butt; }
      .tube-i { fill: none; stroke: var(--paper); stroke-width: 3.9; stroke-linejoin: round; stroke-linecap: butt; }
      .fire { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .sc { font-size: 11px; letter-spacing: 0.16em; fill: var(--soft); }
      .key { font-size: 17px; font-style: italic; }
      .scrap { font-size: 12px; font-style: italic; fill: var(--soft); }
      .leg { font-size: 12.5px; font-style: italic; }
      .cap { font-size: 12.5px; fill: var(--soft); }
      .title { font-family: "Fredericka the Great", "Cormorant Garamond", Georgia, serif; font-size: 32px; letter-spacing: 0.01em; }
    </style>
    <pattern id="p1-h" width="4.5" height="4.5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4.5" class="hl"/>
    </pattern>
    <clipPath id="p1-bulb"><circle cx="175" cy="370" r="78"/></clipPath>
    <clipPath id="p1-recv"><circle cx="644" cy="538" r="40"/></clipPath>
  </defs>
  <rect width="960" height="740" class="paper"/>
  <rect x="14" y="14" width="932" height="712" class="l" style="stroke-width:1.2"/>
  <rect x="20" y="20" width="920" height="700" class="thin"/>
  <text x="42" y="50" class="sc">PLATE I</text>
  <text x="918" y="50" text-anchor="end" class="sc">PART I · SECTION 1 · WHAT'S BEING BUILT</text>
  <!-- bench -->
  <rect x="60" y="580" width="840" height="7" class="h"/>
  <line x1="60" y1="580" x2="900" y2="580" class="l"/>
  <g transform="translate(80 0)">
    <!-- the return: receiver side arm, up, over, down into the head -->
    <path d="M 683 528 H 716 V 150 H 175 V 214" class="tube-o"/>
    <path d="M 683 528 H 716 V 150 H 175 V 214" class="tube-i"/>
    <path d="M 452 142 l -10 8 l 10 8" class="thin"/>
    <!-- scraps of text falling into the funnel -->
    <text x="78" y="212" class="scrap" transform="rotate(-14 78 212)">the</text>
    <text x="112" y="196" class="scrap" transform="rotate(10 112 196)">and</text>
    <text x="92" y="236" class="scrap" transform="rotate(18 92 236)">e</text>
    <text x="124" y="228" class="scrap" transform="rotate(-20 124 228)">of</text>
    <text x="66" y="244" class="scrap" transform="rotate(-8 66 244)">?</text>
    <text x="108" y="256" class="scrap" transform="rotate(6 108 256)">a</text>
    <text x="134" y="250" class="scrap" transform="rotate(24 134 250)">t</text>
    <!-- retort bulb with its charge -->
    <circle cx="175" cy="370" r="78" class="b"/>
    <rect x="97" y="384" width="156" height="66" class="h" clip-path="url(#p1-bulb)"/>
    <path d="M 99 384 q 19 -5 38 0 t 38 0 t 38 0 t 38 0" class="thin"/>
    <circle cx="175" cy="370" r="78" class="l"/>
    <path d="M 118 326 A 72 72 0 0 1 150 302" class="thin" style="opacity:0.6"/>
    <!-- charging funnel -->
    <path d="M 126 314 L 108 290" class="l" style="stroke-width:5"/>
    <path d="M 126 314 L 108 290" style="stroke:var(--paper);stroke-width:2.4"/>
    <path d="M 86 266 H 124 L 108 292 Z" class="b"/>
    <!-- neck, head and beak -->
    <rect x="163" y="262" width="24" height="34" class="b"/>
    <path d="M 196 230 L 432 316 L 432 328 L 198 258 Z" class="b"/>
    <circle cx="175" cy="240" r="28" class="b"/>
    <path d="M 157 252 A 22 22 0 0 0 196 248 A 30 30 0 0 1 157 252 Z" class="h"/>
    <!-- furnace -->
    <rect x="90" y="440" width="170" height="140" class="b"/>
    <g class="thin">
      <line x1="90" y1="462" x2="260" y2="462"/><line x1="90" y1="484" x2="260" y2="484"/><line x1="90" y1="506" x2="260" y2="506"/><line x1="90" y1="528" x2="260" y2="528"/><line x1="90" y1="550" x2="260" y2="550"/>
      <path d="M 124 440 v 22 M 175 440 v 22 M 226 440 v 22 M 106 462 v 22 M 150 462 v 22 M 200 462 v 22 M 244 462 v 22 M 124 484 v 22 M 226 484 v 22 M 106 506 v 22 M 244 506 v 22 M 124 528 v 22 M 226 528 v 22 M 106 550 v 30 M 244 550 v 30"/>
    </g>
    <rect x="236" y="440" width="24" height="140" class="h"/>
    <path d="M 140 580 V 528 Q 175 492 210 528 V 580 Z" class="b"/>
    <path d="M 150 578 q 2 -22 12 -30 q -1 14 8 18 q 2 -22 12 -32 q 0 20 10 26 q 4 -10 6 -14 q 4 16 2 32" class="fire"/>
    <path d="M 164 578 q 2 -10 8 -14 q 2 8 8 14 M 186 578 q 2 -8 6 -12" class="fire" style="stroke-width:1.1"/>
    <!-- the worm tub, cut away to show the coil -->
    <rect x="432" y="296" width="140" height="180" rx="5" class="b"/>
    <rect x="432" y="296" width="16" height="180" class="h"/>
    <rect x="556" y="296" width="16" height="180" class="h"/>
    <rect x="432" y="296" width="140" height="180" rx="5" class="l"/>
    <line x1="448" y1="296" x2="448" y2="476" class="thin"/><line x1="556" y1="296" x2="556" y2="476" class="thin"/>
    <path d="M 448 308 q 13.5 -4 27 0 t 27 0 t 27 0 t 27 0" class="thin"/>
    <g class="l" style="stroke-width:2.2">
      <path d="M 432 322 L 458 330"/>
      <ellipse cx="502" cy="336" rx="44" ry="8"/><ellipse cx="502" cy="358" rx="44" ry="8"/><ellipse cx="502" cy="380" rx="44" ry="8"/><ellipse cx="502" cy="402" rx="44" ry="8"/><ellipse cx="502" cy="424" rx="44" ry="8"/><ellipse cx="502" cy="446" rx="44" ry="8"/>
    </g>
    <!-- spout and drops -->
    <path d="M 546 448 L 572 454 L 640 464" class="l" style="stroke-width:5"/>
    <path d="M 550 449 L 572 454 L 638 463.7" style="fill:none;stroke:var(--paper);stroke-width:2.4"/>
    <path d="M 644 468 q -3 5 0 7 q 3 -2 0 -7 Z M 644 482 q -3 5 0 7 q 3 -2 0 -7 Z" class="s"/>
    <!-- receiver -->
    <rect x="632" y="494" width="24" height="14" class="b"/>
    <circle cx="644" cy="538" r="40" class="b"/>
    <rect x="604" y="548" width="80" height="32" class="h" clip-path="url(#p1-recv)"/>
    <path d="M 606 548 q 9.5 -3 19 0 t 19 0 t 19 0 t 19 0" class="thin"/>
    <circle cx="644" cy="538" r="40" class="l"/>
    <rect x="636" y="494" width="16" height="16" class="paper"/>
    <path d="M 632 508 V 494 M 656 508 V 494" class="l"/>
    <!-- tap and glass -->
    <path d="M 680 556 L 706 560 V 566" class="l" style="stroke-width:3"/>
    <path d="M 694 553 v -8 M 689 545 h 10" class="l"/>
    <path d="M 706 569 q -2 4 0 5 q 2 -1 0 -5 Z" class="s"/>
    <path d="M 722 556 L 725 580 H 743 L 746 556" class="l"/>
    <path d="M 723.5 568 H 744.5 L 743 580 H 725 Z" class="h"/>
    <path d="M 706 566 Q 718 560 730 566" class="thin" stroke-dasharray="1.5 3"/>
    <!-- keys -->
    <text x="46" y="412" class="key">a</text><line x1="56" y1="408" x2="104" y2="400" class="thin"/>
    <text x="292" y="548" class="key" style="fill:var(--accent)">b</text><line x1="288" y1="546" x2="204" y2="560" class="thin" style="stroke:var(--accent)"/>
    <text x="596" y="318" class="key">c</text><line x1="592" y1="320" x2="548" y2="338" class="thin"/>
    <text x="578" y="520" class="key">d</text><line x1="588" y1="520" x2="610" y2="530" class="thin"/>
    <text x="490" y="128" class="key">e</text><line x1="494" y1="132" x2="494" y2="146" class="thin"/>
    <text x="766" y="540" class="key">f</text><line x1="762" y1="542" x2="744" y2="554" class="thin"/>
  </g>
  <!-- title, legend, caption -->
  <text x="480" y="630" text-anchor="middle" class="title">The Still</text>
  <text x="480" y="658" text-anchor="middle" class="leg" xml:space="preserve"><tspan font-style="normal">a.</tspan> The charge: trillions of words.   <tspan font-style="normal" style="fill:var(--accent)">b.</tspan> <tspan style="fill:var(--accent)">The fire: specialized chips, weeks, $100M to $1B a run.</tspan>   <tspan font-style="normal">c.</tspan> The worm: billions of tiny adjustments.</text>
  <text x="480" y="677" text-anchor="middle" class="leg" xml:space="preserve"><tspan font-style="normal">d.</tspan> The receiver: one file, about 100 billion numbers.   <tspan font-style="normal">e.</tspan> The return: each model helps make the next.   <tspan font-style="normal">f.</tspan> The tap: your prompt.</text>
  <line x1="300" y1="691" x2="660" y2="691" class="thin"/>
  <text x="480" y="709" text-anchor="middle" class="cap">DIA-001 · The model is what collects in the flask. What it costs is the fire.</text>
</svg>
