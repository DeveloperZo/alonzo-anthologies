    </pattern>
    <pattern id="p204-x" width="4.5" height="4.5" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="4.5" class="hl"/>
    </pattern>
