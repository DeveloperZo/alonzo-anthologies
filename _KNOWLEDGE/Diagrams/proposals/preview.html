  <title id="p2a-t">DIA-002A · Seventeen Times Over</title>
  <desc id="p2a-d">An engraved plate of two stacks of coins standing on one ground line, each coin worth ten billion dollars. On the left, a short stack: OpenAI's annualized revenue of about 50 billion dollars at the end of September 2026. On the right, a tall column: its compute spending through 2030 in an internal projection reported in September 2026, near 856 billion dollars. A wooden rule between them is marked off in heights of the short stack. The tall column reaches 17.1 on the rule, roughly seventeen times the short one.</desc>

  <title id="p2b-t">DIA-002B · No wheel stops alone</title>
  <desc id="p2b-d">An engraved plate of four toothed wheels on an iron frame, meshed in a closed ring: two large wheels left and right, two small wheels above and below. They are labelled labs, investors, hyperscalers and neoclouds. Arrows show each wheel turning against its neighbours, so each is driven by one and drives the next. One tooth, seated between two teeth of the next wheel, is drawn in rust. A wheel that stops takes the force of the other three on its teeth.</desc>

<svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p3-t p3-d">
  <title id="p3-t">DIA-003 · The runout</title>
  <desc id="p3-d">An engraved plate of a rock face in section, its beds drawn in the manner of a geological survey. A lead climber, drawn as a silhouette in hat, jacket and boots, is high on the face, just above a level marked frontier. Ledges below are marked GPT-3, ChatGPT and GPT-4. The rope runs down from the climber's waist to four anchors clustered near the ground, the highest just above the level marked routine, and then out to a belayer who stands braced on the ground with the rope in both hands. A rust dimension line marks the long stretch of rope between the last anchor and the climber: the runout.</desc>

<svg viewBox="0 0 960 950" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p6a-t p6a-d">
  <title id="p6a-t">DIA-006A · A proof, marked for omissions</title>
  <desc id="p6a-d">An engraved plate of a printer's proof sheet with a red pencil lying on it. Five industry claims are printed down the left as quotations, from Marc Andreessen, Marc Benioff, the Anthropic mission, Yann LeCun and Dario Amodei. Nothing is struck out. Each quotation ends in a red caret, the proof-reader's mark for something left out, and the omission is written beside it in the margin in red pencil.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredericka+the+Great&amp;family=Spectral:ital,wght@0,400;0,600;1,400&amp;display=swap');
      :root { --paper: #F2EEE3; --sheet: #F8F5EC; --ink: #2A2A35; --soft: #6B6873; --accent: #A85B49; }
      @media (prefers-color-scheme: dark) { :root { --paper: #1E2128; --sheet: #262A33; --ink: #E8E5DC; --soft: #B8B5AD; --accent: #D29183; } }
      text { font-family: Spectral, Georgia, "Times New Roman", serif; fill: var(--ink); }
      .paper { fill: var(--paper); }
      .l { fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: var(--ink); stroke-width: 0.7; stroke-linecap: round; }
      .sheet { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.4; stroke-linejoin: round; }
      .b { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.2; stroke-linejoin: round; }
      .h { fill: url(#p6a-h); stroke: none; }
      .hb { fill: url(#p6a-h); stroke: var(--ink); stroke-width: 1.2; stroke-linejoin: round; }
      .hl { stroke: var(--ink); stroke-width: 0.6; }

      .sc { font-size: 11px; letter-spacing: 0.16em; fill: var(--soft); }
      .colh { font-size: 12.5px; font-style: italic; fill: var(--soft); }
      .hd { font-size: 11.5px; letter-spacing: 0.14em; font-weight: 600; }
      .q { font-size: 17px; }
      .by { font-size: 12.5px; font-style: italic; fill: var(--soft); }
      .car { font-size: 26px; font-weight: 600; fill: var(--accent); }
      .mk { font-size: 15.5px; font-style: italic; fill: var(--accent); }
      .ms { font-size: 13px; font-style: italic; }

      <line x1="0" y1="0" x2="0" y2="4.5" class="hl"/>

  <rect width="960" height="950" class="paper"/>
  <rect x="14" y="14" width="932" height="922" class="l" style="stroke-width:1.2"/>
  <rect x="20" y="20" width="920" height="910" class="thin"/>
  <text x="42" y="50" class="sc">PLATE VI</text>
  <text x="918" y="50" text-anchor="end" class="sc">PART I · SECTION 6 · WHAT'S ACTUALLY AT STAKE</text>
  <!-- the proof sheet: x 64 to 896, y 76 to 812, with its shadow and a turned corner -->
  <path d="M 896 112 h 8 V 820 H 74 v -8 H 896 Z" class="h"/>
  <path d="M 64 76 H 868 L 896 104 V 812 H 64 Z" class="sheet"/>
  <path d="M 868 76 V 104 H 896 Z" class="hb"/>
  <text x="104" y="108" class="colh">as printed</text>
  <text x="560" y="108" class="colh">in the reader's pencil</text>
  <line x1="104" y1="116" x2="500" y2="116" class="thin"/>
  <line x1="560" y1="116" x2="856" y2="116" class="thin"/>
  <!-- five entries. heading baseline y = 146 + 124 i. quotation lines at +26, +49, +72. byline two lines below the last quotation line. margin note starts level with the first quotation line -->
  <!-- 1 -->
  <text x="104" y="146" class="hd">I.  PESSIMISTS HAVE ALWAYS BEEN WRONG</text>
  <text x="104" y="172" class="q">“AI is math, code, computers, built and</text>
  <text x="104" y="195" class="q">controlled by people. A mind of its own that</text>
  <text x="104" y="218" class="q">decides to kill us is a superstitious handwave.”<tspan class="car" dx="4" dy="12">^</tspan></text>
  <text x="104" y="240" class="by">Marc Andreessen, a16z, June 2023</text>
  <text x="560" y="172" class="mk">The structural issue isn't the prediction.</text>
  <text x="560" y="192" class="mk">It's whether the system can catch</text>
  <text x="560" y="212" class="mk">its own failures.</text>
  <text x="560" y="233" class="ms">Past panics met oversight that grew with them:</text>
  <text x="560" y="250" class="ms">SEC, OSHA, FDA. CAISI has $10M for FY2026.</text>
  <!-- 2 -->
  <text x="104" y="270" class="hd">II.  AI CREATES MORE JOBS THAN IT DESTROYS</text>
  <text x="104" y="296" class="q">“AI will create more jobs than it eliminates,</text>
  <text x="104" y="319" class="q">just as every previous technology has.”<tspan class="car" dx="4" dy="12">^</tspan></text>
  <text x="104" y="341" class="by">Marc Benioff, Salesforce, 2025</text>
  <text x="560" y="296" class="mk">The aggregate figure is probably correct,</text>
  <text x="560" y="316" class="mk">and almost beside the point.</text>
  <text x="560" y="337" class="ms">The structural problem is timing and distribution.</text>
  <text x="560" y="354" class="ms">See DIA-006B.</text>
  <!-- 3 -->
  <text x="104" y="394" class="hd">III.  LABS GENUINELY CARE ABOUT SAFETY</text>
  <text x="104" y="420" class="q">“The responsible development and maintenance</text>
  <text x="104" y="443" class="q">of advanced AI for the long-term benefit</text>
  <text x="104" y="466" class="q">of humanity.”<tspan class="car" dx="4" dy="12">^</tspan></text>
  <text x="104" y="488" class="by">Anthropic mission</text>
  <text x="560" y="420" class="mk">The safety teams are real. The loop</text>
  <text x="560" y="440" class="mk">is the problem, not the people.</text>
  <text x="560" y="461" class="ms">Even safety-focused labs can't hold the line</text>
  <text x="560" y="478" class="ms">unilaterally if competitors won't.</text>
  <!-- 4 -->
  <text x="104" y="518" class="hd">IV.  OPEN-SOURCE DEMOCRATIZES AI</text>
  <text x="104" y="544" class="q">“Concentration of power through proprietary</text>
  <text x="104" y="567" class="q">AI systems is a much bigger danger</text>
  <text x="104" y="590" class="q">than everything else.”<tspan class="car" dx="4" dy="12">^</tspan></text>
  <text x="104" y="612" class="by">Yann LeCun, Lex Fridman #416, March 2024</text>
  <text x="560" y="544" class="mk">The access argument is real. The power</text>
  <text x="560" y="564" class="mk">argument is more complicated.</text>
  <text x="560" y="585" class="ms">Who extracts value tracks who has the compute.</text>
  <text x="560" y="602" class="ms">Organizations and states outpace individuals.</text>
  <!-- 5 -->
  <text x="104" y="642" class="hd">V.  SLOWING DOWN HANDS THE LEAD TO RIVALS</text>
  <text x="104" y="668" class="q">“If a country like the PRC ends up with the</text>
  <text x="104" y="691" class="q">most powerful AI systems, this could be more</text>
  <text x="104" y="714" class="q">dangerous than any other risk we face.”<tspan class="car" dx="4" dy="12">^</tspan></text>
  <text x="104" y="736" class="by">Dario Amodei, “Machines of Loving Grace,” October 2024</text>
  <text x="560" y="668" class="mk">The race is treated as exogenous.</text>
  <text x="560" y="688" class="mk">It is being constructed.</text>
  <text x="560" y="709" class="ms">Race-as-given forecloses cooperative</text>
  <text x="560" y="726" class="ms">arrangements not yet seriously tried.</text>
  <!-- the pencil, tip at the origin, lying 4 degrees off the line -->
  <g transform="translate(536 764) rotate(3) scale(1.35)">

    <path d="M 30 -7 L 8 -2 V 2 L 30 7 q -4 -2.3 0 -4.6 q -4 -2.4 0 -4.8 q -4 -2.3 0 -4.6 Z" class="b"/>
    <path d="M 8 -2 L 0 0 L 8 2 Z" class="lead"/>
    <path d="M 238 -7 V 7" class="l" style="stroke-width:1.1"/>
    <path d="M 30 -7 H 250 V 7 H 30" class="l" style="stroke-width:1.2"/>
  </g>
  <!-- title, legend, caption -->
  <text x="480" y="864" text-anchor="middle" class="title">A Proof, Marked for Omissions</text>
  <text x="480" y="890" text-anchor="middle" class="leg">The caret is a proof-reader's mark for something left out. Nothing on the sheet is struck through.</text>

  <text x="480" y="922" text-anchor="middle" class="cap">DIA-006A · Five industry claims in their own words, and what each leaves out.</text>

  <text x="180" y="483" class="note">Sabotage in continuation scenarios: 7% for the</text>

  <text x="480" y="599" text-anchor="middle" class="leg">One bead is one case in a hundred. Counted under test conditions, which models can often detect. UK AI Security Institute, 2026.</text>

  <title id="p7a-t">DIA-007A · A wall in six lengths</title>
  <desc id="p7a-d">An engraved plate of one stone wall seen from the front, divided into six lengths, one for each constraint. The first two lengths, the electricity grid and chip supply, are old masonry at full height: the first has a breach with a road running through it, the second is cracked with stones fallen from the top. The next two, product liability and the EU AI Act, are new work: liability is two courses of footing, and the EU AI Act is raised to full height for eight twenty-sevenths of its length and footing for the rest. The fifth length, interpretability, is only pegs and string with a dashed outline where the wall would stand. The sixth, open weights, is bare ground.</desc>

  <title id="p8a-t">DIA-008A · From parameters to paradigm</title>
  <desc id="p8a-d">An engraved plate set as a printed table. A graduated rule runs down the left edge, marked twelve at the top to one at the bottom, for Meadows' twelve leverage points. Brackets group the marks in threes into four tiers: low, medium, high and transformative. The tier names are set larger as leverage grows. Beside each tier the table gives what a push there does and one precedent: a diagnostic tell for the low tier, aviation's ASRS for medium, the Twin Rivers electricity study for high, and Denmark's flexicurity and the Montreal Protocol for transformative.</desc>

  <text x="414" y="174" class="do">Change a number and the system</text>

  <text x="686" y="162" class="lead">A tell, not a precedent</text>
  <text x="686" y="182" class="it">Most lab safety announcements live</text>

  <text x="152" y="349" class="in">loop gain</text>
  <text x="414" y="306" class="do">Shorten the time between harm</text>

  <text x="686" y="348" class="it">No AI equivalent exists.</text>

  <text x="152" y="442" class="tier" style="font-size:27px">High</text>

  <text x="414" y="428" class="do">Change the rules, with enforcement,</text>

  <text x="414" y="468" class="do">structural shifts.</text>

  <text x="414" y="560" class="do">Change the goal and you have moved</text>

  <text x="686" y="534" class="lead">Denmark's flexicurity</text>
  <text x="686" y="552" class="it">The goal: not stable jobs, but</text>
