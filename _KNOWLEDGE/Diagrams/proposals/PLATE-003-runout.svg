<svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p3-t p3-d">
  <title id="p3-t">DIA-003 · The runout</title>
  <desc id="p3-d">An engraved plate of a rock face in section. A lead climber is high on the face, just above a level marked frontier. Ledges below are marked GPT-3, ChatGPT and GPT-4. The rope runs down to four anchors clustered near the ground, the highest just above the level marked routine, and then to a belayer. A rust dimension line marks the long stretch of rope between the last anchor and the climber: the runout.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredericka+the+Great&amp;family=Spectral:ital,wght@0,400;0,600;1,400&amp;display=swap');
      :root { --paper: #F2EEE3; --ink: #2A2A35; --soft: #6B6873; --accent: #A85B49; }
      @media (prefers-color-scheme: dark) { :root { --paper: #1E2128; --ink: #E8E5DC; --soft: #B8B5AD; --accent: #D29183; } }
      text { font-family: Spectral, Georgia, "Times New Roman", serif; fill: var(--ink); }
      .paper { fill: var(--paper); }
      .l { fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: var(--ink); stroke-width: 0.7; stroke-linecap: round; }
      .b { fill: var(--paper); stroke: var(--ink); stroke-width: 1.4; stroke-linejoin: round; }
      .s { fill: var(--ink); }
      .h { fill: url(#p3-h); stroke: none; }
      .hl { stroke: var(--ink); stroke-width: 0.6; }
      .level { fill: none; stroke: var(--soft); stroke-width: 0.7; stroke-dasharray: 1.5 5; stroke-linecap: round; }
      .limb { fill: none; stroke: var(--ink); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
      .body { fill: none; stroke: var(--ink); stroke-width: 5.5; stroke-linecap: round; }
      .rope { fill: none; stroke: var(--ink); stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
      .acc { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linecap: round; }
      .sc { font-size: 11px; letter-spacing: 0.16em; fill: var(--soft); }
      .key { font-size: 17px; font-style: italic; }
      .it { font-size: 13px; font-style: italic; }
      .ledge { font-size: 13px; font-style: italic; text-anchor: end; }
      .leg { font-size: 12.5px; font-style: italic; }
      .cap { font-size: 12.5px; fill: var(--soft); }
      .title { font-family: "Fredericka the Great", "Cormorant Garamond", Georgia, serif; font-size: 32px; letter-spacing: 0.01em; }
    </style>
    <pattern id="p3-h" width="4.5" height="4.5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4.5" class="hl"/>
    </pattern>
    <!-- the rock: face on the right, broken off at the top because it keeps going -->
    <clipPath id="p3-rock">
      <path d="M 40 580 H 522 L 518 548 L 525 508 L 520 452 L 534 446 L 522 440 L 526 398 L 538 391 L 523 386 L 519 330 L 524 282 L 537 276 L 521 270 L 526 214 L 520 160 L 525 110 L 521 78 L 40 84 Z"/>
    </clipPath>
  </defs>
  <rect width="960" height="720" class="paper"/>
  <rect x="14" y="14" width="932" height="692" class="l" style="stroke-width:1.2"/>
  <rect x="20" y="20" width="920" height="680" class="thin"/>
  <text x="42" y="50" class="sc">PLATE III</text>
  <text x="918" y="50" text-anchor="end" class="sc">PART I · SECTION 3 · WHAT'S UNSOLVED AT THAT SPEED</text>
  <!-- levels, running from the rock out across the air: routine 500, expert 410, top human 320, frontier 230 -->
  <g class="level">
    <line x1="40" y1="500" x2="900" y2="500"/><line x1="40" y1="410" x2="900" y2="410"/><line x1="40" y1="320" x2="900" y2="320"/><line x1="40" y1="230" x2="900" y2="230"/>
  </g>
  <text x="900" y="493" text-anchor="end" class="sc">ROUTINE WORK</text>
  <text x="900" y="403" text-anchor="end" class="sc">EXPERT</text>
  <text x="900" y="313" text-anchor="end" class="sc">TOP HUMAN</text>
  <text x="900" y="223" text-anchor="end" class="sc">FRONTIER</text>
  <!-- rock: hatched band behind the face, strata hints, torn top -->
  <path d="M 522 580 L 518 548 L 525 508 L 520 452 L 534 446 L 522 440 L 526 398 L 538 391 L 523 386 L 519 330 L 524 282 L 537 276 L 521 270 L 526 214 L 520 160 L 525 110 L 521 78" style="fill:none;stroke:url(#p3-h);stroke-width:64" clip-path="url(#p3-rock)"/>
  <path d="M 522 580 L 518 548 L 525 508 L 520 452 L 534 446 L 522 440 L 526 398 L 538 391 L 523 386 L 519 330 L 524 282 L 537 276 L 521 270 L 526 214 L 520 160 L 525 110 L 521 78" class="l" style="stroke-width:1.8"/>
  <path d="M 521 78 q -30 8 -60 0 t -60 2 t -60 -2 t -60 2 t -60 -1 t -60 2 t -60 -1 t -61 2" class="thin"/>
  <g class="thin" style="opacity:0.55">
    <path d="M 60 548 q 80 -8 170 2 t 190 -4"/><path d="M 90 468 q 90 6 180 -2 t 160 4"/><path d="M 60 362 q 100 -8 200 0 t 170 -2"/><path d="M 110 262 q 80 6 160 0 t 160 2"/><path d="M 60 168 q 100 -6 190 2 t 180 -2"/><path d="M 300 580 l 14 -60 l -10 -52 M 180 468 l 12 -56 l -8 -50 M 360 362 l 10 -52 l -12 -48 M 220 262 l 12 -50 l -6 -44"/>
  </g>
  <!-- ground on the air side -->
  <rect x="522" y="580" width="400" height="7" class="h"/>
  <line x1="40" y1="580" x2="922" y2="580" class="l"/>
  <!-- ledges already passed -->
  <text x="482" y="450" class="ledge">GPT-3, 2020</text><line x1="488" y1="446" x2="516" y2="446" class="thin"/>
  <text x="482" y="395" class="ledge">ChatGPT, 2022</text><line x1="488" y1="391" x2="518" y2="391" class="thin"/>
  <text x="482" y="280" class="ledge">GPT-4, 2023</text><line x1="488" y1="276" x2="516" y2="276" class="thin"/>
  <!-- anchors: four, close together, all low -->
  <g>
    <line x1="514" y1="550" x2="524" y2="550" class="l" style="stroke-width:2.4"/><circle cx="527" cy="550" r="3.2" class="b"/>
    <line x1="518" y1="524" x2="528" y2="524" class="l" style="stroke-width:2.4"/><circle cx="531" cy="524" r="3.2" class="b"/>
    <line x1="516" y1="500" x2="526" y2="500" class="l" style="stroke-width:2.4"/><circle cx="529" cy="500" r="3.2" class="b"/>
    <line x1="514" y1="474" x2="524" y2="474" class="l" style="stroke-width:2.4"/><circle cx="527" cy="474" r="3.2" class="b"/>
  </g>
  <!-- rope: belayer, through the anchors, up the long bare stretch to the climber -->
  <path d="M 628 552 Q 580 562 527 550 L 531 524 L 529 500 L 527 474 C 536 420 532 340 538 290 C 541 262 540 240 543 226" class="rope"/>
  <!-- the lead climber, just above frontier, facing the rock -->
  <g>
    <circle cx="546" cy="198" r="4.6" class="s"/>
    <path d="M 545 205 L 542 224" class="body"/>
    <path d="M 544 207 L 534 198 L 528 186" class="limb"/>
    <path d="M 544 210 L 534 214 L 527 208" class="limb"/>
    <path d="M 542 224 L 532 232 L 526 228" class="limb"/>
    <path d="M 542 225 L 538 240 L 527 246" class="limb"/>
  </g>
  <!-- the belayer -->
  <g>
    <circle cx="642" cy="537" r="4.8" class="s"/>
    <path d="M 642 544 L 642 562" class="body"/>
    <path d="M 642 562 L 636 580 M 642 562 L 649 580" class="limb"/>
    <path d="M 641 547 L 631 548 L 627 554 M 642 548 L 634 556 L 628 556" class="limb"/>
    <path d="M 628 556 q 6 14 2 24" class="rope"/>
  </g>
  <!-- the runout, dimensioned: last anchor (474) to the climber's waist (224) -->
  <line x1="548" y1="474" x2="596" y2="474" class="acc" style="stroke-width:0.8"/>
  <line x1="552" y1="224" x2="596" y2="224" class="acc" style="stroke-width:0.8"/>
  <line x1="588" y1="230" x2="588" y2="468" class="acc"/>
  <path d="M 583 238 L 588 228 L 593 238 M 583 460 L 588 470 L 593 460" class="acc"/>
  <text x="604" y="342" style="font-size:19px;font-style:italic;fill:var(--accent)">the runout</text>
  <text x="604" y="362" class="it" style="fill:var(--soft)">rope out above</text>
  <text x="604" y="378" class="it" style="fill:var(--soft)">the last anchor</text>
  <!-- birds, for the air -->
  <path d="M 760 150 q 6 -7 12 0 q 6 -7 12 0 M 804 128 q 5 -6 10 0 q 5 -6 10 0 M 726 118 q 4 -5 8 0 q 4 -5 8 0" class="thin"/>
  <!-- keys -->
  <text x="574" y="182" class="key">a</text><line x1="570" y1="184" x2="554" y2="194" class="thin"/>
  <text x="556" y="530" class="key">b</text><line x1="552" y1="524" x2="536" y2="514" class="thin"/>
  <text x="668" y="528" class="key">c</text><line x1="664" y1="530" x2="650" y2="536" class="thin"/>
  <!-- title, legend, caption -->
  <text x="480" y="630" text-anchor="middle" class="title">The Runout</text>
  <text x="480" y="658" text-anchor="middle" class="leg" xml:space="preserve"><tspan font-style="normal">a.</tspan> The lead: what the newest models can do.   <tspan font-style="normal">b.</tspan> Anchors: what we can ensure.   <tspan font-style="normal">c.</tspan> The belay: whoever has to catch it.   Heights are judged, not measured.</text>
  <line x1="300" y1="673" x2="660" y2="673" class="thin"/>
  <text x="480" y="692" text-anchor="middle" class="cap">DIA-003 · The gap does not predict a slip. It sets what a slip would cost, and it grows with every move made above the last anchor.</text>
</svg>
