  <!-- the runout, dimensioned: last anchor (474) to the climber's waist (224) -->
  <line x1="548" y1="474" x2="596" y2="474" class="acc" style="stroke-width:0.8"/>
  <line x1="562" y1="224" x2="596" y2="224" class="acc" style="stroke-width:0.8"/>
