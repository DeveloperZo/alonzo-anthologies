    <path d="M 546.8 202.6 C 550.4 200.8 554 203.4 555 207.6 C 556 212 555.4 215.4 552.8 216.4 L 549.2 215.4 Z" class="fig"/>
    <path d="M 529.4 233 L 533.6 233.2 L 534 238.6 L 531.8 239 L 525.4 240.6 Q 523.4 239.6 525.2 237.6 L 529.4 235.6 Z M 532 256.2 L 536.4 256.6 L 536.6 262 L 534 262.4 L 525 264.2 Q 522.8 263.4 524.4 261.2 L 531.6 258.6 Z" class="fig"/>
    <g transform="translate(541 188.6) rotate(22)"><path d="M 0 -4.9 C 2.9 -4.9 4.2 -2.6 4.1 0 C 4 2.4 2.9 4.2 0.6 4.9 C -0.8 5.6 -2.6 5.4 -3.2 4.2 L -3.5 2.6 L -5 1.5 L -3.9 -0.4 C -4.1 -3 -2.6 -4.9 0 -4.9 Z" class="fig"/><path d="M -4.6 -3.2 C -4.4 -7.6 -2 -8.6 0.6 -8.5 C 3.2 -8.4 4.9 -7 4.8 -3.4 Z" class="fig"/><path d="M -7.6 -2.2 Q -1 -4 7.2 -3.2" style="fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round"/><path d="M -4.5 -4.6 Q 0 -5.6 4.7 -4.9" class="cut" style="stroke-width:0.6"/></g>
    <path d="M 544.4 219.6 L 553.8 222.6" class="cut"/><path d="M 546.2 203.4 L 549.6 215.6" class="cut" style="stroke-width:0.6"/>
