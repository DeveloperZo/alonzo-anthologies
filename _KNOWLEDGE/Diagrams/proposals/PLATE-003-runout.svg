  <text x="604" y="342" style="font-size:19px;font-style:italic;fill:var(--accent)">the runout</text>
  <text x="604" y="362" class="it" style="fill:var(--soft)">rope out above</text>
  <text x="604" y="378" class="it" style="fill:var(--soft)">the last anchor</text>
  <!-- birds, for the air -->
  <path d="M 760 150 q 6 -7 12 0 q 6 -7 12 0 M 804 128 q 5 -6 10 0 q 5 -6 10 0 M 726 118 q 4 -5 8 0 q 4 -5 8 0" class="thin"/>
  <!-- notes beside the parts -->
  <text x="574" y="180" class="it">The lead: what the newest</text>
  <text x="574" y="196" class="it">models can do.</text>
  <text x="546" y="521" class="it">Anchors: what we</text>
  <text x="546" y="537" class="it">can ensure.</text>
  <text x="734" y="530" class="it">The belay: whoever</text>
  <text x="734" y="546" class="it">has to catch it.</text>
  <!-- title, legend, caption -->
  <text x="480" y="630" text-anchor="middle" class="title">The Runout</text>
  <text x="480" y="658" text-anchor="middle" class="leg">Heights are judged, not measured.</text>
  <line x1="300" y1="673" x2="660" y2="673" class="thin"/>
  <text x="480" y="692" text-anchor="middle" class="cap">DIA-003 · The gap does not predict a slip. It sets what a slip would cost, and it grows with every move made above the last anchor.</text>
</svg>
