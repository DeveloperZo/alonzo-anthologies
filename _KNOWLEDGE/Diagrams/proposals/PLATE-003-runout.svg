  <path d="M 521 78 q -30 8 -60 0 t -60 2 t -60 -2 t -60 2 t -60 -1 t -60 2 t -60 -1 t -61 2" class="thin"/>
  <!-- ground on the air side -->
  <rect x="522" y="580" width="400" height="7" class="h"/>
  <line x1="40" y1="580" x2="922" y2="580" class="l"/>
  <!-- ledges already passed -->
  <text x="482" y="450" class="ledge">GPT-3, 2020</text><line x1="488" y1="446" x2="516" y2="446" class="thin"/>
  <text x="482" y="395" class="ledge">ChatGPT, 2022</text><line x1="488" y1="391" x2="518" y2="391" class="thin"/>
  <text x="482" y="280" class="ledge">GPT-4, 2023</text><line x1="488" y1="276" x2="516" y2="276" class="thin"/>
  <!-- anchors: four, close together, all low -->
  <g>
    <line x1="514" y1="550" x2="524" y2="550" class="l" style="stroke-width:2.4"/><circle cx="527" cy="550" r="3.2" class="b"/>
    <line x1="518" y1="524" x2="528" y2="524" class="l" style="stroke-width:2.4"/><circle cx="531" cy="524" r="3.2" class="b"/>
