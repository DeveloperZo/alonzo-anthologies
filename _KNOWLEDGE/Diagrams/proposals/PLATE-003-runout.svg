<svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p3-t p3-d">
  <title id="p3-t">DIA-003 · The runout</title>
  <desc id="p3-d">An engraved plate of a rock face in section, its beds drawn in the manner of a geological survey. A lead climber, drawn as a silhouette in hat, jacket and boots, is high on the face, just above a level marked frontier. Ledges below are marked GPT-3, ChatGPT and GPT-4. The rope runs down from the climber's waist to four anchors clustered near the ground, the highest just above the level marked routine, and then out to a belayer who stands braced on the ground with the rope in both hands. A rust dimension line marks the long stretch of rope between the last anchor and the climber: the runout.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredericka+the+Great&amp;family=Spectral:ital,wght@0,400;0,600;1,400&amp;display=swap');
      :root { --paper: #F2EEE3; --ink: #2A2A35; --soft: #6B6873; --accent: #A85B49; }
      @media (prefers-color-scheme: dark) { :root { --paper: #1E2128; --ink: #E8E5DC; --soft: #B8B5AD; --accent: #D29183; } }
      text { font-family: Spectral, Georgia, "Times New Roman", serif; fill: var(--ink); }
      .paper { fill: var(--paper); }
      .l { fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: var(--ink); stroke-width: 0.7; stroke-linecap: round; }
      .b { fill: var(--paper); stroke: var(--ink); stroke-width: 1.4; stroke-linejoin: round; }
      .s { fill: var(--ink); }
      .fig { fill: var(--ink); stroke: var(--ink); stroke-width: 0.5; stroke-linejoin: round; }
      .cut { fill: none; stroke: var(--paper); stroke-width: 0.9; stroke-linecap: round; }
      .h { fill: url(#p3-h); stroke: none; }
      .hl { stroke: var(--ink); stroke-width: 0.6; }
      .tx { fill: none; stroke: var(--ink); stroke-width: 0.5; stroke-linecap: round; }
      .level { fill: none; stroke: var(--soft); stroke-width: 0.7; stroke-dasharray: 1.5 5; stroke-linecap: round; }
      .rope { fill: none; stroke: var(--ink); stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
      .acc { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linecap: round; }
      .sc { font-size: 11px; letter-spacing: 0.16em; fill: var(--soft); }
      .it { font-size: 13px; font-style: italic; }
      .ledge { font-size: 13px; font-style: italic; text-anchor: end; }
      .leg { font-size: 12.5px; font-style: italic; }
      .cap { font-size: 12.5px; fill: var(--soft); }
      .title { font-family: "Fredericka the Great", "Cormorant Garamond", Georgia, serif; font-size: 32px; letter-spacing: 0.01em; }
    </style>
    <pattern id="p3-h" width="4.5" height="4.5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4.5" class="hl"/>
    </pattern>
    <!-- bed textures, after the survey section: broken dashes, cross-bedding, stipple -->
    <pattern id="p3-dash" width="18" height="9" patternUnits="userSpaceOnUse">
      <path d="M 1 2.5 H 9 M 10 7 H 17" class="tx"/>
    </pattern>
    <pattern id="p3-cross" width="24" height="12" patternUnits="userSpaceOnUse">
      <path d="M 2 4.5 L 11 1.5 M 14 10.5 L 23 7.5" class="tx"/>
    </pattern>
    <pattern id="p3-dot" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="0.55" class="s"/><circle cx="7.5" cy="7.5" r="0.55" class="s"/>
    </pattern>
    <!-- the rock: face on the right, broken off at the top because it keeps going -->
    <path id="p3-face" d="M 522 580 L 518 548 L 525 508 L 520 452 L 534 446 L 522 440 L 526 398 L 538 391 L 523 386 L 519 330 L 524 282 L 537 276 L 521 270 L 521.6 265.4 L 527 264.4 L 522.6 261 L 523.8 241.6 L 528 240.8 L 524.2 237.6 L 526 214 L 520 160 L 525 110 L 521 78"/>
    <clipPath id="p3-rock">
      <path d="M 40 580 H 522 L 518 548 L 525 508 L 520 452 L 534 446 L 522 440 L 526 398 L 538 391 L 523 386 L 519 330 L 524 282 L 537 276 L 521 270 L 521.6 265.4 L 527 264.4 L 522.6 261 L 523.8 241.6 L 528 240.8 L 524.2 237.6 L 526 214 L 520 160 L 525 110 L 521 78 L 40 84 Z"/>
    </clipPath>
  </defs>
  <rect width="960" height="720" class="paper"/>
  <rect x="14" y="14" width="932" height="692" class="l" style="stroke-width:1.2"/>
  <rect x="20" y="20" width="920" height="680" class="thin"/>
  <text x="42" y="50" class="sc">PLATE III</text>
  <text x="918" y="50" text-anchor="end" class="sc">PART I · SECTION 3 · WHAT'S UNSOLVED AT THAT SPEED</text>
  <!-- levels, running from the rock out across the air: routine 500, expert 410, top human 320, frontier 230 -->
  <g class="level">
    <line x1="40" y1="500" x2="900" y2="500"/><line x1="40" y1="410" x2="900" y2="410"/><line x1="40" y1="320" x2="900" y2="320"/><line x1="40" y1="230" x2="900" y2="230"/>
  </g>
  <text x="900" y="493" text-anchor="end" class="sc">ROUTINE WORK</text>
  <text x="900" y="403" text-anchor="end" class="sc">EXPERT</text>
  <text x="900" y="313" text-anchor="end" class="sc">TOP HUMAN</text>
  <text x="900" y="223" text-anchor="end" class="sc">FRONTIER</text>
