  <g>
    <path d="M 695 543.4 L 689.5 559.3 A 3.3 3.3 0 0 0 695.7 561.9 L 703 546.6 A 4.3 4.3 0 0 0 695 543.4 Z M 689.4 559.7 L 688.4 564.7 A 2.9 2.9 0 0 0 694 566.3 L 695.8 561.5 A 3.3 3.3 0 0 0 689.4 559.7 Z M 688.4 564.6 L 686.4 574 A 1.9 1.9 0 0 0 690 575.2 L 694 566.4 A 2.9 2.9 0 0 0 688.4 564.6 Z M 697.2 545.8 L 701 561.4 A 3.3 3.3 0 0 0 707.4 560.2 L 705.6 544.2 A 4.3 4.3 0 0 0 697.2 545.8 Z M 701 561.7 L 702.8 566.3 A 2.9 2.9 0 0 0 708.4 564.7 L 707.4 559.9 A 3.3 3.3 0 0 0 701 561.7 Z M 702.9 566.5 L 707.2 575.3 A 1.9 1.9 0 0 0 710.8 573.9 L 708.3 564.5 A 2.9 2.9 0 0 0 702.9 566.5 Z M 697.1 522.9 L 695.2 543.4 A 4.8 4.8 0 0 0 704.8 544.6 L 708.1 524.3 A 5.5 5.5 0 0 0 697.1 522.9 Z M 704.6 521.4 L 703.9 515.2 A 2 2 0 0 0 699.9 515.6 L 700.2 521.8 A 2.2 2.2 0 0 0 704.6 521.4 Z M 699.6 519.4 L 697.1 524.1 A 5.5 5.5 0 0 0 708.1 523.1 L 704.8 519 A 2.6 2.6 0 0 0 699.6 519.4 Z M 699.2 522.8 L 691.8 532 A 2.1 2.1 0 0 0 695 534.8 L 703.2 526.4 A 2.7 2.7 0 0 0 699.2 522.8 Z M 692.9 531.4 L 685 533.9 A 1.5 1.5 0 0 0 685.8 536.9 L 693.9 535.4 A 2.1 2.1 0 0 0 692.9 531.4 Z M 685.6 533.9 L 682.6 533.4 A 1.6 1.6 0 0 0 682.2 536.6 L 685.2 536.9 A 1.5 1.5 0 0 0 685.6 533.9 Z M 701.7 526.4 L 708.6 536.5 A 2.1 2.1 0 0 0 712.2 534.3 L 706.3 523.6 A 2.7 2.7 0 0 0 701.7 526.4 Z M 708.3 535 L 707.1 543.7 A 1.5 1.5 0 0 0 710.1 544.3 L 712.5 535.8 A 2.1 2.1 0 0 0 708.3 535 Z M 707.2 543.4 L 706.1 545.8 A 1.6 1.6 0 0 0 709.1 547 L 710 544.6 A 1.5 1.5 0 0 0 707.2 543.4 Z" class="fig"/>
