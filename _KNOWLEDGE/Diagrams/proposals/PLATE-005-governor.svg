<svg viewBox="0 0 960 740" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p5-t p5-d">
  <title id="p5-t">DIA-005 · A governor, unpinned</title>
  <desc id="p5-d">An engraved plate of a steam engine. A boiler feeds steam through an open throttle valve to a cylinder and flywheel. A flyball governor spins above the steam pipe with its balls flung wide, but the rod that should connect it to the throttle is missing. A wire from the governor rings a bell instead, and a heap of coal waits by the firebox.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredericka+the+Great&amp;family=Spectral:ital,wght@0,400;0,600;1,400&amp;display=swap');
      :root { --paper: #F2EEE3; --ink: #2A2A35; --soft: #6B6873; --accent: #A85B49; }
      @media (prefers-color-scheme: dark) { :root { --paper: #1E2128; --ink: #E8E5DC; --soft: #B8B5AD; --accent: #D29183; } }
      text { font-family: Spectral, Georgia, "Times New Roman", serif; fill: var(--ink); }
      .paper { fill: var(--paper); }
      .l { fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: var(--ink); stroke-width: 0.7; stroke-linecap: round; }
      .b { fill: var(--paper); stroke: var(--ink); stroke-width: 1.4; stroke-linejoin: round; }
      .s { fill: var(--ink); }
      .h { fill: url(#p5-h); stroke: none; }
      .hb { fill: url(#p5-h); stroke: var(--ink); stroke-width: 1.4; stroke-linejoin: round; }
      .hl { stroke: var(--ink); stroke-width: 0.6; }
      .pipe-o { fill: none; stroke: var(--ink); stroke-width: 15; stroke-linejoin: round; }
      .pipe-i { fill: none; stroke: var(--paper); stroke-width: 12.2; stroke-linejoin: round; }
      .acc { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-linecap: round; }
      .sc { font-size: 11px; letter-spacing: 0.16em; fill: var(--soft); }
      .key { font-size: 17px; font-style: italic; }
      .leg { font-size: 12.5px; font-style: italic; }
      .cap { font-size: 12.5px; fill: var(--soft); }
      .title { font-family: "Fredericka the Great", "Cormorant Garamond", Georgia, serif; font-size: 32px; letter-spacing: 0.01em; }
    </style>
    <pattern id="p5-h" width="4.5" height="4.5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4.5" class="hl"/>
    </pattern>
    <clipPath id="p5-boiler"><rect x="60" y="400" width="230" height="100" rx="50"/></clipPath>
  </defs>
  <rect width="960" height="740" class="paper"/>
  <rect x="14" y="14" width="932" height="712" class="l" style="stroke-width:1.2"/>
  <rect x="20" y="20" width="920" height="700" class="thin"/>
  <text x="42" y="50" class="sc">PLATE V</text>
  <text x="918" y="50" text-anchor="end" class="sc">PART I · SECTION 5 · HOW THESE INTERACT</text>
  <!-- ground -->
  <rect x="40" y="560" width="880" height="7" class="h"/>
  <line x1="40" y1="560" x2="920" y2="560" class="l"/>
  <!-- belt from flywheel shaft to governor, behind everything -->
  <line x1="523" y1="257" x2="829" y2="456" class="thin"/>
  <line x1="517" y1="267" x2="815" y2="480" class="thin"/>
  <!-- chimney and smoke -->
