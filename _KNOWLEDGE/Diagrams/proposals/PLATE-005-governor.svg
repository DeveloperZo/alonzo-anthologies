  <!-- arms and links -->
  <line x1="520" y1="104" x2="452" y2="185" class="l" style="stroke-width:2.2"/>
  <line x1="520" y1="104" x2="588" y2="185" class="l" style="stroke-width:2.2"/>
  <line x1="480" y1="152" x2="509" y2="230" class="l"/>
  <line x1="560" y1="152" x2="531" y2="230" class="l"/>
  <circle cx="480" cy="152" r="2.2" class="s"/><circle cx="560" cy="152" r="2.2" class="s"/>
  <circle cx="520" cy="102" r="5" class="s"/>
  <circle cx="520" cy="91" r="3" class="b"/>
  <!-- balls, flung wide -->
  <circle cx="452" cy="185" r="22" class="b"/>
  <path d="M 432 193 A 22 22 0 0 0 472 193 A 30 30 0 0 1 432 193 Z" class="h"/>
  <circle cx="588" cy="185" r="22" class="b"/>
  <path d="M 568 193 A 22 22 0 0 0 608 193 A 30 30 0 0 1 568 193 Z" class="h"/>
  <path d="M 418 168 q -6 16 0 34 M 410 174 q -4 11 0 22" class="thin"/>
  <path d="M 622 168 q 6 16 0 34 M 630 174 q 4 11 0 22" class="thin"/>
  <!-- sleeve, raised -->
  <rect x="508" y="224" width="24" height="16" class="b"/>
  <rect x="503" y="236" width="34" height="6" class="b"/>
  <!-- lever from sleeve to the left, on its pivot post -->
  <line x1="450" y1="293" x2="450" y2="243" class="l" style="stroke-width:2.2"/>
  <line x1="503" y1="239" x2="414" y2="239" class="l" style="stroke-width:2.6"/>
  <circle cx="450" cy="239" r="3.6" class="b"/>
  <circle cx="414" cy="239" r="3.6" class="b" style="stroke:var(--accent)"/>
  <!-- the rod that is not there -->
  <line x1="409" y1="241" x2="367" y2="256" class="acc" stroke-dasharray="3 4"/>
  <!-- bell: wired to the sleeve instead -->
  <line x1="650" y1="293" x2="650" y2="120" class="l" style="stroke-width:2.2"/>
  <path d="M 650 120 H 692 V 128" class="l" style="stroke-width:2.2"/>
  <path d="M 650 140 L 672 120" class="thin"/>
  <path d="M 692 128 C 678 130 677 152 667 163 L 717 163 C 707 152 706 130 692 128 Z" class="b"/>
  <path d="M 700 134 C 705 142 706 154 712 161 L 717 163 C 707 152 706 130 692 128 Z" class="h"/>
  <circle cx="692" cy="167" r="3" class="s"/>
  <path d="M 537 239 H 646 M 654 239 V 178 L 666 170" class="thin"/>
  <circle cx="650" cy="239" r="3" class="b"/>
  <path d="M 728 138 q 8 10 0 22 M 738 132 q 12 16 0 34 M 748 126 q 16 22 0 46" class="thin"/>
  <!-- cylinder and valve chest -->
  <rect x="572" y="466" width="16" height="94" class="b"/>
  <rect x="652" y="466" width="16" height="94" class="b"/>
  <rect x="634" y="396" width="32" height="16" class="b"/>
  <rect x="560" y="410" width="120" height="56" class="b"/>
  <rect x="560" y="446" width="120" height="20" class="h"/>
  <rect x="560" y="410" width="120" height="56" class="l"/>
  <rect x="553" y="405" width="8" height="66" class="b"/>
  <rect x="679" y="405" width="8" height="66" class="b"/>
  <!-- piston rod, crosshead, connecting rod -->
  <line x1="687" y1="438" x2="724" y2="438" class="l" style="stroke-width:3"/>
  <rect x="722" y="430" width="12" height="16" class="s"/>
  <!-- flywheel -->
  <path d="M 822 468 L 800 560 H 844 Z" class="b"/>
  <circle cx="822" cy="468" r="84" class="hb"/>
  <circle cx="822" cy="468" r="71" class="b"/>
  <g class="l" style="stroke-width:2.4">
    <line x1="822" y1="397" x2="822" y2="539"/>
    <line x1="760.5" y1="432.5" x2="883.5" y2="503.5"/>
    <line x1="760.5" y1="503.5" x2="883.5" y2="432.5"/>
  </g>
  <circle cx="822" cy="468" r="13" class="b"/>
  <line x1="822" y1="468" x2="798" y2="454" class="l" style="stroke-width:4.5"/>
  <line x1="734" y1="438" x2="798" y2="454" class="l" style="stroke-width:3"/>
  <circle cx="798" cy="454" r="4" class="s"/>
  <circle cx="822" cy="468" r="3.4" class="s"/>
  <path d="M 756 392 A 100 100 0 0 1 880 386" class="thin"/>
  <path d="M 880 386 l -9 -1 M 880 386 l -3 -8" class="thin"/>
  <!-- keys and leaders -->
  <text x="262" y="372" class="key">a</text><line x1="262" y1="377" x2="252" y2="402" class="thin"/>
  <text x="905" y="368" class="key">b</text><line x1="903" y1="374" x2="890" y2="412" class="thin"/>
  <text x="546" y="76" class="key">c</text><line x1="542" y1="80" x2="526" y2="94" class="thin"/>
  <text x="383" y="222" class="key" style="fill:var(--accent)">d</text><line x1="387" y1="228" x2="388" y2="243" class="thin" style="stroke:var(--accent)"/>
  <text x="768" y="112" class="key">e</text><line x1="764" y1="114" x2="722" y2="140" class="thin"/>
  <text x="300" y="262" class="key">f</text><line x1="308" y1="266" x2="326" y2="288" class="thin"/>
  <text x="396" y="530" class="key">g</text><line x1="392" y1="530" x2="352" y2="548" class="thin"/>
  <!-- title, legend, caption -->
  <text x="480" y="618" text-anchor="middle" class="title">A Governor, Unpinned</text>
  <text x="480" y="648" text-anchor="middle" class="leg" xml:space="preserve"><tspan font-style="normal">a.</tspan> Boiler: capital and compute.   <tspan font-style="normal">b.</tspan> Flywheel: capability, read as speed.   <tspan font-style="normal">c.</tspan> Governor: oversight. The balls rise with visible harm.</text>
  <text x="480" y="667" text-anchor="middle" class="leg" xml:space="preserve"><tspan font-style="normal" style="fill:var(--accent)">d.</tspan> <tspan style="fill:var(--accent)">Rod to the throttle: never pinned.</tspan>   <tspan font-style="normal">e.</tspan> Bell: rings on harm.   <tspan font-style="normal">f.</tspan> Throttle: open.   <tspan font-style="normal">g.</tspan> Coal: how the bell gets answered.</text>
  <line x1="300" y1="682" x2="660" y2="682" class="thin"/>
  <text x="480" y="702" text-anchor="middle" class="cap">DIA-005 · Every part of a self-correcting engine is here and turning. The one rod that would let it slow itself was left off.</text>
</svg>
