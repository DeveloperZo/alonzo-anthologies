    <circle cx="243" cy="414" r="1.4"/><circle cx="243" cy="432" r="1.4"/><circle cx="243" cy="450" r="1.4"/><circle cx="243" cy="468" r="1.4"/><circle cx="243" cy="486" r="1.4"/>
  </g>
