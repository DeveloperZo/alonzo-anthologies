<svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p5-t p5-d">
  <title id="p5-t">DIA-005 · A governor, unpinned</title>
  <desc id="p5-d">An engraved plate of a large flyball governor standing over a steam pipe. A belt from the flywheel spins it, and its two heavy balls are flung wide. A long lever runs from its raised sleeve toward the throttle valve on the pipe, but the lever ends in an empty eye: the rod that should join it to the throttle is drawn only as a rust dashed line, and the real rod lies on the floor. The other end of the lever pushes a hammer against a bell. By the firebox there is a heap of coal and a shovel.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Spectral:ital,wght@0,400;0,600;1,400&amp;display=swap');
      :root { --paper: #F2EEE3; --ink: #2A2A35; --soft: #6B6873; --accent: #A85B49; }
      @media (prefers-color-scheme: dark) { :root { --paper: #1E2128; --ink: #E8E5DC; --soft: #B8B5AD; --accent: #D29183; } }
      text { font-family: Spectral, Georgia, "Times New Roman", serif; fill: var(--ink); }
      .paper { fill: var(--paper); }
      .l { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: var(--ink); stroke-width: 0.7; stroke-linecap: round; }
      .b { fill: var(--paper); stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; }
      .s { fill: var(--ink); }
      .h { fill: url(#p5-h); stroke: none; }
      .hx { fill: url(#p5-x); stroke: none; }
      .hb { fill: url(#p5-h); stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; }
      .hl { stroke: var(--ink); stroke-width: 0.6; }
      .arm { fill: none; stroke: var(--ink); stroke-linecap: round; }
      .acc { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; }
      .eye { fill: var(--paper); stroke: var(--accent); stroke-width: 2; }
      .sc { font-size: 11px; letter-spacing: 0.16em; fill: var(--soft); }
      .note { font-size: 15px; font-style: italic; }
      .cap { font-size: 12.5px; fill: var(--soft); }
      .title { font-family: "Great Vibes", "Cormorant Garamond", Georgia, serif; font-size: 38px; word-spacing: 0.14em; }
    </style>
    <pattern id="p5-h" width="4.5" height="4.5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4.5" class="hl"/>
    </pattern>
    <pattern id="p5-x" width="4.5" height="4.5" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="4.5" class="hl"/>
    </pattern>
    <clipPath id="p5-view"><rect x="40" y="62" width="880" height="522"/></clipPath>
    <clipPath id="p5-ballL"><circle cx="440" cy="236" r="38"/></clipPath>
    <clipPath id="p5-ballR"><circle cx="680" cy="236" r="38"/></clipPath>
  </defs>
  <rect width="960" height="720" class="paper"/>
  <rect x="14" y="14" width="932" height="692" class="l" style="stroke-width:1.2"/>
  <rect x="20" y="20" width="920" height="680" class="thin"/>
  <text x="42" y="50" class="sc">PLATE V</text>
  <text x="918" y="50" text-anchor="end" class="sc">PART I · SECTION 5 · HOW THESE INTERACT</text>
  <g clip-path="url(#p5-view)">
    <!-- engine-house wall -->
    <rect x="900" y="62" width="20" height="522" class="h"/>
    <line x1="900" y1="62" x2="900" y2="584" class="l"/>
    <!-- flywheel, mostly off the plate: centre (900,700), rim 230 to 206 -->
    <circle cx="900" cy="700" r="230" class="hb"/>
    <circle cx="900" cy="700" r="206" class="b"/>
    <g class="arm" style="stroke-width:7"><line x1="900" y1="700" x2="864.2" y2="497.1"/><line x1="900" y1="700" x2="781.8" y2="531.3"/><line x1="900" y1="700" x2="721.6" y2="597"/></g>
    <g style="stroke:var(--paper);stroke-width:4;stroke-linecap:round"><line x1="900" y1="700" x2="864.6" y2="500"/><line x1="900" y1="700" x2="783.6" y2="534"/><line x1="900" y1="700" x2="724" y2="598.5"/></g>
    <path d="M 748.5 506.1 A 246 246 0 0 1 824 466" class="l"/>
    <path d="M 824 466 l -11 -1 M 824 466 l -5 10" class="l"/>
  </g>
  <!-- floor, with the flywheel pit at the right -->
  <rect x="40" y="560" width="660" height="7" class="h"/>
  <path d="M 40 560 H 700 V 584" class="l"/>
  <!-- governor column, standing behind the steam pipe -->
  <rect x="520" y="544" width="80" height="16" class="b"/>
  <rect x="530" y="532" width="60" height="12" class="b"/>
  <path d="M 543 532 L 577 532 L 572 392 L 548 392 Z" class="b"/>
  <path d="M 566 532 L 577 532 L 572 392 L 563 392 Z" class="h"/>
  <rect x="542" y="384" width="36" height="8" class="b"/>
  <!-- steam pipe, boiler side at left, running through the wall at right -->
  <rect x="40" y="423" width="860" height="34" class="b"/>
  <rect x="40" y="444" width="860" height="13" class="h"/>
  <rect x="40" y="423" width="860" height="34" class="l"/>
  <g class="b"><rect x="127" y="416" width="7" height="48"/><rect x="617" y="416" width="7" height="48"/><rect x="817" y="416" width="7" height="48"/></g>
  <!-- throttle valve: body, flanges, spindle boss and arm -->
  <rect x="204" y="412" width="8" height="56" class="b"/><rect x="288" y="412" width="8" height="56" class="b"/>
  <rect x="212" y="410" width="76" height="60" rx="16" class="b"/>
  <path d="M 212 446 H 288 V 454 Q 288 470 272 470 H 228 Q 212 470 212 454 Z" class="h"/>
  <rect x="212" y="410" width="76" height="60" rx="16" class="l"/>
  <line x1="250" y1="440" x2="300" y2="376" class="arm" style="stroke-width:8"/>
  <line x1="250" y1="440" x2="300" y2="376" style="stroke:var(--paper);stroke-width:5;stroke-linecap:round"/>
  <circle cx="250" cy="440" r="11" class="b"/><circle cx="250" cy="440" r="3.2" class="s"/>
  <circle cx="300" cy="376" r="7" class="eye"/>
  <!-- belt from the flywheel to the governor pulley -->
  <g clip-path="url(#p5-view)" class="l" style="stroke-width:1.3"><line x1="576.7" y1="354.7" x2="927.8" y2="671.2"/><line x1="543.3" y1="389.3" x2="872.2" y2="728.8"/></g>
  <circle cx="560" cy="372" r="24" class="b"/>
  <circle cx="560" cy="372" r="19" class="thin"/>
  <path d="M 560 353 V 391 M 541 372 H 579" class="thin"/>
  <circle cx="560" cy="372" r="5" class="s"/>
  <!-- the lever: left end toward the throttle, fulcrum on a post clamped to the pipe, right end under the bell -->
  <rect x="445" y="419" width="14" height="42" class="b"/>
  <line x1="452" y1="419" x2="452" y2="322" class="arm" style="stroke-width:5"/>
  <rect x="392" y="313" width="342" height="8" class="b"/>
  <circle cx="452" cy="317" r="5" class="b"/><circle cx="452" cy="317" r="1.6" class="s"/>
  <circle cx="386" cy="317" r="7" class="eye"/>
  <circle cx="740" cy="317" r="6" class="b"/>
  <!-- spindle and sleeve -->
  <rect x="556" y="104" width="8" height="246" class="b"/>
  <rect x="549" y="306" width="22" height="22" class="b"/><rect x="561" y="306" width="10" height="22" class="h"/>
  <rect x="543" y="299" width="34" height="7" class="b"/><rect x="543" y="328" width="34" height="7" class="b"/>
  <!-- arms and links -->
  <line x1="553" y1="121" x2="440" y2="236" class="arm" style="stroke-width:5"/>
  <line x1="567" y1="121" x2="680" y2="236" class="arm" style="stroke-width:5"/>
  <line x1="496" y1="179" x2="546" y2="302" class="arm" style="stroke-width:3"/>
  <line x1="624" y1="179" x2="574" y2="302" class="arm" style="stroke-width:3"/>
  <g class="b"><circle cx="496" cy="179" r="4"/><circle cx="624" cy="179" r="4"/><circle cx="546" cy="302" r="3.4"/><circle cx="574" cy="302" r="3.4"/></g>
  <rect x="546" y="110" width="28" height="19" class="b"/>
  <circle cx="553" cy="121" r="2.4" class="s"/><circle cx="567" cy="121" r="2.4" class="s"/>
  <line x1="560" y1="110" x2="560" y2="99" class="arm" style="stroke-width:4"/>
  <circle cx="560" cy="92" r="7.5" class="b"/><path d="M 554 95 A 7.5 7.5 0 0 0 567 94 A 10 10 0 0 1 554 95 Z" class="s"/>
  <!-- the balls, flung wide -->
  <circle cx="440" cy="236" r="38" class="b"/>
  <g clip-path="url(#p5-ballL)"><circle cx="454" cy="252" r="38" class="h"/><circle cx="468" cy="268" r="34" class="hx"/></g>
  <path d="M 412 222 A 30 30 0 0 1 432 206" class="thin"/>
  <circle cx="440" cy="236" r="38" class="l" style="stroke-width:1.8"/>
  <circle cx="680" cy="236" r="38" class="b"/>
  <g clip-path="url(#p5-ballR)"><circle cx="694" cy="252" r="38" class="h"/><circle cx="708" cy="268" r="34" class="hx"/></g>
  <path d="M 652 222 A 30 30 0 0 1 672 206" class="thin"/>
  <circle cx="680" cy="236" r="38" class="l" style="stroke-width:1.8"/>
  <path d="M 392 206 q -10 30 0 60 M 382 216 q -6 20 0 40" class="thin"/>
  <!-- the rod that is not there -->
  <line x1="380" y1="321" x2="306" y2="372" class="acc" stroke-dasharray="5 6"/>
  <!-- bell on a wall bracket, struck from below by the lever's push rod -->
  <path d="M 900 122 H 752" class="arm" style="stroke-width:5"/>
  <path d="M 900 176 Q 842 170 808 124" class="l" style="stroke-width:2.4"/>
  <line x1="760" y1="122" x2="760" y2="138" class="l" style="stroke-width:2.4"/>
  <path d="M 760 136 C 742 138 742 168 728 190 L 792 190 C 778 168 778 138 760 136 Z" class="b"/>
  <path d="M 766 142 C 772 156 774 174 784 190 L 792 190 C 778 168 778 138 760 136 Z" class="h"/>
  <rect x="725" y="188" width="70" height="6" rx="2" class="b"/>
  <circle cx="760" cy="199" r="4" class="s"/>
  <line x1="740" y1="311" x2="740" y2="208" class="l" style="stroke-width:2"/>
  <rect x="733" y="197" width="14" height="11" rx="2" class="s"/>
  <path d="M 806 150 q 8 12 0 26 M 818 142 q 12 20 0 42 M 714 150 q -8 12 0 26" class="thin"/>
  <!-- firebox, coal and shovel -->
  <rect x="40" y="478" width="110" height="82" class="b"/>
  <g class="thin"><path d="M 40 498 H 150 M 40 518 H 150 M 40 538 H 150 M 62 478 v 20 M 106 478 v 20 M 84 498 v 20 M 128 498 v 20 M 54 518 v 20 M 136 518 v 20 M 50 538 v 22 M 140 538 v 22"/></g>
  <rect x="138" y="478" width="12" height="82" class="h"/>
  <rect x="40" y="471" width="116" height="8" class="b"/>
  <path d="M 66 560 V 526 Q 95 500 124 526 V 560 Z" class="b"/>
  <path d="M 74 558 q 2 -18 10 -24 q 0 10 7 14 q 2 -16 10 -24 q 0 14 8 20 q 3 -6 5 -10 q 3 12 2 24" class="l" style="stroke-width:1.2"/>
  <path d="M 164 560 l 8 -15 l 13 4 l 6 -13 l 15 2 l 6 13 l 13 -2 l 9 11 Z" class="hb"/>
  <path d="M 178 560 l 6 -8 l 11 4 M 202 545 l 8 9 M 218 552 l 6 6" class="thin"/>
  <line x1="262" y1="554" x2="246" y2="484" class="arm" style="stroke-width:3"/>
  <path d="M 239 485 h 14" class="l" style="stroke-width:2.4"/>
  <path d="M 255 558 l 15 -4 l 4 -17 l -15 4 Z" class="b"/>
  <!-- the real rod, on the floor, with its pin -->
  <rect x="318" y="545" width="92" height="6" class="b"/>
  <circle cx="314" cy="548" r="6.5" class="b"/><circle cx="314" cy="548" r="2.4" class="thin"/>
  <circle cx="414" cy="548" r="6.5" class="b"/><circle cx="414" cy="548" r="2.4" class="thin"/>
  <path d="M 432 554 h 14 M 432 551 v 6" class="l" style="stroke-width:2.2"/>
  <!-- notes -->
  <text x="602" y="92" class="note">oversight:</text>
  <text x="602" y="110" class="note">it reads the speed correctly</text>
  <line x1="596" y1="96" x2="572" y2="112" class="thin"/>
  <text x="356" y="268" text-anchor="end" class="note" style="fill:var(--accent);font-size:17px">the rod to the throttle</text>
  <text x="356" y="288" text-anchor="end" class="note" style="fill:var(--accent);font-size:17px">was never fitted</text>
  <line x1="334" y1="296" x2="342" y2="340" class="thin" style="stroke:var(--accent)"/>
  <text x="62" y="396" class="note">throttle: wide open</text>
  <line x1="186" y1="400" x2="240" y2="430" class="thin"/>
  <text x="640" y="402" class="note">capability, read as speed</text>
  <line x1="636" y1="398" x2="626" y2="400" class="thin"/>
  <text x="892" y="236" text-anchor="end" class="note">so the alarm rings</text>
  <text x="284" y="510" class="note">and is answered with coal</text>
  <line x1="280" y1="512" x2="238" y2="540" class="thin"/>
  <text x="320" y="537" class="note" style="font-size:12.5px;fill:var(--soft)">the rod, still on the floor</text>
  <!-- title and caption -->
  <text x="480" y="636" text-anchor="middle" class="title">A Governor, Unpinned</text>
  <line x1="300" y1="654" x2="660" y2="654" class="thin"/>
  <text x="480" y="676" text-anchor="middle" class="cap">DIA-005 · The system senses its own speed and sounds the alarm. Nothing connects the alarm to the throttle.</text>
</svg>
