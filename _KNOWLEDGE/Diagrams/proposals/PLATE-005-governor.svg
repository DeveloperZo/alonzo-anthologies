  <path d="M 300 560 l 6 -8 l 10 4 M 322 546 l 8 8 M 336 552 l 6 6" class="thin"/>
  <line x1="372" y1="556" x2="352" y2="486" class="l" style="stroke-width:2.2"/>
  <path d="M 366 558 l 14 -4 l 4 -16 l -14 4 Z" class="b"/>
  <path d="M 346 486 h 12" class="l"/>
  <!-- throttle valve, standing open -->
  <circle cx="340" cy="300" r="17" class="b"/>
  <line x1="326" y1="300" x2="354" y2="300" class="l" style="stroke-width:2.6"/>
  <circle cx="340" cy="300" r="2.4" class="s"/>
  <line x1="340" y1="283" x2="340" y2="268" class="l" style="stroke-width:2.4"/>
