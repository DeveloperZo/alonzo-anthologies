<svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p402-t p402-d">
  <title id="p402-t">DIA-402 · Time Flies When You’re Having Fun</title>
  <desc id="p402-d">A number line running from 30 percent slower with AI on the left to 30 percent faster on the right, with the same work done without AI at the centre. An open mark at 24 percent faster is the developers' forecast before starting. A dark mark at 20 percent faster is what they believed afterward. A large rust mark at 19 percent slower is what the clock measured. A rust bracket under the line spans from the clock's mark to the belief: 39 points between the clock and the feeling. From a randomized trial of 16 experienced developers on 246 issues.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Spectral:ital,wght@0,400;0,600;1,400&amp;display=swap');
      :root { --paper: #F2EEE3; --ink: #2A2A35; --soft: #6B6873; --accent: #A85B49; }
      @media (prefers-color-scheme: dark) { :root { --paper: #1E2128; --ink: #E8E5DC; --soft: #B8B5AD; --accent: #D29183; } }
      text { font-family: Spectral, Georgia, "Times New Roman", serif; fill: var(--ink); }
      .paper { fill: var(--paper); }
      .l { fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: var(--ink); stroke-width: 0.7; stroke-linecap: round; stroke-linejoin: round; }
      .b { fill: var(--paper); stroke: var(--ink); stroke-width: 1.4; stroke-linejoin: round; stroke-linecap: round; }
      .bt { fill: var(--paper); stroke: var(--ink); stroke-width: 0.9; stroke-linejoin: round; }
      .ink { fill: var(--ink); stroke: none; }
      .h { fill: url(#p402-h); stroke: none; }
      .hb { fill: url(#p402-h); stroke: var(--ink); stroke-width: 1.4; stroke-linejoin: round; }
      .hl { stroke: var(--ink); stroke-width: 0.6; }
      .la { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .ba { fill: var(--paper); stroke: var(--accent); stroke-width: 1.4; stroke-linejoin: round; }
      .fa { fill: var(--accent); stroke: none; }
      .sight { fill: none; stroke: var(--soft); stroke-width: 0.7; stroke-dasharray: 5 4; }
      .sc { font-size: 11px; letter-spacing: 0.16em; fill: var(--soft); }
      .it { font-size: 13.5px; font-style: italic; }
      .ita { font-size: 15px; font-style: italic; fill: var(--accent); }
      .sm { font-size: 12px; font-style: italic; fill: var(--soft); }
      .big { font-size: 24px; }
      .biga { font-size: 24px; fill: var(--accent); }
      .cap { font-size: 12.5px; fill: var(--soft); }
      .title { font-family: "Great Vibes", "Cormorant Garamond", Georgia, serif; font-size: 38px; word-spacing: 0.14em; }
      .num { font-size: 26px; } .hugea { font-size: 40px; fill: var(--accent); }
    </style>
    <pattern id="p402-h" width="4.5" height="4.5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4.5" class="hl"/>
    </pattern>
  </defs>
  <rect width="960" height="720" class="paper"/>
  <rect x="14" y="14" width="932" height="692" class="l" style="stroke-width:1.2"/>
  <rect x="20" y="20" width="920" height="680" class="thin"/>
  <text x="42" y="50" class="sc">PLATE II</text>
  <text x="918" y="50" text-anchor="end" class="sc">SAME MENU, DIFFERENT KITCHEN · SECTION 2 · THE PEOPLE WHO SHOULD BE FASTEST</text>
  <text x="125" y="386" class="sc">SLOWER WITH AI</text>
  <text x="815" y="386" text-anchor="end" class="sc">FASTER WITH AI</text>
  <line x1="125" y1="330" x2="815" y2="330" class="l" style="stroke-width:2"/>
  <line x1="125" y1="321" x2="125" y2="339" class="l"/><text x="125" y="358" text-anchor="middle" class="sm">30%</text><line x1="182.5" y1="325" x2="182.5" y2="335" class="thin"/><line x1="240" y1="321" x2="240" y2="339" class="l"/><text x="240" y="358" text-anchor="middle" class="sm">20%</text><line x1="297.5" y1="325" x2="297.5" y2="335" class="thin"/><line x1="355" y1="321" x2="355" y2="339" class="l"/><text x="355" y="358" text-anchor="middle" class="sm">10%</text><line x1="412.5" y1="325" x2="412.5" y2="335" class="thin"/><line x1="470" y1="321" x2="470" y2="339" class="l"/><line x1="527.5" y1="325" x2="527.5" y2="335" class="thin"/><line x1="585" y1="321" x2="585" y2="339" class="l"/><text x="585" y="358" text-anchor="middle" class="sm">10%</text><line x1="642.5" y1="325" x2="642.5" y2="335" class="thin"/><line x1="700" y1="321" x2="700" y2="339" class="l"/><text x="700" y="358" text-anchor="middle" class="sm">20%</text><line x1="757.5" y1="325" x2="757.5" y2="335" class="thin"/><line x1="815" y1="321" x2="815" y2="339" class="l"/><text x="815" y="358" text-anchor="middle" class="sm">30%</text>
  <line x1="470" y1="296" x2="470" y2="364" class="l" style="stroke-width:2"/>
  <text x="470" y="386" text-anchor="middle" class="sm">the same work, without AI</text>
  <!-- forecast -->
  <line x1="746" y1="330" x2="746" y2="160" class="sight" style="stroke:var(--ink)"/>
  <circle cx="746" cy="330" r="9" class="b"/>
  <text x="900" y="124" text-anchor="end" class="num">24% faster</text>
  <text x="900" y="146" text-anchor="end" class="it">their forecast, before starting</text>
  <!-- felt -->
  <line x1="700" y1="330" x2="700" y2="236" class="l"/>
  <circle cx="700" cy="330" r="9" class="ink"/>
  <text x="688" y="232" text-anchor="end" class="num">20% faster</text>
  <text x="688" y="254" text-anchor="end" class="it">what they believed afterward</text>
  <!-- clock -->
  <line x1="251.5" y1="330" x2="251.5" y2="176" class="la"/>
  <circle cx="251.5" cy="330" r="13" class="fa"/>
  <text x="265.5" y="150" text-anchor="middle" class="hugea">19% slower</text>
  <text x="265.5" y="172" text-anchor="middle" class="ita">what the clock measured</text>
  <!-- the gap between the clock and the feeling -->
  <path d="M 251.5 414 v 18 H 700 v -18" class="la"/>
  <text x="475.75" y="480" text-anchor="middle" class="hugea">39 points</text>
  <text x="475.75" y="506" text-anchor="middle" class="ita">between the clock and the feeling</text>
  <text x="480" y="584" text-anchor="middle" class="sm">16 experienced open-source developers, 246 real issues, each assigned by chance to allow AI or bar it. Randomized trial, early-2025 tools.</text>
  <text x="480" y="634" text-anchor="middle" class="title">Time Flies When You’re Having Fun</text>
  <line x1="300" y1="656" x2="660" y2="656" class="thin"/>
  <text x="480" y="679" text-anchor="middle" class="cap">DIA-402 · Developers forecast 24% faster, clocked 19% slower, and still felt 20% faster.</text>
</svg>
