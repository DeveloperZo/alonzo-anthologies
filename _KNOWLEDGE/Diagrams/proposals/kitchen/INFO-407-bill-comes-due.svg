  <text x="42" y="50" class="sc">PLATE VII</text>
  <text x="918" y="50" text-anchor="end" class="sc">SAME MENU, DIFFERENT KITCHEN · SECTION 7 · THE CARD AND THE INVOICE</text>
  <text x="70" y="104" class="sc">THE BILL: AI SPEND PER WEEKLY ACTIVE USER</text>
  <rect x="70" y="238.18" width="133.82" height="133.82" class="hb"/>
  <rect x="225.82" y="136.08" width="235.92" height="235.92" class="fa"/>
