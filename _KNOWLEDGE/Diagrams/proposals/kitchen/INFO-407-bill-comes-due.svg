  <text x="70" y="394" class="it">March 2026</text>
  <text x="225.82" y="394" class="ita">August 2026: about three times the bill</text>
  <text x="520" y="104" class="sc">WHAT IT BOUGHT: SHARE OF THE WORK</text>
  <rect x="520" y="148" width="210.9" height="40" class="hb"/><rect x="730.9" y="148" width="92.5" height="40" class="ink"/><rect x="823.4" y="148" width="66.6" height="40" class="b"/><text x="625.45" y="208" text-anchor="middle" class="it">57%</text><text x="777.15" y="208" text-anchor="middle" class="it">25%</text><text x="520" y="139" class="sm">March 2026</text>
