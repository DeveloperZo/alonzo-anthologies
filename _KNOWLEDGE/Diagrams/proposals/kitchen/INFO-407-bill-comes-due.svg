  <text x="625.45" y="346" text-anchor="middle" class="sm">new features</text>
  <text x="771.6" y="346" text-anchor="middle" class="sm">maintenance</text>
  <text x="853" y="346" text-anchor="middle" class="sm">the rest</text>
  <text x="520" y="394" class="it">The mix of work did not move.</text>
  <text x="70" y="452" class="sc">WHO CHECKS: OF EVERY HUNDRED ORGANIZATIONS, THOSE THAT MEASURE THE IMPACT</text>
