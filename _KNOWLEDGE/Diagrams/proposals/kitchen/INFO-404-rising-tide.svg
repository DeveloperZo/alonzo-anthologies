<svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p404-t p404-d">
  <title id="p404-t">DIA-404 · Rising Tide, Leaky Boats</title>
  <desc id="p404-d">A slope chart with two posts, without AI on the left and with AI on the right. Three lines start from one point on the left, each group's own score without AI set level. The heaviest line climbs steepest: below-average consultants, up 43 percent in quality score. A dashed line climbs to 26.08 percent: developers across three field experiments, tasks completed, with the less experienced gaining more. The shallowest line is above-average consultants, up 17 percent. A rust sentence beneath says that across whole teams delivery stability is still worse where AI use is higher.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Spectral:ital,wght@0,400;0,600;1,400&amp;display=swap');
      :root { --paper: #F2EEE3; --ink: #2A2A35; --soft: #6B6873; --accent: #A85B49; }
      @media (prefers-color-scheme: dark) { :root { --paper: #1E2128; --ink: #E8E5DC; --soft: #B8B5AD; --accent: #D29183; } }
      text { font-family: Spectral, Georgia, "Times New Roman", serif; fill: var(--ink); }
      .paper { fill: var(--paper); }
      .l { fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: var(--ink); stroke-width: 0.7; stroke-linecap: round; stroke-linejoin: round; }
      .b { fill: var(--paper); stroke: var(--ink); stroke-width: 1.4; stroke-linejoin: round; stroke-linecap: round; }
      .bt { fill: var(--paper); stroke: var(--ink); stroke-width: 0.9; stroke-linejoin: round; }
      .ink { fill: var(--ink); stroke: none; }
      .h { fill: url(#p404-h); stroke: none; }
      .hb { fill: url(#p404-h); stroke: var(--ink); stroke-width: 1.4; stroke-linejoin: round; }
      .hl { stroke: var(--ink); stroke-width: 0.6; }
      .la { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .ba { fill: var(--paper); stroke: var(--accent); stroke-width: 1.4; stroke-linejoin: round; }
      .fa { fill: var(--accent); stroke: none; }
      .sight { fill: none; stroke: var(--soft); stroke-width: 0.7; stroke-dasharray: 5 4; }
      .sc { font-size: 11px; letter-spacing: 0.16em; fill: var(--soft); }
      .it { font-size: 13.5px; font-style: italic; }
      .ita { font-size: 15px; font-style: italic; fill: var(--accent); }
      .sm { font-size: 12px; font-style: italic; fill: var(--soft); }
      .big { font-size: 24px; }
      .biga { font-size: 24px; fill: var(--accent); }
      .cap { font-size: 12.5px; fill: var(--soft); }
      .title { font-family: "Great Vibes", "Cormorant Garamond", Georgia, serif; font-size: 38px; word-spacing: 0.14em; }
      .num { font-size: 26px; } .huge { font-size: 46px; }
    </style>
    <pattern id="p404-h" width="4.5" height="4.5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4.5" class="hl"/>
    </pattern>
  </defs>
  <rect width="960" height="720" class="paper"/>
  <rect x="14" y="14" width="932" height="692" class="l" style="stroke-width:1.2"/>
  <rect x="20" y="20" width="920" height="680" class="thin"/>
  <text x="42" y="50" class="sc">PLATE IV</text>
  <text x="918" y="50" text-anchor="end" class="sc">SAME MENU, DIFFERENT KITCHEN · SECTION 4 · TWO KITCHENS, SAME MENU</text>
  <text x="200" y="104" text-anchor="middle" class="sc">WITHOUT AI</text>
  <text x="560" y="104" text-anchor="middle" class="sc">WITH AI</text>
  <line x1="200" y1="118" x2="200" y2="520" class="thin"/>
  <line x1="560" y1="118" x2="560" y2="520" class="thin"/>
  <line x1="200" y1="500" x2="560" y2="500" class="sight"/>
  <line x1="200" y1="500" x2="560" y2="147.4" class="l" style="stroke-width:4;"/><circle cx="560" cy="147.4" r="8" class="ink"/><text x="582" y="153.4" class="huge">+43%</text><text x="732" y="143.4" class="it">below-average performers</text><text x="732" y="160.4" class="sm">consultants, quality score</text><line x1="200" y1="500" x2="560" y2="286.14" class="sight" style="stroke-width:1.4;stroke:var(--ink);"/><circle cx="560" cy="286.14" r="6" class="b"/><text x="582" y="292.14" class="num">+26.08%</text><text x="700" y="282.14" class="it">developers, tasks completed</text><text x="700" y="299.14" class="sm">the less experienced gained more</text><line x1="200" y1="500" x2="560" y2="360.6" class="l" style="stroke-width:2;"/><circle cx="560" cy="360.6" r="6" class="ink"/><text x="582" y="366.6" class="num">+17%</text><text x="660" y="356.6" class="it">above-average performers</text><text x="660" y="373.6" class="sm">consultants, quality score</text>
  <circle cx="200" cy="500" r="8" class="ink"/>
  <text x="182" y="492" text-anchor="end" class="it">each group's own</text>
  <text x="182" y="510" text-anchor="end" class="it">score, set level</text>
  <text x="582" y="505" class="sm">no change</text>
  <text x="60" y="562" class="ita" style="font-size:17px">That is the station. Across whole teams, delivery stability is still worse where AI use is higher.</text>
  <text x="480" y="584" text-anchor="middle" class="sm">A field experiment of 758 consultants, three field experiments covering 4,867 developers, and a survey of about 5,000 (an association).</text>
  <text x="480" y="634" text-anchor="middle" class="title">Rising Tide, Leaky Boats</text>
  <line x1="300" y1="656" x2="660" y2="656" class="thin"/>
  <text x="480" y="679" text-anchor="middle" class="cap">DIA-404 · The weaker performers gain most at the station, 43% against 17%. What reaches the table is decided past it.</text>
</svg>
