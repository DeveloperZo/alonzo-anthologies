<svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p407-t p407-d">
  <title id="p407-t">DIA-407 · The Bill Comes Due</title>
  <desc id="p407-d">Two till receipts hang from one rail, each printed at one line per dollar. The March 2026 receipt is 37 lines long. The August 2026 receipt is 115 lines long, about three times the length, and a rust bracket marks the extra. Below each receipt is the plate it paid for, seen from above and divided by the mix of work: 57 percent new features and 25 percent maintenance in March, 56 percent and 24 percent in August. The two plates look the same. A note says the plates show the mix of work and not its volume, and that in one survey 18 percent of organizations measure the impact of AI at all. Vendor data at list prices.</desc>
