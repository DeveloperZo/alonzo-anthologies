  <!-- notes -->
  <text x="60" y="116" class="it">Every plate stops at the pass,</text>
  <text x="60" y="134" class="it">even on a slammed Friday.</text>
  <text x="590" y="140" class="it">Five out, each one tasted.</text>
  <text x="590" y="158" class="sm">The rest wait their turn.</text>
  <text x="60" y="372" class="it">One chef, a full rail,</text>
  <text x="60" y="390" class="it">and the gate propped up.</text>
  <text x="590" y="396" class="ita">Nine out, none tasted.</text>
  <text x="590" y="416" class="ita">Three should not have left.</text>
  <text x="910" y="306" text-anchor="end" class="sm">to the table</text>
  <text x="910" y="560" text-anchor="end" class="sm">to the table</text>
  <text x="60" y="306" class="sm">from the stations</text>
  <text x="60" y="560" class="sm">from the stations</text>
  <text x="480" y="584" text-anchor="middle" class="sm">Same knives, same Monday, the same 10 plates sent to each pass. At the stations the weaker cooks gained most: 43% against 17%.</text>
  <text x="480" y="634" text-anchor="middle" class="title">Rising Tide, Leaky Boats</text>
