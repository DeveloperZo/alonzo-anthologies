<svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p405-t p405-d">
  <title id="p405-t">DIA-405 · Hurry Up and Wait</title>
  <desc id="p405-d">A bar chart on one scale comparing teams with high AI adoption against teams with low adoption, which sit on the zero line. Finished: epics completed, up 66.2 percent. Shipped: deployments a week, down 11.7 percent, drawn in rust to the left of the line. Broke: incidents a month up 57.9 percent, bugs per developer up 54 percent, and incidents per change up 242.7 percent. A note adds that changes sat in review more than five times as long. Vendor telemetry from 22,000 developers on 4,000 teams, compared and not randomized.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Spectral:ital,wght@0,400;0,600;1,400&amp;display=swap');
      :root { --paper: #F2EEE3; --ink: #2A2A35; --soft: #6B6873; --accent: #A85B49; }
      @media (prefers-color-scheme: dark) { :root { --paper: #1E2128; --ink: #E8E5DC; --soft: #B8B5AD; --accent: #D29183; } }
      text { font-family: Spectral, Georgia, "Times New Roman", serif; fill: var(--ink); }
      .paper { fill: var(--paper); }
      .l { fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: var(--ink); stroke-width: 0.7; stroke-linecap: round; stroke-linejoin: round; }
      .b { fill: var(--paper); stroke: var(--ink); stroke-width: 1.4; stroke-linejoin: round; stroke-linecap: round; }
      .bt { fill: var(--paper); stroke: var(--ink); stroke-width: 0.9; stroke-linejoin: round; }
      .ink { fill: var(--ink); stroke: none; }
      .h { fill: url(#p405-h); stroke: none; }
      .hb { fill: url(#p405-h); stroke: var(--ink); stroke-width: 1.4; stroke-linejoin: round; }
      .hl { stroke: var(--ink); stroke-width: 0.6; }
      .la { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .ba { fill: var(--paper); stroke: var(--accent); stroke-width: 1.4; stroke-linejoin: round; }
      .fa { fill: var(--accent); stroke: none; }
      .sight { fill: none; stroke: var(--soft); stroke-width: 0.7; stroke-dasharray: 5 4; }
      .sc { font-size: 11px; letter-spacing: 0.16em; fill: var(--soft); }
      .it { font-size: 13.5px; font-style: italic; }
      .ita { font-size: 15px; font-style: italic; fill: var(--accent); }
      .sm { font-size: 12px; font-style: italic; fill: var(--soft); }
      .big { font-size: 24px; }
      .biga { font-size: 24px; fill: var(--accent); }
      .cap { font-size: 12.5px; fill: var(--soft); }
      .title { font-family: "Great Vibes", "Cormorant Garamond", Georgia, serif; font-size: 38px; word-spacing: 0.14em; }
      .rl { font-size: 16px; } .num { font-size: 26px; } .numa { font-size: 30px; fill: var(--accent); }
    </style>
    <pattern id="p405-h" width="4.5" height="4.5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4.5" class="hl"/>
    </pattern>
  </defs>
  <rect width="960" height="720" class="paper"/>
  <rect x="14" y="14" width="932" height="692" class="l" style="stroke-width:1.2"/>
  <rect x="20" y="20" width="920" height="680" class="thin"/>
  <text x="42" y="50" class="sc">PLATE V</text>
  <text x="918" y="50" text-anchor="end" class="sc">SAME MENU, DIFFERENT KITCHEN · SECTION 5 · THE PASS</text>
  <text x="60" y="116" class="sc">FINISHED</text><line x1="60" y1="124" x2="900" y2="124" class="thin" style="opacity:0.5"/><text x="332" y="162" text-anchor="end" class="rl">Epics completed</text><rect x="348" y="138" width="112.54" height="36" class="hb"/><text x="472.54" y="166" class="num">+66.2%</text><line x1="348" y1="132" x2="348" y2="180" class="l"/><text x="60" y="212" class="sc">SHIPPED</text><line x1="60" y1="220" x2="900" y2="220" class="thin" style="opacity:0.5"/><text x="312.11" y="258" text-anchor="end" class="rl">Deployments a week</text><rect x="328.11" y="234" width="19.89" height="36" class="fa"/><text x="362" y="262" class="numa">−11.7%</text><text x="900" y="258" text-anchor="end" class="ita">More finished. Less shipped.</text><line x1="348" y1="228" x2="348" y2="276" class="l"/><text x="60" y="308" class="sc">BROKE</text><line x1="60" y1="316" x2="900" y2="316" class="thin" style="opacity:0.5"/><text x="332" y="354" text-anchor="end" class="rl">Incidents a month</text><rect x="348" y="330" width="98.43" height="36" class="hb"/><text x="458.43" y="358" class="num">+57.9%</text><text x="332" y="406" text-anchor="end" class="rl">Bugs per developer</text><rect x="348" y="382" width="91.8" height="36" class="hb"/><text x="451.8" y="410" class="num">+54%</text><text x="332" y="458" text-anchor="end" class="rl">Incidents per change</text><rect x="348" y="434" width="412.59" height="36" class="hb"/><text x="772.59" y="462" class="num">+242.7%</text><line x1="348" y1="324" x2="348" y2="476" class="l"/><text x="348" y="496" text-anchor="middle" class="sm">teams that use AI little</text><text x="900" y="496" text-anchor="end" class="it">Changes sat in review more than five times as long.</text><text x="480" y="584" text-anchor="middle" class="sm">Teams with high AI adoption against low. Vendor telemetry from 22,000 developers on 4,000 teams, compared, not assigned.</text>
  <text x="480" y="634" text-anchor="middle" class="title">Hurry Up and Wait</text>
  <line x1="300" y1="656" x2="660" y2="656" class="thin"/>
  <text x="480" y="679" text-anchor="middle" class="cap">DIA-405 · Teams using AI heavily finished more, shipped less often and broke more, on one scale.</text>
</svg>
