  <path d="M 565.81 517.01 h 0.01 M 548.29 513.35 h 0.01 M 579.58 514.49 h 0.01 M 546.9 516.4 h 0.01 M 538.55 515.75 h 0.01 M 568.02 516.23 h 0.01 M 563.8 514.53 h 0.01 M 536.47 515.98 h 0.01 M 557.06 516.85 h 0.01 M 522.01 515.06 h 0.01 M 545.69 513.36 h 0.01 M 550.54 517.84 h 0.01 M 568.9 516.4 h 0.01 M 577.46 515.15 h 0.01 M 517.96 516.64 h 0.01 M 577.41 513.67 h 0.01 M 564.01 513.27 h 0.01 M 548.36 517.89 h 0.01 M 559.46 516.96 h 0.01 M 544.77 513.43 h 0.01 M 555 514.99 h 0.01 M 552.77 516.74 h 0.01 M 572.75 517.37 h 0.01 M 579.36 517.3 h 0.01 M 569.88 517.01 h 0.01 M 530.72 515.05 h 0.01 M 561.48 514.49 h 0.01 M 576.33 515.24 h 0.01 M 527.59 513.82 h 0.01 M 592.92 516.66 h 0.01 M 535.62 514.09 h 0.01 M 544.18 517.5 h 0.01 M 572.89 514.66 h 0.01 M 545.73 513.92 h 0.01 M 530.37 515.91 h 0.01 M 560.98 515.85 h 0.01 M 539.51 517.86 h 0.01 M 587.92 515.01 h 0.01 M 538.8 515.94 h 0.01 M 539.91 516.64 h 0.01 M 531.55 516.05 h 0.01 M 552.52 513.14 h 0.01 M 568.51 514.96 h 0.01 M 558.08 515.98 h 0.01 M 561.01 514.26 h 0.01 M 534.95 515.82 h 0.01 M 584.22 514.37 h 0.01 M 554.94 513.05 h 0.01 M 547.33 517.78 h 0.01 M 585.3 515.3 h 0.01 M 592.14 517.27 h 0.01 M 540.19 512.81 h 0.01 M 561.86 515.93 h 0.01 M 545.26 515.24 h 0.01 M 564.57 515.89 h 0.01 M 571.52 516.77 h 0.01 M 561.58 515.9 h 0.01 M 550.02 516.26 h 0.01 M 538.3 517.55 h 0.01 M 567.26 513.34 h 0.01 M 544.34 517.78 h 0.01 M 577.15 517.13 h 0.01 M 546.65 514.89 h 0.01 M 516.9 515.86 h 0.01 M 566.3 517.82 h 0.01 M 586.14 513.94 h 0.01 M 548.06 517.44 h 0.01 M 591.15 514.85 h 0.01 M 591.42 515.49 h 0.01 M 544.75 515.98 h 0.01" style="fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round"/>
  <path d="M 846 520 V 458 H 906 V 520 Z" class="b"/><path d="M 890 458 H 906 V 520 H 890 Z" class="h"/><rect x="842" y="444" width="68" height="14" class="hb"/><rect x="866" y="436" width="20" height="8" class="b"/>
  <text x="868" y="492" text-anchor="middle" class="lab">SUGAR</text>
  <!-- the recipe card on its stand -->
  <path d="M 664 520 L 684 474 M 806 520 L 786 474" class="l" style="stroke-width:2.2"/>
  <g transform="rotate(-3 738 330)">
    <rect x="660" y="197" width="170" height="278" class="h"/>
    <rect x="653" y="190" width="170" height="278" class="b"/>
    <text x="738" y="226" text-anchor="middle" class="lab" style="font-size:13px;letter-spacing:0.28em">THE SAUCE</text>
    <line x1="671" y1="238" x2="805" y2="238" class="thin"/>
    <path d="M 673 266 h 130 M 673 286 h 108 M 673 306 h 124 M 673 326 h 86 M 673 346 h 116" class="thin" style="opacity:0.55"/>
    <text x="673" y="392" class="it">To finish, it</text>
    <text x="673" y="410" class="it">should taste</text>
    <text x="673" y="446" class="big" style="font-style:italic;font-size:30px">sweet.</text>
  </g>
  <!-- the gap: the path never reaches the card -->
  <path d="M 412 262 H 600" class="la" style="stroke-dasharray:7 5"/><path d="M 600 252 v 20" class="la"/>
  <text x="418" y="244" class="ita">The spoon never reaches the card.</text>
  <!-- notes -->
  <text x="62" y="118" class="it">The cook tastes his sauce with his</text>
  <text x="62" y="136" class="it">own spoon, from his own pot.</text>
  <text x="62" y="162" class="sm">It tastes like what he made.</text>
  <text x="462" y="450" class="sm">the salt: what went in</text>
  <text x="910" y="410" text-anchor="end" class="sm">the sugar:</text>
  <text x="910" y="426" text-anchor="end" class="sm">lid still on</text>
  <text x="480" y="566" text-anchor="middle" class="sm">Shown code with a bug in it, AI models judging a test's expected answer were about 6 to 16 points less accurate.</text>
  <text x="480" y="634" text-anchor="middle" class="title">Tasting From Your Own Pot</text>
  <line x1="300" y1="656" x2="660" y2="656" class="thin"/>
  <text x="480" y="679" text-anchor="middle" class="cap">DIA-406 · A test written from the code tastes the cook’s own sauce. It cannot tell him the card said sweet.</text>
</svg>
