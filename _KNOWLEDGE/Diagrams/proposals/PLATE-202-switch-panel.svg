      .mk { font-size: 10.5px; letter-spacing: 0.18em; text-anchor: middle; fill: var(--soft); }
      .pr { font-size: 13.5px; font-weight: 600; letter-spacing: 0.14em; text-anchor: middle; }
    </style>
