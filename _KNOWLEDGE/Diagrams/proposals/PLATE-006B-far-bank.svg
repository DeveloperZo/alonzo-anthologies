<svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p6b-t p6b-d">
  <title id="p6b-t">DIA-006B · The far bank</title>
  <desc id="p6b-d">An engraved plate of a gorge seen in section. On the near bank stands a short stone pier, 92 million jobs displaced. On the far bank stands a taller pier, 170 million jobs created. No span joins them. Two measuring lines in rust cross the gap, which is drawn to a scale of years: 20 to 30 years for the internet transition, and 40 years, the full width, for the first industrial revolution. A note at the near edge names the 6.1 million US workers who stand closest to it.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Spectral:ital,wght@0,400;0,600;1,400&amp;display=swap');
      :root { --paper: #F2EEE3; --ink: #2A2A35; --soft: #6B6873; --accent: #A85B49; }
      @media (prefers-color-scheme: dark) { :root { --paper: #1E2128; --ink: #E8E5DC; --soft: #B8B5AD; --accent: #D29183; } }
      text { font-family: Spectral, Georgia, "Times New Roman", serif; fill: var(--ink); }
      .paper { fill: var(--paper); }
      .l { fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: var(--ink); stroke-width: 0.7; stroke-linecap: round; }
      .b { fill: var(--paper); stroke: var(--ink); stroke-width: 1.4; stroke-linejoin: round; }
      .h { fill: url(#p6b-h); stroke: none; }
      .hb { fill: url(#p6b-h); stroke: var(--ink); stroke-width: 1.4; stroke-linejoin: round; }
      .hl { stroke: var(--ink); stroke-width: 0.6; }
      .x { fill: url(#p6b-x); stroke: none; }
      .m { fill: url(#p6b-m); stroke: var(--ink); stroke-width: 1.6; stroke-linejoin: round; }
      .wave { fill: none; stroke: var(--ink); stroke-width: 0.6; }
      .sight { fill: none; stroke: var(--soft); stroke-width: 0.7; stroke-dasharray: 5 4; }
      .dim { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: butt; }
      .dimd { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-dasharray: 7 5; }
      .dimt { fill: none; stroke: var(--accent); stroke-width: 1.4; stroke-linecap: round; }
      .sc { font-size: 11px; letter-spacing: 0.16em; fill: var(--soft); }
      .it { font-size: 13.5px; font-style: italic; }
      .big { font-size: 19px; text-anchor: middle; }
      .lab { font-size: 13px; font-style: italic; text-anchor: middle; }
      .yr { font-size: 17px; fill: var(--accent); }
      .yn { font-size: 13.5px; font-style: italic; fill: var(--accent); }
      .tick { font-size: 11px; text-anchor: middle; fill: var(--soft); }
      .leg { font-size: 12.5px; font-style: italic; }
      .cap { font-size: 12.5px; fill: var(--soft); }
      .title { font-family: "Great Vibes", "Cormorant Garamond", Georgia, serif; font-size: 38px; word-spacing: 0.14em; }
    </style>
    <pattern id="p6b-h" width="4.5" height="4.5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4.5" class="hl"/>
    </pattern>
    <pattern id="p6b-x" width="4.5" height="4.5" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="4.5" class="hl"/>
    </pattern>
    <!-- masonry: one course is 15 units high = 10 million jobs. two courses per tile, joints staggered. tile anchored on the ground line y = 400 -->
    <pattern id="p6b-m" width="48" height="30" patternUnits="userSpaceOnUse" patternTransform="translate(60 400)">
      <rect width="48" height="30" class="paper"/>
      <path d="M 0 0 H 48 M 0 15 H 48 M 0 30 H 48 M 24 0 V 15 M 12 15 V 30 M 36 15 V 30" class="thin" style="stroke-width:0.9"/>
    </pattern>
    <pattern id="p6b-w" width="60" height="26" patternUnits="userSpaceOnUse" patternTransform="translate(0 566)">
      <g class="wave"><path d="M 0 5 q 15 -4 30 0 t 30 0"/><path d="M 0 13 q 15 4 30 0 t 30 0"/><path d="M 0 20 q 15 -3 30 0 t 30 0"/></g>
    </pattern>
  </defs>
  <rect width="960" height="720" class="paper"/>
  <rect x="14" y="14" width="932" height="692" class="l" style="stroke-width:1.2"/>
  <rect x="20" y="20" width="920" height="680" class="thin"/>
  <text x="42" y="50" class="sc">PLATE VI</text>
  <text x="918" y="50" text-anchor="end" class="sc">PART I · SECTION 6 · WHAT'S ACTUALLY AT STAKE</text>
  <text x="480" y="100" text-anchor="middle" class="it" style="font-size:15px">The World Economic Forum projects 92 million jobs displaced</text>
  <text x="480" y="120" text-anchor="middle" class="it" style="font-size:15px">and 170 million created by 2030: net positive, on paper.</text>
  <!-- horizontal scale: 11.2 units = 1 year. near brink x = 200 (year 0), far brink x = 760 (year 50) -->
  <!-- vertical scale of the piers: 1.5 units = 1 million jobs. near pier 92M = 138 high, far pier 170M = 255 high -->
  <!-- the banks, in section -->
  <path d="M 30 400 H 200 L 205 420 L 197 442 L 209 470 L 203 500 L 215 530 L 211 556 L 222 590 H 30 Z" class="hb"/>
  <path d="M 200 400 L 205 420 L 197 442 L 209 470 L 203 500 L 215 530 L 211 556 L 222 590 H 176 L 168 556 L 172 530 L 160 500 L 166 470 L 154 442 L 162 420 L 158 400 Z" class="x"/>
  <path d="M 930 400 H 760 L 755 420 L 764 446 L 752 474 L 758 504 L 746 532 L 750 560 L 738 590 H 930 Z" class="hb"/>
  <g class="l" style="stroke-width:1">
    <path d="M 30 452 q 40 -6 80 0 t 86 -4"/><path d="M 30 512 q 50 5 96 0 t 80 2"/><path d="M 30 560 q 44 -5 90 0 t 92 -2"/>
    <path d="M 762 450 q 40 5 84 0 t 84 2"/><path d="M 756 510 q 44 -5 88 0 t 86 -2"/><path d="M 750 562 q 46 5 92 0 t 88 2"/>
  </g>
  <!-- the river at the bottom -->
  <rect x="222" y="566" width="516" height="24" style="fill:url(#p6b-w)"/>
  <line x1="30" y1="590" x2="930" y2="590" class="l"/>
  <!-- near pier: 92 million. x 60 to 156, top y = 400 - 138 = 262 -->
  <rect x="60" y="262" width="96" height="138" class="m"/>
  <rect x="136" y="262" width="20" height="138" class="h"/>
  <rect x="60" y="262" width="96" height="138" class="l" style="stroke-width:1.6"/>
  <!-- far pier: 170 million. x 804 to 900, top y = 400 - 255 = 145 -->
  <rect x="804" y="145" width="96" height="255" class="m"/>
  <rect x="880" y="145" width="20" height="255" class="h"/>
  <rect x="804" y="145" width="96" height="255" class="l" style="stroke-width:1.6"/>
  <!-- footings: the lowest 9 units of each pier, 7 units proud each side. they add no height -->
  <rect x="53" y="391" width="110" height="9" class="b"/><rect x="141" y="391" width="22" height="9" class="h"/><rect x="53" y="391" width="110" height="9" class="l"/>
  <rect x="797" y="391" width="110" height="9" class="b"/><rect x="885" y="391" width="22" height="9" class="h"/><rect x="797" y="391" width="110" height="9" class="l"/>
  <line x1="30" y1="400" x2="200" y2="400" class="l" style="stroke-width:1.8"/>
  <line x1="760" y1="400" x2="930" y2="400" class="l" style="stroke-width:1.8"/>
  <!-- turf on the bank tops -->
  <path d="M 36 400 l -2 -6 M 42 400 l 1 -5 M 172 400 l -2 -6 M 178 400 l 1 -7 M 185 400 l 2 -5 M 193 400 l 1 -6 M 198 400 l 3 -5 M 762 400 l -3 -5 M 768 400 l -1 -6 M 775 400 l 2 -6 M 783 400 l -1 -5 M 790 400 l 2 -6 M 914 400 l -1 -6 M 921 400 l 2 -5 M 927 400 l 1 -6" class="thin"/>
  <text x="108" y="230" class="big">92 million</text>
  <text x="108" y="248" class="lab">displaced</text>
  <text x="852" y="113" class="big">170 million</text>
  <text x="852" y="131" class="lab">created</text>
  <!-- where a span would run. none is drawn in ink -->
  <path d="M 214 400 H 750 M 214 409 H 750" class="sight"/>
  <text x="480" y="390" text-anchor="middle" class="it" style="fill:var(--soft);font-size:12.5px">no span</text>
  <!-- extension lines up from the two brinks -->
  <path d="M 200 392 V 206 M 760 392 V 296" class="sight"/>
  <!-- measure one: the internet transition, 20 to 30 years. 200 to 424 solid, 424 to 536 dashed -->
  <line x1="200" y1="222" x2="424" y2="222" class="dim"/>
  <line x1="424" y1="222" x2="536" y2="222" class="dimd"/>
  <path d="M 200 213 V 231 M 424 213 V 231 M 536 213 V 231" class="dimt"/>
  <text x="212" y="204"><tspan class="yr">20 to 30 years</tspan><tspan class="yn" dx="10">the internet transition, before replacement work arrived</tspan></text>
  <!-- measure two: the first industrial revolution, half a century. 200 to 760 -->
  <line x1="200" y1="312" x2="760" y2="312" class="dim"/>
  <path d="M 200 303 V 321 M 760 303 V 321 M 312 312 V 319 M 424 312 V 319 M 536 312 V 319 M 648 312 V 319" class="dimt"/>
  <text x="212" y="294"><tspan class="yr">half a century</tspan><tspan class="yn" dx="10">the first industrial revolution: UK productivity grew, real wages barely moved</tspan></text>
  <text x="212" y="337" class="tick" style="text-anchor:start">0</text><text x="312" y="337" class="tick">10</text><text x="424" y="337" class="tick">20</text><text x="536" y="337" class="tick">30</text><text x="648" y="337" class="tick">40</text><text x="748" y="337" class="tick" style="text-anchor:end">50 years</text>
  <!-- notes in the gap -->
  <path d="M 252 446 Q 224 436 207 408" class="thin"/>
  <text x="258" y="450" class="it">Nearest the edge: 6.1 million US workers,</text>
  <text x="258" y="468" class="it">4.2% of the workforce. Clerical and administrative,</text>
  <text x="258" y="486" class="it">86% women, in smaller metro areas.</text>
  <text x="712" y="486" text-anchor="end" class="it" style="fill:var(--soft)">How wide the gap is for AI</text>
  <text x="712" y="504" text-anchor="end" class="it" style="fill:var(--soft)">is contested.</text>
  <!-- title, legend, caption -->
  <text x="480" y="634" text-anchor="middle" class="title">The Far Bank</text>
  <text x="480" y="660" text-anchor="middle" class="leg">Each course of stone is 10 million jobs. The gap is drawn to the scale of years marked across it.</text>
  <line x1="300" y1="674" x2="660" y2="674" class="thin"/>
  <text x="480" y="692" text-anchor="middle" class="cap">DIA-006B · More is built on the far side. The last two crossings took 20 to 30 years, and half a century.</text>
</svg>
