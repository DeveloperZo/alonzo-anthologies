<svg viewBox="0 0 1000 940" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d107-title d107-desc">
  <title id="d107-title">DIA-107 · Components: what each piece of the home library is, and why it is there</title>
  <desc id="d107-desc">A table with four columns: name, what it is, why it is here, and where. It reads top to bottom in five groups. Who sends the work: Claude Code, the harness, a frontier tool that plans the work and checks the results, and hands token-heavy work to the local models to cut frontier token cost; it runs on either machine. The models: Ollama, the model runtime, a native Windows program on port 11434 with no key, the only thing here that runs models; and the graphics card, an RTX 5080 with 16 GB of graphics memory, where models run. The front door: LiteLLM, the relay, a Docker container on port 4000 that needs a key, giving every tool one address and one key and one place to record use. Things you open: Open WebUI, a chat page in the browser on port 3000; Langfuse, a dashboard of seven containers on port 3001 that stores every request sent through the relay; and Jellyfin, a media server on port 8096. Underneath: Tailscale, a private network between the owner's machines, on both machines; and Docker Desktop, the program that runs containers on Windows, started by hand. Two note rows follow. Retired: LM Studio, a second model runtime that did the same job as Ollama, retired on 2026-11-18. Later: a memory layer (Qdrant, n8n) and version control for E:\WHL, not built.</desc>
  <defs>
    <style>
