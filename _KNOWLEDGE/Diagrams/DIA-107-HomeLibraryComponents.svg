        --bg: #FAFAF8; --paper: #F2EEE3; --text: #2A2A35; --muted: #6B6873; --muted2: #9D9A95; --line: #E2DFD6;
        --red: #A85B49;   --red-soft: #EDD8CE;
        --amber: #A28438; --amber-soft: #F0E5CD;
        --blue: #4F627F;  --blue-soft: #DEE3EC;
        --green: #5A8270; --green-soft: #DEE8E1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1B1D23; --paper: #1E2128; --text: #E8E5DC; --muted: #B8B5AD; --muted2: #908D87; --line: #3E3D38;
          --red: #D29183;   --red-soft: #3D2925;
          --amber: #D6B574; --amber-soft: #3B3220;
          --blue: #94A6C4;  --blue-soft: #2A323F;
          --green: #92BAA6; --green-soft: #233029;
        }
      }
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      text.m, tspan.m { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
      [fill="#FAFAF8"] { fill: var(--bg); } [fill="#F2EEE3"] { fill: var(--paper); }
      [fill="#2A2A35"] { fill: var(--text); } [stroke="#2A2A35"] { stroke: var(--text); }
      [fill="#6B6873"] { fill: var(--muted); } [fill="#9D9A95"] { fill: var(--muted2); }
      [fill="#E2DFD6"] { fill: var(--line); } [stroke="#E2DFD6"] { stroke: var(--line); } [stroke="#9D9A95"] { stroke: var(--muted2); } [stroke="#6B6873"] { stroke: var(--muted); }
      [fill="#A85B49"] { fill: var(--red); } [stroke="#A85B49"] { stroke: var(--red); } [fill="#EDD8CE"] { fill: var(--red-soft); }
      [fill="#A28438"] { fill: var(--amber); } [stroke="#A28438"] { stroke: var(--amber); } [fill="#F0E5CD"] { fill: var(--amber-soft); }
      [fill="#4F627F"] { fill: var(--blue); } [stroke="#4F627F"] { stroke: var(--blue); } [fill="#DEE3EC"] { fill: var(--blue-soft); }
      [fill="#5A8270"] { fill: var(--green); } [stroke="#5A8270"] { stroke: var(--green); } [fill="#DEE8E1"] { fill: var(--green-soft); }
    </style>
    <marker id="d107-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L9,5 L0,9 Z" fill="#4F627F"/></marker>
  </defs>
  <rect width="1000" height="940" fill="#F2EEE3"/>

  <!-- header -->
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#A85B49" letter-spacing="0.04em">DIA-107 · COMPONENTS</text>
  <text x="500" y="58" text-anchor="middle" font-size="14" fill="#6B6873">What is each piece, and why is it here?</text>

  <!-- column heads: NAME 24-190, WHAT 200-480, WHY 490-780, WHERE 790-976 -->
  <g font-size="12" font-weight="700" fill="#6B6873" letter-spacing="0.03em">
    <text x="24" y="97">NAME</text>
    <text x="200" y="97">WHAT IT IS</text>
    <text x="490" y="97">WHY IT IS HERE</text>
    <text x="790" y="97">WHERE</text>
  </g>

  <!-- group bands (22 high) -->
  <g fill="#FAFAF8" stroke="#E2DFD6" stroke-width="1">
    <rect x="24" y="104" width="952" height="22" rx="4"/>
    <rect x="24" y="188" width="952" height="22" rx="4"/>
    <rect x="24" y="334" width="952" height="22" rx="4"/>
    <rect x="24" y="418" width="952" height="22" rx="4"/>
    <rect x="24" y="626" width="952" height="22" rx="4"/>
  </g>
  <g font-size="12" font-weight="700" fill="#6B6873" letter-spacing="0.03em">
    <text x="34" y="119.5">WHO SENDS THE WORK</text>
    <text x="34" y="203.5">THE MODELS</text>
    <text x="34" y="349.5">THE FRONT DOOR</text>
    <text x="34" y="433.5">THINGS YOU OPEN</text>
    <text x="34" y="641.5">UNDERNEATH</text>
  </g>

  <!-- hairline rules between rows inside a group, and around the notes -->
  <g stroke="#E2DFD6" stroke-width="1">
    <line x1="24" y1="272" x2="976" y2="272"/>
    <line x1="24" y1="502" x2="976" y2="502"/>
    <line x1="24" y1="564" x2="976" y2="564"/>
    <line x1="24" y1="710" x2="976" y2="710"/>
    <line x1="24" y1="782" x2="976" y2="782"/>
    <line x1="24" y1="816" x2="976" y2="816"/>
    <line x1="24" y1="850" x2="976" y2="850"/>
  </g>

  <!-- row 1: Claude Code, top 126 -->
  <rect x="24" y="140" width="24" height="16" rx="8" fill="#DEE3EC" stroke="#4F627F" stroke-width="2"/>
  <text x="58" y="154" font-size="16" font-weight="700" fill="#4F627F">Claude Code</text>
  <text x="58" y="172" font-size="13" fill="#4F627F">(the harness)</text>
  <text x="200" y="153" font-size="13" fill="#2A2A35">A frontier tool. It plans the work,</text>
  <text x="200" y="171" font-size="13" fill="#2A2A35">decides, and checks the results</text>
  <text x="490" y="153" font-size="13" font-style="italic" fill="#2A2A35">Hands token-heavy work to the local</text>
  <text x="490" y="171" font-size="13" font-style="italic" fill="#2A2A35">models, to cut frontier token cost</text>
  <text x="790" y="153" font-size="13" fill="#6B6873">caller, on either machine</text>
  <text x="790" y="171" font-size="13" fill="#6B6873">limesalt or lemonpepper</text>

  <!-- row 2: Ollama, top 210 -->
  <rect x="24" y="233" width="24" height="16" rx="2" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="58" y="247" font-size="16" font-weight="700" fill="#5A8270">Ollama</text>
  <text x="200" y="237" font-size="13" fill="#2A2A35">The model runtime. It loads a local</text>
  <text x="200" y="255" font-size="13" fill="#2A2A35">model and writes the answers</text>
  <text x="490" y="237" font-size="13" font-style="italic" fill="#2A2A35">The only thing here that runs models.</text>
  <text x="490" y="255" font-size="13" font-style="italic" fill="#2A2A35">Both relay routes end at it</text>
  <text x="790" y="237" font-size="13" fill="#6B6873">native Windows program</text>
  <rect x="790" y="242" width="58" height="18" rx="4" fill="#FAFAF8" stroke="#5A8270" stroke-width="1"/>
  <text class="m" x="819" y="255.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5A8270">:11434</text>
  <text x="856" y="255" font-size="13" fill="#6B6873">no key</text>

  <!-- row 3: Graphics card, top 272 -->
  <rect x="24.5" y="295.5" width="23" height="15" rx="2" fill="#FAFAF8" stroke="#6B6873" stroke-width="3"/>
  <text x="58" y="309" font-size="16" font-weight="700" fill="#6B6873">Graphics card</text>
  <text x="200" y="299" font-size="13" fill="#2A2A35">An RTX 5080 graphics card with</text>
  <text x="200" y="317" font-size="13" fill="#2A2A35">16 GB of graphics memory</text>
  <text x="490" y="299" font-size="13" font-style="italic" fill="#2A2A35">Where models run. A model must fit</text>
  <text x="490" y="317" font-size="13" font-style="italic" fill="#2A2A35">in 16 GB to run at full speed</text>
  <text x="790" y="299" font-size="13" fill="#6B6873">hardware</text>
  <text x="790" y="317" font-size="13" fill="#6B6873">inside lemonpepper</text>

  <!-- row 4: LiteLLM, top 356 -->
  <rect x="24" y="370" width="24" height="16" rx="6" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="58" y="384" font-size="16" font-weight="700" fill="#5A8270">LiteLLM</text>
  <text x="58" y="402" font-size="13" fill="#5A8270">(the relay)</text>
  <text x="200" y="383" font-size="13" fill="#2A2A35">One address that takes every request</text>
  <text x="200" y="401" font-size="13" fill="#2A2A35">and passes it to a model by route</text>
  <text x="490" y="383" font-size="13" font-style="italic" fill="#2A2A35">One address and one key for every</text>
  <text x="490" y="401" font-size="13" font-style="italic" fill="#2A2A35">tool, and one place to record use</text>
  <text x="790" y="383" font-size="13" fill="#6B6873">Docker container</text>
  <rect x="790" y="388" width="50" height="18" rx="4" fill="#FAFAF8" stroke="#5A8270" stroke-width="1"/>
  <text class="m" x="815" y="401.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5A8270">:4000</text>
  <text x="848" y="401" font-size="13" fill="#6B6873">needs a key</text>

  <!-- row 5: Open WebUI, top 440 -->
  <rect x="24" y="463" width="24" height="16" rx="6" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="58" y="477" font-size="16" font-weight="700" fill="#5A8270">Open WebUI</text>
  <text x="200" y="467" font-size="13" fill="#2A2A35">A chat page in the browser, for</text>
  <text x="200" y="485" font-size="13" fill="#2A2A35">talking to the local models</text>
  <text x="490" y="467" font-size="13" font-style="italic" fill="#2A2A35">Lets a person use the local models</text>
  <text x="490" y="485" font-size="13" font-style="italic" fill="#2A2A35">without code or a terminal</text>
  <text x="790" y="467" font-size="13" fill="#6B6873">Docker container</text>
  <rect x="790" y="472" width="50" height="18" rx="4" fill="#FAFAF8" stroke="#5A8270" stroke-width="1"/>
  <text class="m" x="815" y="485.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5A8270">:3000</text>
  <text x="848" y="485" font-size="13" fill="#6B6873">open in a browser</text>

  <!-- row 6: Langfuse, top 502 -->
  <rect x="29" y="529" width="20" height="13" rx="5" fill="#DEE8E1" stroke="#5A8270" stroke-width="1.5"/>
  <rect x="24" y="524" width="20" height="13" rx="5" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="58" y="539" font-size="16" font-weight="700" fill="#5A8270">Langfuse</text>
  <text x="200" y="529" font-size="13" fill="#2A2A35">A dashboard that stores every request</text>
  <text x="200" y="547" font-size="13" fill="#2A2A35">sent through the relay</text>
  <text x="490" y="529" font-size="13" font-style="italic" fill="#2A2A35">Shows what was asked, which model</text>
  <text x="490" y="547" font-size="13" font-style="italic" fill="#2A2A35">answered and how long it took</text>
  <text x="790" y="529" font-size="13" fill="#6B6873">Docker, 7 containers</text>
  <rect x="790" y="534" width="50" height="18" rx="4" fill="#FAFAF8" stroke="#5A8270" stroke-width="1"/>
  <text class="m" x="815" y="547.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5A8270">:3001</text>
  <text x="848" y="547" font-size="13" fill="#6B6873">open in a browser</text>

  <!-- row 7: Jellyfin, top 564 -->
  <rect x="24" y="587" width="24" height="16" rx="6" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="58" y="601" font-size="16" font-weight="700" fill="#5A8270">Jellyfin</text>
  <text x="200" y="591" font-size="13" fill="#2A2A35">A media server for movies, shows</text>
  <text x="200" y="609" font-size="13" fill="#2A2A35">and music</text>
  <text x="490" y="591" font-size="13" font-style="italic" fill="#2A2A35">Your own media on your other devices.</text>
  <text x="490" y="609" font-size="13" font-style="italic" fill="#2A2A35">Nothing else here depends on it</text>
  <text x="790" y="591" font-size="13" fill="#6B6873">Docker container</text>
  <rect x="790" y="596" width="50" height="18" rx="4" fill="#FAFAF8" stroke="#5A8270" stroke-width="1"/>
  <text class="m" x="815" y="609.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5A8270">:8096</text>
  <text x="848" y="609" font-size="13" fill="#6B6873">open in a browser</text>

  <!-- row 8: Tailscale, top 648 -->
  <rect x="24" y="671" width="24" height="16" rx="2" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="58" y="685" font-size="16" font-weight="700" fill="#5A8270">Tailscale</text>
  <text x="200" y="675" font-size="13" fill="#2A2A35">A private network between your own</text>
  <text x="200" y="693" font-size="13" fill="#2A2A35">machines (the tailnet)</text>
  <text x="490" y="675" font-size="13" font-style="italic" fill="#2A2A35">The laptop's way in when away. One</text>
  <text x="490" y="693" font-size="13" font-style="italic" fill="#2A2A35">name for the desktop, home or away</text>
  <text x="790" y="675" font-size="13" fill="#6B6873">native Windows program</text>
  <text x="790" y="693" font-size="13" fill="#6B6873">on both machines</text>

  <!-- row 9: Docker Desktop, top 710 -->
  <rect x="24" y="733" width="24" height="16" rx="2" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="58" y="747" font-size="16" font-weight="700" fill="#5A8270">Docker Desktop</text>
  <text x="200" y="737" font-size="13" fill="#2A2A35">The program that runs containers</text>
  <text x="200" y="755" font-size="13" fill="#2A2A35">(packaged services) on Windows</text>
  <text x="490" y="737" font-size="13" font-style="italic" fill="#2A2A35">The four services above ship as</text>
  <text x="490" y="755" font-size="13" font-style="italic" fill="#2A2A35">containers. This runs them here</text>
  <text x="790" y="737" font-size="13" fill="#6B6873">native Windows program</text>
  <text x="790" y="755" font-size="13" fill="#6B6873">started by hand</text>

  <!-- note rows (34 high): 782-816, 816-850 -->
  <rect x="24" y="791" width="24" height="16" rx="2" fill="#FAFAF8" stroke="#9D9A95" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="58" y="803.5" font-size="12" font-weight="700" fill="#6B6873" letter-spacing="0.03em">RETIRED</text>
  <text x="124" y="803.5" font-size="13" fill="#6B6873">LM Studio: a second model runtime that did the same job as Ollama. Retired on 2026-11-18, replaced by Ollama.</text>
  <rect x="24" y="825" width="24" height="16" rx="2" fill="#FAFAF8" stroke="#9D9A95" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="58" y="837.5" font-size="12" font-weight="700" fill="#6B6873" letter-spacing="0.03em">LATER</text>
  <text x="124" y="837.5" font-size="13" fill="#6B6873">A memory layer (Qdrant, n8n) and version control for <tspan class="m" font-size="12.5" font-weight="600">E:\WHL</tspan>. Not built.</text>

  <!-- legend, one row at y 882 -->
  <g font-size="12.5" fill="#6B6873">
    <rect x="24" y="874" width="24" height="16" rx="2" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
    <text x="56" y="886.5">native Windows program</text>
    <rect x="216" y="874" width="24" height="16" rx="6" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
    <text x="248" y="886.5">Docker container</text>
    <rect x="368.5" y="874.5" width="23" height="15" rx="2" fill="#FAFAF8" stroke="#6B6873" stroke-width="3"/>
    <text x="400" y="886.5">hardware</text>
    <rect x="476" y="874" width="24" height="16" rx="8" fill="#DEE3EC" stroke="#4F627F" stroke-width="2"/>
    <text x="508" y="886.5">caller</text>
    <rect x="566" y="874" width="24" height="16" rx="2" fill="#FAFAF8" stroke="#9D9A95" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="598" y="886.5">retired or later</text>
    <rect x="712" y="873" width="50" height="18" rx="4" fill="#FAFAF8" stroke="#5A8270" stroke-width="1"/>
    <text class="m" x="737" y="886.5" text-anchor="middle" font-weight="600" fill="#5A8270">:4000</text>
    <text x="770" y="886.5">a port number</text>
  </g>

  <!-- caption -->
  <text x="500" y="918" text-anchor="middle" font-size="13.5" font-weight="600" fill="#A85B49">DIA-107 · Components: what each piece of the home library is, and why it is there.</text>
</svg>
