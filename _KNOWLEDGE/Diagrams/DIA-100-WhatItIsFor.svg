<svg viewBox="0 0 1000 610" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s100-title s100-desc">
  <title id="s100-title">DIA-100 · What this repository is for</title>
  <desc id="s100-desc">A plain-language overview. On the left is Zo's computer, which holds one folder with four series of work. The website: essays and an illustrated series, the pages people read. The resume: an interactive resume; its cover letters stay off the site. The home library: our own AI at home, which has its own set of pictures. Checking AI work: a way to check what AI did, plans only, nothing built yet. The same folder also holds the project notes, which are never published. On the right is the one road to the public website, in three steps. One: Zo sends the changes up to the online copy (GitHub), which keeps a copy of the whole folder in public. Two: the online copy tells the publisher (Cloudflare Pages), which makes web pages from the website and the resume only. Three: the publisher puts the pages up on the live site, alonzo-anthologies.pages.dev, where anyone can read the essays, the series and the resume. The small grey print under each box is the real name of the program or folder.</desc>
