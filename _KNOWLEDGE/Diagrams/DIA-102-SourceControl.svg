<svg viewBox="0 0 1000 632" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s102-title s102-desc">
  <title id="s102-title">DIA-102 · Where the work lives</title>
  <desc id="s102-desc">One road, left to right. On the left, Zo's computer (the working copy). It holds the work: every page, picture and program. New work exists only there until it is sent. It also holds the secrets folder (_ENV), with a key to the publisher account, which stays on the computer and is never sent up. Zo sends the changes up (git push) to the online copy on GitHub, which is public. Inside the online copy is the main copy (the main branch), the version the live site is made from. From there the publisher takes over, shown in DIA-103. Before sending, Zo checks by hand that no password is going along; nothing else checks. Two things are left over. The old shelf (GitLab, archived) held the work for a few hours and was closed on 2026-10-14; nothing goes there. The old duplicate site (zo-garden) still gets every change made to the main copy, until it is retired.</desc>
  <defs>
    <style>
