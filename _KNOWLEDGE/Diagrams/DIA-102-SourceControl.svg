  <text x="174.0" y="495" font-size="13" fill="#6B6873" text-anchor="middle">closed 2026-10-14, nothing goes there</text>
  <text x="174.0" y="514" font-size="11" fill="#6B6873" text-anchor="middle">GitLab, archived</text>
  <rect x="516" y="430" width="268" height="92" rx="12" fill="#FAFAF8" stroke="#6B6873" stroke-width="2" stroke-dasharray="6,4"/>
