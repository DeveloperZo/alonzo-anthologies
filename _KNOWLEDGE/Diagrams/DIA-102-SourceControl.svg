  <text x="344" y="290" font-size="13" fill="#2A2A35">Zo checks by hand that</text>
  <text x="344" y="308" font-size="13" fill="#2A2A35">no password is going</text>
  <text x="344" y="326" font-size="13" fill="#2A2A35">along. Nothing else</text>
  <text x="344" y="344" font-size="13" fill="#2A2A35">checks.</text>
  <rect x="500" y="84" width="300" height="166" rx="14" fill="none" stroke="#9D9A95" stroke-width="1.5"/>
  <text x="516" y="106" font-size="12" fill="#6B6873" font-weight="700" letter-spacing="0.03em">THE ONLINE COPY</text>
  <text x="516" y="123" font-size="12" fill="#6B6873">GitHub · public, anyone can read it</text>
  <rect x="516" y="140" width="268" height="92" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="650.0" y="166" text-anchor="middle" font-size="16" font-weight="700" fill="#5A8270">THE MAIN COPY</text>
  <text x="650.0" y="187" text-anchor="middle" font-size="13" fill="#5A8270">the version that counts</text>
  <text x="650.0" y="205" text-anchor="middle" font-size="13" fill="#5A8270">the live site is made from it</text>
  <text x="650.0" y="224" text-anchor="middle" font-size="11" fill="#6B6873">the main branch</text>
  <line x1="784" y1="186" x2="853" y2="186" stroke="#4F627F" stroke-width="2.5" marker-end="url(#s102-blue)"/>
  <text x="864" y="174" font-size="12.5" fill="#4F627F" font-weight="600">then the</text>
  <text x="864" y="190" font-size="12.5" fill="#4F627F" font-weight="600">publisher</text>
  <text x="864" y="206" font-size="12.5" fill="#4F627F" font-weight="600">takes over</text>
  <text x="864" y="224" font-size="11" fill="#6B6873">see DIA-103</text>
