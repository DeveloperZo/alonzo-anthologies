  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#A85B49" letter-spacing="0.04em">DIA-104 · HOW THE SITE IS PUT TOGETHER</text>
  <text x="500" y="58" font-size="14" fill="#6B6873" text-anchor="middle">How do Zo's written pages and the resume app become the one folder that gets published?</text>
