<svg viewBox="0 0 1000 608" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s105-title s105-desc">
  <title id="s105-title">DIA-105 · Resume app: from Zo's facts to the pages and the PDF</title>
  <desc id="s105-desc">Left to right. The data files hold Zo's facts: jobs, projects and dates, the summary and key skills, and the menu words and colors. To change the resume, change these files and nothing else. Every page of the resume app reads from them. The printed resume view is the resume laid out for printing, showing only the jobs chosen for print. The other pages are a timeline, the accomplishments, and a page for each job; they show every job. Only the printed resume view has a Download PDF button. The PDF is pictures of that view, not text: the app takes a picture of the view in the visitor's web browser, cuts it into page-sized strips, and saves one picture per page. The words in the PDF cannot be searched, selected or copied, and a program that reads resumes sees no words at all. A text version is planned.</desc>
  <defs>
    <style>
      :root {
        --bg: #FAFAF8; --paper: #F2EEE3; --text: #2A2A35; --muted: #6B6873; --muted2: #9D9A95; --line: #E2DFD6;
        --red: #A85B49; --blue: #4F627F; --blue-soft: #DEE3EC; --green: #5A8270; --green-soft: #DEE8E1; --amber: #A28438; --amber-soft: #F0E5CD;
      }
      @media (prefers-color-scheme: dark) {
