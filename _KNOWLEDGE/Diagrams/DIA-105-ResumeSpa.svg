  <text x="330" y="310" font-size="12.5" fill="#4F627F" text-anchor="middle" font-weight="600">the same</text>
  <text x="330" y="326" font-size="12.5" fill="#4F627F" text-anchor="middle" font-weight="600">facts</text>
  <text x="692" y="150" font-size="12.5" fill="#A28438" text-anchor="middle" font-weight="600">the Download</text>
