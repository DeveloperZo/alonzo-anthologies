  <text x="390" y="440" font-size="12" fill="#6B6873" font-weight="700" letter-spacing="0.03em">HOW THE PDF IS MADE</text>
  <text x="390" y="464" font-size="13.5" fill="#2A2A35">The app takes a picture of the printed</text>
