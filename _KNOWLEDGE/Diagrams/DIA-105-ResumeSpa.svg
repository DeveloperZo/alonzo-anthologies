  <text x="861.0" y="195" text-anchor="middle" font-size="13" fill="#A28438">one picture per page</text>
  <text x="861.0" y="214" text-anchor="middle" font-size="11" fill="#6B6873">Alonzo_Williams_Resume.pdf</text>
