<svg viewBox="0 0 1010 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dia101-title dia101-desc">
  <title id="dia101-title">DIA-101 · The whole system: from the owner's machine to the live site</title>
  <desc id="dia101-desc">Reads left to right. On the owner's machine the repo holds the public writing (site/content), the resume app (resumeContent), the project docs (_KNOWLEDGE, never published) and a gitignored Cloudflare token (_ENV). Step 1: the owner commits and pushes to the GitHub repo DeveloperZo/alonzo-anthologies, whose main branch is production. Step 2: Cloudflare's GitHub App tells the Cloudflare Pages project alonzo-anthologies to build. Step 3: Cloudflare runs build.sh; Quartz turns site/content into pages while the StageResumeSpa step builds the resume app, and both land in site/public. Step 4: main is published at alonzo-anthologies.pages.dev, other branches at preview addresses. Step 5: visitors read the site at / and the resume app at /resume/. A dashed row below shows what is left over: the archived GitLab project, read-only and fed by nothing, and the legacy zo-garden Pages project, which the same GitHub repo still feeds on every push, so zo-garden.pages.dev serves a duplicate of the current build.</desc>
