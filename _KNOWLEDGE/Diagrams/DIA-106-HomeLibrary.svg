<svg viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d106-title d106-desc">
  <title id="d106-title">DIA-106 · Home library: who does what work</title>
  <desc id="d106-desc">Reads left to right. On the left, Claude Code is the harness. It runs on limesalt or lemonpepper, and it plans, decides and checks the result. A gray arrow runs up from it to the frontier model in the cloud, which is paid per token: the harness keeps the thinking there. A blue arrow runs right from the harness into the desktop, lemonpepper, where local models cost nothing per token: the harness hands over token-heavy work, and the result comes back to the harness. On the desktop the work arrives at LiteLLM, the relay, which is one address with one key and passes the work to a model. LiteLLM passes it right to Ollama, which runs the local models and costs electricity and time only. LiteLLM also sends a record up to Langfuse, which keeps a record of every request and shows how much work went local. Below, in a group called also on the desktop, Open WebUI is a chat page in a browser that uses the same models through LiteLLM, and Jellyfin is a media server for movies, shows and music that connects to nothing else.</desc>
  <defs>
    <style>
      :root {
        --bg: #FAFAF8; --paper: #F2EEE3; --text: #2A2A35; --muted: #6B6873; --muted2: #9D9A95; --line: #E2DFD6;
        --red: #A85B49;   --red-soft: #EDD8CE;
        --amber: #A28438; --amber-soft: #F0E5CD;
        --blue: #4F627F;  --blue-soft: #DEE3EC;
        --green: #5A8270; --green-soft: #DEE8E1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1B1D23; --paper: #1E2128; --text: #E8E5DC; --muted: #B8B5AD; --muted2: #908D87; --line: #3E3D38;
          --red: #D29183;   --red-soft: #3D2925;
          --amber: #D6B574; --amber-soft: #3B3220;
          --blue: #94A6C4;  --blue-soft: #2A323F;
          --green: #92BAA6; --green-soft: #233029;
        }
      }
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      text.m, tspan.m { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
      [fill="#FAFAF8"] { fill: var(--bg); } [fill="#F2EEE3"] { fill: var(--paper); }
      [fill="#2A2A35"] { fill: var(--text); } [stroke="#2A2A35"] { stroke: var(--text); }
      [fill="#6B6873"] { fill: var(--muted); } [fill="#9D9A95"] { fill: var(--muted2); }
      [fill="#E2DFD6"] { fill: var(--line); } [stroke="#E2DFD6"] { stroke: var(--line); } [stroke="#9D9A95"] { stroke: var(--muted2); } [stroke="#6B6873"] { stroke: var(--muted); }
      [fill="#A85B49"] { fill: var(--red); } [stroke="#A85B49"] { stroke: var(--red); } [fill="#EDD8CE"] { fill: var(--red-soft); }
      [fill="#A28438"] { fill: var(--amber); } [stroke="#A28438"] { stroke: var(--amber); } [fill="#F0E5CD"] { fill: var(--amber-soft); }
      [fill="#4F627F"] { fill: var(--blue); } [stroke="#4F627F"] { stroke: var(--blue); } [fill="#DEE3EC"] { fill: var(--blue-soft); }
      [fill="#5A8270"] { fill: var(--green); } [stroke="#5A8270"] { stroke: var(--green); } [fill="#DEE8E1"] { fill: var(--green-soft); }
    </style>
    <marker id="d106-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L9,5 L0,9 Z" fill="#4F627F"/></marker>
    <marker id="d106-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L9,5 L0,9 Z" fill="#6B6873"/></marker>
  </defs>
  <rect width="1000" height="660" fill="#F2EEE3"/>
  <!-- header -->
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#A85B49" letter-spacing="0.04em">DIA-106 · HOME LIBRARY: WHO DOES WHAT WORK</text>
  <text x="500" y="58" text-anchor="middle" font-size="14" fill="#6B6873">What is this system for?</text>
  <!-- frames -->
  <rect x="430" y="90" width="546" height="470" rx="14" fill="none" stroke="#9D9A95" stroke-width="1.5"/>
  <text x="448" y="114" font-size="12" font-weight="700" fill="#6B6873" letter-spacing="0.03em">DESKTOP · lemonpepper · LOCAL MODELS, NO COST PER TOKEN</text>
  <rect x="440" y="420" width="526" height="128" rx="8" fill="none" stroke="#9D9A95" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="452" y="438" font-size="12" font-weight="700" fill="#6B6873" letter-spacing="0.03em">ALSO ON THE DESKTOP</text>
  <!-- arrows -->
  <line x1="144" y1="290" x2="144" y2="198" stroke="#6B6873" stroke-width="2.5" marker-end="url(#d106-gray)"/>
  <line x1="264" y1="338" x2="447" y2="338" stroke="#4F627F" stroke-width="2.5" marker-end="url(#d106-blue)"/>
  <line x1="685" y1="338" x2="718" y2="338" stroke="#4F627F" stroke-width="2.5" marker-end="url(#d106-blue)"/>
  <line x1="567.5" y1="296" x2="567.5" y2="223" stroke="#4F627F" stroke-width="2.5" marker-end="url(#d106-blue)"/>
  <line x1="635" y1="446" x2="635" y2="383" stroke="#4F627F" stroke-width="2.5" marker-end="url(#d106-blue)"/>
  <!-- node: frontier model (caller pill, gray) -->
  <rect x="24" y="110" width="240" height="84" rx="42" fill="#FAFAF8" stroke="#6B6873" stroke-width="2"/>
  <text x="144" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#6B6873">FRONTIER MODEL</text>
  <text x="144" y="158" text-anchor="middle" font-size="13" fill="#6B6873">in the cloud</text>
  <text x="144" y="176" text-anchor="middle" font-size="13" font-style="italic" fill="#6B6873">paid per token</text>
  <!-- node: the harness (caller pill, blue) -->
  <rect x="24" y="290" width="240" height="96" rx="48" fill="#DEE3EC" stroke="#4F627F" stroke-width="2"/>
  <text x="144" y="316" text-anchor="middle" font-size="16" font-weight="700" fill="#4F627F">CLAUDE CODE</text>
  <text x="144" y="335" text-anchor="middle" font-size="13" font-weight="600" fill="#4F627F">the harness</text>
  <text x="144" y="354" text-anchor="middle" font-size="13" font-style="italic" fill="#4F627F">plans, decides, checks the result</text>
  <text x="144" y="372" text-anchor="middle" font-size="13" fill="#4F627F">on limesalt or lemonpepper</text>
  <!-- node: Langfuse (container stack, green) -->
  <rect x="456" y="136" width="235" height="84" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <rect x="450" y="130" width="235" height="84" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="567.5" y="156" text-anchor="middle" font-size="16" font-weight="700" fill="#5A8270">LANGFUSE</text>
  <text x="567.5" y="178" text-anchor="middle" font-size="13" fill="#5A8270">keeps a record of every request</text>
  <text x="567.5" y="198" text-anchor="middle" font-size="13" font-style="italic" fill="#5A8270">shows how much work went local</text>
  <!-- node: LiteLLM (container, green) -->
  <rect x="450" y="296" width="235" height="84" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="567.5" y="322" text-anchor="middle" font-size="16" font-weight="700" fill="#5A8270">LITELLM (the relay)</text>
  <text x="567.5" y="344" text-anchor="middle" font-size="13" fill="#5A8270">one address, one key</text>
  <text x="567.5" y="364" text-anchor="middle" font-size="13" font-style="italic" fill="#5A8270">passes the work to a model</text>
  <!-- node: Ollama (native, green) -->
  <rect x="721" y="296" width="235" height="84" rx="2" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="838.5" y="322" text-anchor="middle" font-size="16" font-weight="700" fill="#5A8270">OLLAMA</text>
  <text x="838.5" y="344" text-anchor="middle" font-size="13" fill="#5A8270">runs the local models</text>
  <text x="838.5" y="364" text-anchor="middle" font-size="13" font-style="italic" fill="#5A8270">costs electricity and time only</text>
  <!-- node: Open WebUI (container, green) -->
  <rect x="450" y="446" width="235" height="84" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="567.5" y="472" text-anchor="middle" font-size="16" font-weight="700" fill="#5A8270">OPEN WEBUI</text>
  <text x="567.5" y="494" text-anchor="middle" font-size="13" fill="#5A8270">chat with the same models</text>
  <text x="567.5" y="514" text-anchor="middle" font-size="13" font-style="italic" fill="#5A8270">in a browser</text>
  <!-- node: Jellyfin (container, green) -->
  <rect x="721" y="446" width="235" height="84" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="838.5" y="472" text-anchor="middle" font-size="16" font-weight="700" fill="#5A8270">JELLYFIN</text>
  <text x="838.5" y="494" text-anchor="middle" font-size="13" fill="#5A8270">media server</text>
  <text x="838.5" y="514" text-anchor="middle" font-size="13" font-style="italic" fill="#5A8270">for movies, shows, music</text>
  <!-- arrow labels -->
  <text x="158" y="248" font-size="12.5" font-weight="600" fill="#6B6873">keeps the thinking</text>
  <text x="347" y="310" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4F627F">hands over</text>
  <text x="347" y="326" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4F627F">token-heavy work</text>
  <text x="347" y="360" text-anchor="middle" font-size="12.5" fill="#6B6873">the result comes back</text>
  <text x="347" y="376" text-anchor="middle" font-size="12.5" fill="#6B6873">to the harness</text>
  <text x="580" y="264" font-size="12.5" font-weight="600" fill="#4F627F">a record</text>
  <!-- legend -->
  <line x1="24" y1="598" x2="60" y2="598" stroke="#4F627F" stroke-width="2.5"/>
  <text x="68" y="602" font-size="12.5" fill="#6B6873">work handed over</text>
  <line x1="204" y1="598" x2="240" y2="598" stroke="#6B6873" stroke-width="2.5"/>
  <text x="248" y="602" font-size="12.5" fill="#6B6873">stays with the frontier model</text>
  <rect x="450" y="590" width="24" height="16" rx="4" fill="#DEE8E1" stroke="#5A8270" stroke-width="1.5"/>
  <text x="482" y="602" font-size="12.5" fill="#6B6873">runs on the desktop</text>
  <!-- caption -->
  <text x="500" y="638" text-anchor="middle" font-size="13.5" font-weight="600" fill="#A85B49">DIA-106 · Home library: a frontier tool keeps the thinking and hands token-heavy work to local models on the desktop.</text>
</svg>
