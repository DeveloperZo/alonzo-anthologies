  <text x="440" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#4F627F">OLLAMA</text>
  <text x="440" y="150" text-anchor="middle" font-size="10" fill="#4F627F">native Windows · port 11434</text>
  <text x="440" y="166" text-anchor="middle" font-size="9.5" fill="#4F627F">all addresses · 6 models pulled</text>
  <rect x="620" y="110" width="180" height="70" rx="10" fill="#FAFAF8" stroke="#9D9A95" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="710" y="133" text-anchor="middle" font-size="12" font-weight="700" fill="#6B6873">RELAY (LiteLLM)</text>
  <text x="710" y="150" text-anchor="middle" font-size="9.5" fill="#6B6873">repo server/ · wants port 4000</text>
  <text x="710" y="166" text-anchor="middle" font-size="9.5" fill="#6B6873">not started</text>
  <rect x="870" y="110" width="200" height="70" rx="10" fill="#FAFAF8" stroke="#9D9A95" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="970" y="133" text-anchor="middle" font-size="12" font-weight="700" fill="#6B6873">LANGFUSE</text>
  <text x="970" y="150" text-anchor="middle" font-size="9.5" fill="#6B6873">activity dashboard · wants port 3000</text>
