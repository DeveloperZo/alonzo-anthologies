  <!-- arrows 3 to 5: running on the desktop -->
  <line x1="540" y1="303" x2="596" y2="303" stroke="#5A8270" stroke-width="2.5" marker-end="url(#hl-green)"/>
  <line x1="800" y1="303" x2="866" y2="303" stroke="#5A8270" stroke-width="2.5" marker-end="url(#hl-green)"/>
  <line x1="540" y1="407" x2="866" y2="407" stroke="#5A8270" stroke-width="2.5" marker-end="url(#hl-green)"/>
  <!-- arrows 6: not started -->
  <line x1="620" y1="145" x2="544" y2="145" stroke="#9D9A95" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#hl-gray)"/>
  <line x1="800" y1="145" x2="866" y2="145" stroke="#9D9A95" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#hl-gray)"/>
  <text x="835" y="210" text-anchor="middle" font-size="10" font-weight="600" fill="#A85B49">cannot start as written: ports 4000 and 3000 are already held by the stack below</text>
