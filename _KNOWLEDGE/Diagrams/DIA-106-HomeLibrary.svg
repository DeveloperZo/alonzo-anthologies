  <text x="440" y="395" text-anchor="middle" font-size="13" font-weight="700" fill="#5A8270">JELLYFIN</text>
  <text x="440" y="412" text-anchor="middle" font-size="10" fill="#5A8270">whl-jellyfin · port 8096</text>
