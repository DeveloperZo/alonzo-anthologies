  <!-- caption -->
  <text x="550" y="552" text-anchor="middle" font-size="12" font-weight="600" fill="#A85B49">DIA-106 · Home library: limesalt reaches Ollama on the desktop over Tailscale; the WHL stack runs beside it; Langfuse is not started.</text>
