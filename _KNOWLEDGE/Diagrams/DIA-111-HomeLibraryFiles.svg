<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d111-title d111-desc">
  <title id="d111-title">DIA-111 · Files and state: where the home library's files, secrets and saved state live, and what has no backup</title>
  <desc id="d111-desc">Three columns, one per place, each read top to bottom. There is no flow. The first column is the folder E:\WHL, which has no history and no backup. It holds five things: the compose files that say how the relay, the chat page and the media server start (if lost, rebuild by hand); the LiteLLM config file that holds the routes (if lost, rebuild by hand); a secrets file, compose\.env, with the relay key and the Langfuse keys (if lost, make new keys and update every tool); the data folder with chats, accounts and the media index (if lost, gone); and the media folder for movies, shows and music, which is empty today (if lost, gone). The second column is the repo, which is in git and pushed to GitHub. It holds the server folder that says how Langfuse starts (if lost, clone the repo again) and a second secrets file, server\.env, with the Langfuse keys and login. Git ignores that file, so it exists on this disk only (if lost, make new keys). A red dotted line joins the two secrets files: the Langfuse keys in both must match. The third column is state held inside Docker and Ollama, with no backup: the Docker volumes of whl-langfuse, which hold every recorded request (if lost, gone), and the Ollama model files on the C: drive (if lost, download again).</desc>
  <defs>
    <style>
      :root {
        --bg: #FAFAF8; --paper: #F2EEE3; --text: #2A2A35; --muted: #6B6873; --muted2: #9D9A95; --line: #E2DFD6;
        --red: #A85B49;   --red-soft: #EDD8CE;
        --amber: #A28438; --amber-soft: #F0E5CD;
        --blue: #4F627F;  --blue-soft: #DEE3EC;
        --green: #5A8270; --green-soft: #DEE8E1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1B1D23; --paper: #1E2128; --text: #E8E5DC; --muted: #B8B5AD; --muted2: #908D87; --line: #3E3D38;
          --red: #D29183;   --red-soft: #3D2925;
          --amber: #D6B574; --amber-soft: #3B3220;
          --blue: #94A6C4;  --blue-soft: #2A323F;
          --green: #92BAA6; --green-soft: #233029;
        }
      }
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      text.m, tspan.m { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
      [fill="#FAFAF8"] { fill: var(--bg); } [fill="#F2EEE3"] { fill: var(--paper); }
      [fill="#2A2A35"] { fill: var(--text); } [stroke="#2A2A35"] { stroke: var(--text); }
      [fill="#6B6873"] { fill: var(--muted); } [fill="#9D9A95"] { fill: var(--muted2); }
      [fill="#E2DFD6"] { fill: var(--line); } [stroke="#E2DFD6"] { stroke: var(--line); } [stroke="#9D9A95"] { stroke: var(--muted2); } [stroke="#6B6873"] { stroke: var(--muted); }
      [fill="#A85B49"] { fill: var(--red); } [stroke="#A85B49"] { stroke: var(--red); } [fill="#EDD8CE"] { fill: var(--red-soft); }
      [fill="#A28438"] { fill: var(--amber); } [stroke="#A28438"] { stroke: var(--amber); } [fill="#F0E5CD"] { fill: var(--amber-soft); }
      [fill="#4F627F"] { fill: var(--blue); } [stroke="#4F627F"] { stroke: var(--blue); } [fill="#DEE3EC"] { fill: var(--blue-soft); }
      [fill="#5A8270"] { fill: var(--green); } [stroke="#5A8270"] { stroke: var(--green); } [fill="#DEE8E1"] { fill: var(--green-soft); }
    </style>
    <marker id="d111-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L9,5 L0,9 Z" fill="#4F627F"/></marker>
  </defs>
  <rect width="1000" height="720" fill="#F2EEE3"/>

