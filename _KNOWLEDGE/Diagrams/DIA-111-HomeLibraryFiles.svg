  <text x="52" y="390" font-size="13" font-style="italic" fill="#A85B49">if lost: make new keys, update every tool</text>

  <path d="M38,414 H98 V424 H340 V498 H38 Z" fill="#FAFAF8" stroke="#6B6873" stroke-width="1.5" stroke-linejoin="round"/>
