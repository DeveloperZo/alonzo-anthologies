  <text x="52" y="562" font-size="13" fill="#6B6873">movies, shows, music · empty today</text>
  <text x="52" y="582" font-size="13" font-style="italic" fill="#6B6873">if lost: gone</text>

  <!-- column B nodes: x 388, w 262, row 1 (h 84) and row 3 (h 104) -->
  <path d="M388,126 H448 V136 H650 V210 H388 Z" fill="#FAFAF8" stroke="#6B6873" stroke-width="1.5" stroke-linejoin="round"/>
  <text class="m" x="402" y="158" font-size="14" font-weight="700" fill="#2A2A35">home-library-series\server\</text>
  <text x="402" y="178" font-size="13" fill="#6B6873">how Langfuse starts</text>
  <text x="402" y="198" font-size="13" font-style="italic" fill="#6B6873">if lost: clone the repo again</text>

  <path d="M388,318 H448 V328 H650 V422 H388 Z" fill="#EDD8CE" stroke="#A85B49" stroke-width="1.5" stroke-linejoin="round"/>
  <text class="m" x="402" y="350" font-size="14" font-weight="700" fill="#A85B49">server\.env</text>
  <text x="402" y="370" font-size="13" fill="#A85B49">Langfuse keys and login</text>
  <text x="402" y="390" font-size="13" fill="#A85B49">git ignores it: this disk only</text>
  <text x="402" y="410" font-size="13" font-style="italic" fill="#A85B49">if lost: make new keys</text>

  <text x="402" y="444" font-size="12.5" font-weight="600" fill="#A85B49">The Langfuse keys in both .env</text>
  <text x="402" y="461" font-size="12.5" font-weight="600" fill="#A85B49">files must match.</text>

