<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d112-title d112-desc">
  <title id="d112-title">DIA-112 · Who can reach what: which doors on the desktop are open, and to whom</title>
  <desc id="d112-desc">Reads left to right: who is knocking, which door, and what guards it. Three callers stand on the left. The laptop limesalt comes in over the tailnet, which is the intended way in, and the firewall allows every port from the tailnet. Any device on the home network reaches the same ports, because Docker and Ollama publish them on the home network address too; this was tested from the desktop itself, not from a second device. The internet is drawn stopped: Tailscale publishes nothing, and the router was not checked. On the right, inside the desktop lemonpepper, five doors are open on every network address. Port 8096, Jellyfin, was never set up, so the first visitor becomes its administrator. Port 3000, Open WebUI, has login switched on but no account yet, so the first sign-up becomes its administrator. Port 3001, Langfuse, has its own login with one account, the owner. Port 4000, LiteLLM the relay, needs a key, and it is one key shared by every caller. Port 11434, Ollama, has no key and no login, so anyone who reaches it can run or delete models. A note adds that ports 3031 and 9090, two parts of Langfuse, are open the same way although nothing outside the desktop needs them.</desc>
  <defs>
    <style>
      :root {
        --bg: #FAFAF8; --paper: #F2EEE3; --text: #2A2A35; --muted: #6B6873; --muted2: #9D9A95; --line: #E2DFD6;
        --red: #A85B49;   --red-soft: #EDD8CE;
        --amber: #A28438; --amber-soft: #F0E5CD;
        --blue: #4F627F;  --blue-soft: #DEE3EC;
        --green: #5A8270; --green-soft: #DEE8E1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1B1D23; --paper: #1E2128; --text: #E8E5DC; --muted: #B8B5AD; --muted2: #908D87; --line: #3E3D38;
          --red: #D29183;   --red-soft: #3D2925;
          --amber: #D6B574; --amber-soft: #3B3220;
          --blue: #94A6C4;  --blue-soft: #2A323F;
          --green: #92BAA6; --green-soft: #233029;
        }
      }
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      text.m, tspan.m { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
      [fill="#FAFAF8"] { fill: var(--bg); } [fill="#F2EEE3"] { fill: var(--paper); }
      [fill="#2A2A35"] { fill: var(--text); } [stroke="#2A2A35"] { stroke: var(--text); }
      [fill="#6B6873"] { fill: var(--muted); } [fill="#9D9A95"] { fill: var(--muted2); }
      [fill="#E2DFD6"] { fill: var(--line); } [stroke="#E2DFD6"] { stroke: var(--line); } [stroke="#9D9A95"] { stroke: var(--muted2); } [stroke="#6B6873"] { stroke: var(--muted); }
      [fill="#A85B49"] { fill: var(--red); } [stroke="#A85B49"] { stroke: var(--red); } [fill="#EDD8CE"] { fill: var(--red-soft); }
      [fill="#A28438"] { fill: var(--amber); } [stroke="#A28438"] { stroke: var(--amber); } [fill="#F0E5CD"] { fill: var(--amber-soft); }
      [fill="#4F627F"] { fill: var(--blue); } [stroke="#4F627F"] { stroke: var(--blue); } [fill="#DEE3EC"] { fill: var(--blue-soft); }
      [fill="#5A8270"] { fill: var(--green); } [stroke="#5A8270"] { stroke: var(--green); } [fill="#DEE8E1"] { fill: var(--green-soft); }
    </style>
    <marker id="d112-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L9,5 L0,9 Z" fill="#4F627F"/></marker>
    <marker id="d112-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L9,5 L0,9 Z" fill="#A28438"/></marker>
    <marker id="d112-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L9,5 L0,9 Z" fill="#6B6873"/></marker>
  </defs>
  <rect width="1000" height="620" fill="#F2EEE3"/>

  <!-- header -->
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#A85B49" letter-spacing="0.04em">DIA-112 · WHO CAN REACH WHAT</text>
  <text x="500" y="58" text-anchor="middle" font-size="14" fill="#6B6873">Which doors are open, and to whom?</text>

  <!-- frames -->
  <rect x="428" y="84" width="548" height="436" rx="14" fill="none" stroke="#9D9A95" stroke-width="1.5"/>
  <text x="442" y="104" font-size="12" font-weight="700" fill="#6B6873" letter-spacing="0.03em">DESKTOP · lemonpepper</text>
  <rect x="442" y="114" width="522" height="394" rx="8" fill="none" stroke="#9D9A95" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="454" y="131" font-size="12" font-weight="700" fill="#6B6873" letter-spacing="0.03em">OPEN ON EVERY NETWORK ADDRESS</text>

  <!-- lines: tailnet caller to the blue bracket -->
  <line x1="244" y1="150" x2="402" y2="150" stroke="#4F627F" stroke-width="2.5" marker-end="url(#d112-blue)"/>
  <path d="M414,140 H402 V458 H414" fill="none" stroke="#4F627F" stroke-width="2.5"/>
  <!-- lines: home network caller to the amber bracket -->
  <line x1="244" y1="299" x2="380" y2="299" stroke="#A28438" stroke-width="2.5" marker-end="url(#d112-amber)"/>
  <path d="M390,167 H380 V431 H390" fill="none" stroke="#A28438" stroke-width="2.5"/>
  <!-- lines: the internet, stopped -->
  <line x1="244" y1="452" x2="326" y2="452" stroke="#6B6873" stroke-width="1.5" marker-end="url(#d112-gray)"/>
  <line x1="330" y1="438" x2="330" y2="466" stroke="#6B6873" stroke-width="4"/>

  <!-- callers -->
  <rect x="24" y="108" width="220" height="84" rx="42" fill="#DEE3EC" stroke="#4F627F" stroke-width="2"/>
  <text x="134" y="134" text-anchor="middle" font-size="16" font-weight="700" fill="#4F627F">LIMESALT</text>
  <text x="134" y="156" text-anchor="middle" font-size="13" fill="#4F627F">the laptop, over the tailnet</text>
  <text x="134" y="176" text-anchor="middle" font-size="13" font-style="italic" fill="#4F627F">the intended way in</text>
  <text x="134" y="212" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4F627F">The firewall allows every port</text>
  <text x="134" y="228" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4F627F">from the tailnet.</text>

  <rect x="24" y="257" width="220" height="84" rx="42" fill="#F0E5CD" stroke="#A28438" stroke-width="2"/>
  <text x="134" y="283" text-anchor="middle" font-size="16" font-weight="700" fill="#A28438">ANY DEVICE AT HOME</text>
  <text x="134" y="305" text-anchor="middle" font-size="13" fill="#A28438">on the same wifi or cable</text>
  <text x="134" y="325" text-anchor="middle" font-size="13" font-style="italic" fill="#A28438">not intended</text>
  <text x="134" y="361" text-anchor="middle" font-size="12.5" font-weight="600" fill="#A28438">Docker and Ollama publish these</text>
  <text x="134" y="377" text-anchor="middle" font-size="12.5" font-weight="600" fill="#A28438">ports to the home network too.</text>
  <text x="134" y="393" text-anchor="middle" font-size="12.5" font-weight="600" font-style="italic" fill="#A28438">Tested from the desktop itself,</text>
  <text x="134" y="409" text-anchor="middle" font-size="12.5" font-weight="600" font-style="italic" fill="#A28438">not from a second device.</text>

  <rect x="24" y="421" width="220" height="62" rx="31" fill="#FAFAF8" stroke="#6B6873" stroke-width="2"/>
  <text x="134" y="447" text-anchor="middle" font-size="16" font-weight="700" fill="#6B6873">THE INTERNET</text>
  <text x="134" y="468" text-anchor="middle" font-size="13" fill="#6B6873">everyone else</text>
  <text x="134" y="503" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6B6873">Tailscale publishes nothing;</text>
  <text x="134" y="519" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6B6873">the router was not checked.</text>

  <!-- door 1: Jellyfin -->
  <rect x="454" y="140" width="494" height="54" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <rect x="464" y="156" width="60" height="22" rx="4" fill="#FAFAF8" stroke="#5A8270" stroke-width="1"/>
  <text class="m" x="494" y="171.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5A8270">:8096</text>
  <text x="534" y="163" font-size="16" font-weight="700" fill="#5A8270">JELLYFIN</text>
  <text x="534" y="182" font-size="13" fill="#5A8270">media server</text>
  <text x="936" y="163" text-anchor="end" font-size="13" font-weight="700" fill="#A28438">never set up</text>
  <text x="936" y="182" text-anchor="end" font-size="13" font-style="italic" fill="#A28438">first visitor becomes admin</text>

  <!-- door 2: Open WebUI -->
  <rect x="454" y="206" width="494" height="54" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <rect x="464" y="222" width="60" height="22" rx="4" fill="#FAFAF8" stroke="#5A8270" stroke-width="1"/>
  <text class="m" x="494" y="237.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5A8270">:3000</text>
  <text x="534" y="229" font-size="16" font-weight="700" fill="#5A8270">OPEN WEBUI</text>
  <text x="534" y="248" font-size="13" fill="#5A8270">chat page in the browser</text>
  <text x="936" y="229" text-anchor="end" font-size="13" font-weight="700" fill="#A28438">login on, but no account yet</text>
  <text x="936" y="248" text-anchor="end" font-size="13" font-style="italic" fill="#A28438">first sign-up becomes admin</text>

  <!-- door 3: Langfuse (several containers drawn as one) -->
  <rect x="460" y="278" width="494" height="54" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <rect x="454" y="272" width="494" height="54" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <rect x="464" y="288" width="60" height="22" rx="4" fill="#FAFAF8" stroke="#5A8270" stroke-width="1"/>
  <text class="m" x="494" y="303.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5A8270">:3001</text>
  <text x="534" y="295" font-size="16" font-weight="700" fill="#5A8270">LANGFUSE</text>
  <text x="534" y="314" font-size="13" fill="#5A8270">stores the request record</text>
  <text x="936" y="295" text-anchor="end" font-size="13" font-weight="700" fill="#5A8270">its own login</text>
  <text x="936" y="314" text-anchor="end" font-size="13" font-style="italic" fill="#5A8270">one account, the owner</text>

  <!-- door 4: LiteLLM -->
  <rect x="454" y="338" width="494" height="54" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <rect x="464" y="354" width="60" height="22" rx="4" fill="#FAFAF8" stroke="#5A8270" stroke-width="1"/>
  <text class="m" x="494" y="369.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5A8270">:4000</text>
  <text x="534" y="361" font-size="16" font-weight="700" fill="#5A8270">LITELLM (the relay)</text>
  <text x="534" y="380" font-size="13" fill="#5A8270">passes requests to a model</text>
  <text x="936" y="361" text-anchor="end" font-size="13" font-weight="700" fill="#A28438">needs a key</text>
  <text x="936" y="380" text-anchor="end" font-size="13" font-style="italic" fill="#A28438">one key, shared by every caller</text>

  <!-- door 5: Ollama (native program, square corners) -->
  <rect x="454" y="404" width="494" height="54" rx="2" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <rect x="464" y="420" width="60" height="22" rx="4" fill="#FAFAF8" stroke="#5A8270" stroke-width="1"/>
  <text class="m" x="494" y="435.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5A8270">:11434</text>
  <text x="534" y="427" font-size="16" font-weight="700" fill="#5A8270">OLLAMA</text>
  <text x="534" y="446" font-size="13" fill="#5A8270">the model runtime</text>
  <text x="936" y="427" text-anchor="end" font-size="13" font-weight="700" fill="#A85B49">no key, no login</text>
  <text x="936" y="446" text-anchor="end" font-size="13" font-style="italic" fill="#A85B49">anyone can run or delete models</text>

  <!-- note: two more open ports -->
  <text x="454" y="480" font-size="12.5" font-weight="600" fill="#A28438">Also open the same way: <tspan class="m">:3031</tspan> and <tspan class="m">:9090</tspan>, two parts of Langfuse.</text>
  <text x="454" y="497" font-size="12.5" font-weight="600" fill="#A28438">Nothing outside the desktop needs them.</text>

  <!-- legend -->
  <line x1="24" y1="558" x2="60" y2="558" stroke="#4F627F" stroke-width="2.5"/>
  <text x="68" y="562" font-size="12.5" fill="#6B6873">intended way in</text>
  <line x1="182" y1="558" x2="218" y2="558" stroke="#A28438" stroke-width="2.5"/>
  <text x="226" y="562" font-size="12.5" fill="#6B6873">open wider than intended</text>
  <rect x="398" y="552" width="12" height="12" rx="2" fill="#5A8270"/>
  <text x="416" y="562" font-size="12.5" fill="#6B6873">guarded</text>
  <rect x="484" y="552" width="12" height="12" rx="2" fill="#A28438"/>
  <text x="502" y="562" font-size="12.5" fill="#6B6873">guard weak or not finished</text>
  <rect x="680" y="552" width="12" height="12" rx="2" fill="#A85B49"/>
  <text x="698" y="562" font-size="12.5" fill="#6B6873">no guard</text>
  <rect x="772" y="547" width="52" height="22" rx="4" fill="#FAFAF8" stroke="#6B6873" stroke-width="1"/>
  <text class="m" x="798" y="562.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6B6873">:4000</text>
  <text x="832" y="562" font-size="12.5" fill="#6B6873">a port number</text>

  <!-- caption -->
  <text x="500" y="598" text-anchor="middle" font-size="13.5" font-weight="600" fill="#A85B49">DIA-112 · Reach: seven ports are open to the home network as well as the tailnet, and Ollama asks for no key.</text>
</svg>
