<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d109-title d109-desc">
  <title id="d109-title">DIA-109 · One request: what happens to one request sent to the home library, step by step</title>
  <desc id="d109-desc">Reads left to right. On the left is the caller: a tool or a browser, on limesalt or lemonpepper. A dotted vertical line marks the tailnet that calls from limesalt cross. Step 1 has two forms: a browser opens the chat page Open WebUI on port 3000, or a tool calls LiteLLM, the relay, on port 4000 with the key. Step 2: Open WebUI calls the relay with the key. The relay checks the key and picks the model by route name. A note lists the two routes: local-fast goes to gpt-oss:20b and local-coder goes to qwen2.5-coder:14b. Step 3: the relay calls Ollama on port 11434 for the route's model. Ollama loads the model if needed and writes the answer. Step 4: the answer returns the same way. Step 5: the relay sends a record of the request to Langfuse on port 3001, which stores the record. An amber line along the bottom shows the weak point: a caller can go straight to Ollama, with no key and no record.</desc>
  <defs>
    <style>
      :root {
        --bg: #FAFAF8; --paper: #F2EEE3; --text: #2A2A35; --muted: #6B6873; --muted2: #9D9A95; --line: #E2DFD6;
        --red: #A85B49;   --red-soft: #EDD8CE;
        --amber: #A28438; --amber-soft: #F0E5CD;
        --blue: #4F627F;  --blue-soft: #DEE3EC;
        --green: #5A8270; --green-soft: #DEE8E1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1B1D23; --paper: #1E2128; --text: #E8E5DC; --muted: #B8B5AD; --muted2: #908D87; --line: #3E3D38;
          --red: #D29183;   --red-soft: #3D2925;
          --amber: #D6B574; --amber-soft: #3B3220;
          --blue: #94A6C4;  --blue-soft: #2A323F;
          --green: #92BAA6; --green-soft: #233029;
        }
      }
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      text.m, tspan.m { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
      [fill="#FAFAF8"] { fill: var(--bg); } [fill="#F2EEE3"] { fill: var(--paper); }
      [fill="#2A2A35"] { fill: var(--text); } [stroke="#2A2A35"] { stroke: var(--text); }
      [fill="#6B6873"] { fill: var(--muted); } [fill="#9D9A95"] { fill: var(--muted2); }
      [fill="#E2DFD6"] { fill: var(--line); } [stroke="#E2DFD6"] { stroke: var(--line); } [stroke="#9D9A95"] { stroke: var(--muted2); } [stroke="#6B6873"] { stroke: var(--muted); }
      [fill="#A85B49"] { fill: var(--red); } [stroke="#A85B49"] { stroke: var(--red); } [fill="#EDD8CE"] { fill: var(--red-soft); }
      [fill="#A28438"] { fill: var(--amber); } [stroke="#A28438"] { stroke: var(--amber); } [fill="#F0E5CD"] { fill: var(--amber-soft); }
      [fill="#4F627F"] { fill: var(--blue); } [stroke="#4F627F"] { stroke: var(--blue); } [fill="#DEE3EC"] { fill: var(--blue-soft); }
      [fill="#5A8270"] { fill: var(--green); } [stroke="#5A8270"] { stroke: var(--green); } [fill="#DEE8E1"] { fill: var(--green-soft); }
    </style>
    <marker id="d109-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L9,5 L0,9 Z" fill="#4F627F"/></marker>
    <marker id="d109-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L9,5 L0,9 Z" fill="#A28438"/></marker>
  </defs>
  <rect width="1000" height="640" fill="#F2EEE3"/>

  <!-- header -->
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#A85B49" letter-spacing="0.04em">DIA-109 · ONE REQUEST</text>
  <text x="500" y="58" text-anchor="middle" font-size="14" fill="#6B6873">What happens to one request, step by step?</text>

  <!-- network line: the tailnet -->
  <line x1="214" y1="102" x2="214" y2="542" stroke="#4F627F" stroke-width="2" stroke-dasharray="2,5"/>
  <text x="214" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#4F627F" letter-spacing="0.03em">TAILNET</text>

  <!-- arrows (drawn before nodes) -->
  <!-- 1a: caller to Open WebUI -->
  <path d="M104,180 V152 H250" fill="none" stroke="#4F627F" stroke-width="2.5" marker-end="url(#d109-blue)"/>
  <!-- 1b: caller to LiteLLM -->
  <line x1="184" y1="245" x2="445" y2="245" stroke="#4F627F" stroke-width="2.5" marker-end="url(#d109-blue)"/>
  <!-- 2: Open WebUI to LiteLLM -->
  <path d="M430,152 H550 V190" fill="none" stroke="#4F627F" stroke-width="2.5" marker-end="url(#d109-blue)"/>
  <!-- 3: LiteLLM to Ollama -->
  <line x1="655" y1="245" x2="790" y2="245" stroke="#4F627F" stroke-width="2.5" marker-end="url(#d109-blue)"/>
  <!-- 5: LiteLLM to Langfuse -->
  <line x1="550" y1="300" x2="550" y2="400" stroke="#4F627F" stroke-width="2.5" marker-end="url(#d109-blue)"/>
  <!-- bypass: caller straight to Ollama -->
  <path d="M104,300 V530 H883 V287" fill="none" stroke="#A28438" stroke-width="2.5" marker-end="url(#d109-amber)"/>

  <!-- arrow labels -->
  <text x="140" y="133" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4F627F">chat in the browser</text>
  <text x="332" y="226" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4F627F">a tool, with the key</text>
  <text x="490" y="133" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4F627F">with the key</text>
  <text x="722" y="226" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4F627F">the route's model</text>
  <text x="570" y="354.5" font-size="12.5" font-weight="600" fill="#4F627F">a record of the request</text>
  <text x="530" y="326.5" text-anchor="end" font-size="12.5" font-weight="600" fill="#4F627F">the answer returns the same way</text>
  <text x="493" y="550" text-anchor="middle" font-size="12.5" font-weight="600" fill="#A28438">straight to Ollama: no key, no record</text>

  <!-- routes note -->
  <text x="744" y="126" font-size="12" font-weight="700" fill="#6B6873" letter-spacing="0.03em">ROUTES</text>
  <text class="m" x="744" y="146" font-size="12.5" font-weight="600" fill="#5A8270" xml:space="preserve">local-fast  → gpt-oss:20b</text>
  <text class="m" x="744" y="166" font-size="12.5" font-weight="600" fill="#5A8270" xml:space="preserve">local-coder → qwen2.5-coder:14b</text>

  <!-- nodes -->
  <!-- caller -->
  <rect x="24" y="180" width="160" height="120" rx="60" fill="#DEE3EC" stroke="#4F627F" stroke-width="2"/>
  <text x="104" y="219" text-anchor="middle" font-size="16" font-weight="700" fill="#4F627F">A TOOL OR</text>
  <text x="104" y="238" text-anchor="middle" font-size="16" font-weight="700" fill="#4F627F">A BROWSER</text>
  <text x="104" y="260" text-anchor="middle" font-size="13" fill="#4F627F">on limesalt or</text>
  <text x="104" y="277" text-anchor="middle" font-size="13" fill="#4F627F">lemonpepper</text>

  <!-- Open WebUI -->
  <rect x="250" y="110" width="180" height="84" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="340" y="149" text-anchor="middle" font-size="16" font-weight="700" fill="#5A8270">OPEN WEBUI</text>
  <text x="340" y="171" text-anchor="middle" font-size="13" fill="#5A8270">chat page</text>
  <rect x="260" y="98" width="52" height="20" rx="4" fill="#FAFAF8" stroke="#5A8270" stroke-width="1"/>
  <text class="m" x="286" y="112.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5A8270">:3000</text>

  <!-- LiteLLM -->
  <rect x="445" y="190" width="210" height="110" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="550" y="229" text-anchor="middle" font-size="16" font-weight="700" fill="#5A8270">LITELLM (the relay)</text>
  <text x="550" y="253" text-anchor="middle" font-size="13" fill="#5A8270">checks the key</text>
  <text x="550" y="273" text-anchor="middle" font-size="13" fill="#5A8270">picks the model by route name</text>
  <rect x="455" y="178" width="52" height="20" rx="4" fill="#FAFAF8" stroke="#5A8270" stroke-width="1"/>
  <text class="m" x="481" y="192.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5A8270">:4000</text>

  <!-- Ollama -->
  <rect x="790" y="203" width="186" height="84" rx="2" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="883" y="232" text-anchor="middle" font-size="16" font-weight="700" fill="#5A8270">OLLAMA</text>
  <text x="883" y="254" text-anchor="middle" font-size="13" fill="#5A8270">loads the model if needed</text>
  <text x="883" y="273" text-anchor="middle" font-size="13" fill="#5A8270">writes the answer</text>
  <rect x="800" y="191" width="58" height="20" rx="4" fill="#FAFAF8" stroke="#5A8270" stroke-width="1"/>
  <text class="m" x="829" y="205.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5A8270">:11434</text>

  <!-- Langfuse (several containers drawn as one) -->
  <rect x="451" y="406" width="210" height="84" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <rect x="445" y="400" width="210" height="84" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="550" y="439" text-anchor="middle" font-size="16" font-weight="700" fill="#5A8270">LANGFUSE</text>
  <text x="550" y="461" text-anchor="middle" font-size="13" fill="#5A8270">stores the record</text>
  <rect x="455" y="388" width="52" height="20" rx="4" fill="#FAFAF8" stroke="#5A8270" stroke-width="1"/>
  <text class="m" x="481" y="402.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5A8270">:3001</text>

  <!-- step badges -->
  <circle cx="160" cy="152" r="11" fill="#F2EEE3" stroke="#4F627F" stroke-width="1.5"/>
  <text x="160" y="156.2" text-anchor="middle" font-size="12" font-weight="700" fill="#4F627F">1</text>
  <circle cx="332" cy="245" r="11" fill="#F2EEE3" stroke="#4F627F" stroke-width="1.5"/>
  <text x="332" y="249.2" text-anchor="middle" font-size="12" font-weight="700" fill="#4F627F">1</text>
  <circle cx="490" cy="152" r="11" fill="#F2EEE3" stroke="#4F627F" stroke-width="1.5"/>
  <text x="490" y="156.2" text-anchor="middle" font-size="12" font-weight="700" fill="#4F627F">2</text>
  <circle cx="722" cy="245" r="11" fill="#F2EEE3" stroke="#4F627F" stroke-width="1.5"/>
  <text x="722" y="249.2" text-anchor="middle" font-size="12" font-weight="700" fill="#4F627F">3</text>
  <circle cx="322" cy="322" r="11" fill="#F2EEE3" stroke="#4F627F" stroke-width="1.5"/>
  <text x="322" y="326.2" text-anchor="middle" font-size="12" font-weight="700" fill="#4F627F">4</text>
  <circle cx="550" cy="350" r="11" fill="#F2EEE3" stroke="#4F627F" stroke-width="1.5"/>
  <text x="550" y="354.2" text-anchor="middle" font-size="12" font-weight="700" fill="#4F627F">5</text>

  <!-- legend -->
  <line x1="24" y1="582" x2="60" y2="582" stroke="#4F627F" stroke-width="2.5"/>
  <text x="68" y="586.5" font-size="12.5" fill="#6B6873">a call that works today</text>
  <line x1="236" y1="582" x2="272" y2="582" stroke="#A28438" stroke-width="2.5"/>
  <text x="280" y="586.5" font-size="12.5" fill="#6B6873">works, but a weak point</text>
  <circle cx="462" cy="582" r="11" fill="#F2EEE3" stroke="#6B6873" stroke-width="1.5"/>
  <text x="462" y="586.2" text-anchor="middle" font-size="12" font-weight="700" fill="#6B6873">n</text>
  <text x="481" y="586.5" font-size="12.5" fill="#6B6873">step, in order</text>
  <rect x="600" y="572" width="52" height="20" rx="4" fill="#FAFAF8" stroke="#6B6873" stroke-width="1"/>
  <text class="m" x="626" y="586.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6B6873">:4000</text>
  <text x="660" y="586.5" font-size="12.5" fill="#6B6873">a port number</text>

  <!-- caption -->
  <text x="500" y="618" text-anchor="middle" font-size="13.5" font-weight="600" fill="#A85B49">DIA-109 · One request: the relay checks the key, picks the model, Ollama answers, and a record goes to Langfuse.</text>
</svg>
