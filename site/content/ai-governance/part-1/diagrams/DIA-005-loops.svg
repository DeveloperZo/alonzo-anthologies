<svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p5b-t p5b-d">
  <title id="p5b-t">DIA-005 · A bucket under the leak</title>
  <desc id="p5b-d">An engraved plate of a heavy pipe running across a room. At a flanged joint it leaks, and drops fall into a bucket standing on a dry floor. The bucket stands for published safety research and announced safety policies. On the floor to the right lie a repair clamp and a spanner, unused, standing for liability law, mandatory audits and hard deployment gates.</desc>
  <defs>
    <style>
      @font-face { font-family: "Great Vibes"; font-weight: 400; src: url(data:font/woff2;base64,) format("woff2"); }
      :root { --paper: #F2EEE3; --ink: #2A2A35; --soft: #6B6873; --accent: #A85B49; }
      @media (prefers-color-scheme: dark) { :root { --paper: #1E2128; --ink: #E8E5DC; --soft: #B8B5AD; --accent: #D29183; } }
      text { font-family: Spectral, Georgia, "Times New Roman", serif; fill: var(--ink); }
      .paper { fill: var(--paper); }
      .l { fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: var(--ink); stroke-width: 0.7; stroke-linecap: round; }
      .b { fill: var(--paper); stroke: var(--ink); stroke-width: 1.4; stroke-linejoin: round; }
      .h { fill: url(#p5b-h); stroke: none; }
      .hb { fill: url(#p5b-h); stroke: var(--ink); stroke-width: 1.4; stroke-linejoin: round; }
      .hl { stroke: var(--ink); stroke-width: 0.6; }
      .ink { fill: var(--ink); }
      .ab { fill: var(--paper); stroke: var(--accent); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
      .al { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linecap: round; }
      .la { fill: none; stroke: var(--accent); stroke-width: 0.8; stroke-linecap: round; }
      .sc { font-size: 11px; letter-spacing: 0.16em; fill: var(--soft); }
      .it { font-size: 14.5px; font-style: italic; }
      .ita { font-size: 14.5px; font-style: italic; fill: var(--accent); }
      .sm { font-size: 12.5px; font-style: italic; fill: var(--soft); }
      .cap { font-size: 12.5px; fill: var(--soft); }
      .title { font-family: "Great Vibes", "Cormorant Garamond", Georgia, serif; font-size: 38px; word-spacing: 0.14em; }
    </style>
    <pattern id="p5b-h" width="4.5" height="4.5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4.5" class="hl"/>
    </pattern>
    <!-- a falling drop, 12 wide, 17 tall, origin at its centre -->
    <path id="p5b-drop" d="M 0 -10 C 7 0 6 7 0 7 C -6 7 -7 0 0 -10 Z"/>
  </defs>
  <rect width="960" height="720" class="paper"/>
  <rect x="14" y="14" width="932" height="692" class="l" style="stroke-width:1.2"/>
  <rect x="20" y="20" width="920" height="680" class="thin"/>
  <text x="42" y="50" class="sc">PLATE V</text>
  <text x="918" y="50" text-anchor="end" class="sc">PART I · SECTION 5 · HOW THESE INTERACT</text>
  <!-- ceiling and hangers -->
  <rect x="30" y="68" width="900" height="7" class="h"/>
  <line x1="30" y1="75" x2="930" y2="75" class="l"/>
  <g class="l" style="stroke-width:2.4"><line x1="150" y1="75" x2="150" y2="150"/><line x1="770" y1="75" x2="770" y2="150"/></g>
  <!-- the pipe: y 150 to 222, running off both sides -->
  <rect x="30" y="150" width="900" height="72" class="b"/>
  <rect x="30" y="200" width="900" height="22" class="h"/>
  <line x1="30" y1="162" x2="930" y2="162" class="thin" style="opacity:0.6"/>
  <rect x="30" y="150" width="900" height="72" class="l"/>
  <rect x="143" y="145" width="14" height="82" class="b"/><rect x="763" y="145" width="14" height="82" class="b"/>
  <!-- the flanged joint at x = 434 -->
  <rect x="414" y="130" width="18" height="112" class="hb"/><rect x="436" y="130" width="18" height="112" class="hb"/>
  <rect x="406" y="137" width="56" height="8" class="b"/><rect x="406" y="227" width="56" height="8" class="b"/>
  <rect x="400" y="135" width="6" height="12" class="b"/><rect x="462" y="135" width="6" height="12" class="b"/>
  <rect x="400" y="225" width="6" height="12" class="b"/><rect x="462" y="225" width="6" height="12" class="b"/>
  <!-- the leak: drops at y = 262, 304, 352, 400 -->
  <path d="M 432 242 q 2 8 2 12" class="l"/>
  <g class="ink"><use href="#p5b-drop" x="434" y="270"/><use href="#p5b-drop" x="434" y="312"/><use href="#p5b-drop" x="434" y="358"/><use href="#p5b-drop" x="434" y="404"/></g>
  <!-- floor -->
  <rect x="30" y="566" width="900" height="7" class="h"/>
  <line x1="30" y1="566" x2="930" y2="566" class="l"/>
  <!-- the bucket: rim y 432, base y 558 -->
  <path d="M 356 432 L 378 556 Q 434 572 490 556 L 512 432 Z" class="b"/>
  <path d="M 478 437 L 512 432 L 490 556 Q 478 561 462 563 Z" class="h"/>
  <path d="M 362 466 Q 434 480 506 466 M 370 512 Q 434 526 498 512" class="thin"/>
  <ellipse cx="434" cy="432" rx="78" ry="11" class="b"/>
  <ellipse cx="434" cy="435" rx="70" ry="8" class="thin"/>
  <ellipse cx="434" cy="435" rx="16" ry="3" class="thin"/><ellipse cx="434" cy="435" rx="34" ry="5.5" class="thin" style="opacity:0.6"/>
  <path d="M 356 432 L 378 556 Q 434 572 490 556 L 512 432" class="l"/>
  <path d="M 356 434 Q 434 524 512 434" class="l" style="stroke-width:2"/>
  <rect x="420" y="474" width="28" height="9" class="b"/>
  <circle cx="356" cy="433" r="3.2" class="b"/><circle cx="512" cy="433" r="3.2" class="b"/>
  <!-- the mend, unused: a repair clamp and a spanner on the floor -->
  <g>
    <rect x="652" y="524" width="96" height="42" class="ab"/>
    <line x1="652" y1="545" x2="748" y2="545" class="al"/>
    <path d="M 652 524 q -9 21 0 42 M 748 524 q 9 21 0 42" class="al"/>
    <rect x="664" y="512" width="18" height="12" class="ab"/><rect x="718" y="512" width="18" height="12" class="ab"/>
    <line x1="673" y1="506" x2="673" y2="524" class="al"/><line x1="727" y1="506" x2="727" y2="524" class="al"/>
    <line x1="668" y1="506" x2="678" y2="506" class="al"/><line x1="722" y1="506" x2="732" y2="506" class="al"/>
    <!-- spanner: shaft from (780,560) to (868,528) -->
    <line x1="780" y1="560" x2="866" y2="529" style="stroke:var(--accent);stroke-width:10;stroke-linecap:round"/>
    <line x1="780" y1="560" x2="866" y2="529" style="stroke:var(--paper);stroke-width:7;stroke-linecap:round"/>
    <circle cx="878" cy="524" r="15" class="ab"/>
    <path d="M 878 524 L 896 508 L 904 520 L 884 532 Z" class="paper"/>
    <path d="M 889.5 514.5 L 880 522 L 886 531" class="al"/>
  </g>
  <!-- notes -->
  <text x="396" y="300" text-anchor="end" class="it">the leak: harm, once it shows</text>
  <line x1="402" y1="296" x2="424" y2="302" class="thin"/>
  <text x="336" y="452" text-anchor="end" class="it">the bucket: safety research published,</text>
  <text x="336" y="471" text-anchor="end" class="it">safety policies announced</text>
  <line x1="342" y1="456" x2="358" y2="460" class="thin"/>
  <text x="336" y="500" text-anchor="end" class="sm">It works. The floor stays dry,</text>
  <text x="336" y="517" text-anchor="end" class="sm">and nobody sends for the fitter.</text>
  <text x="652" y="430" class="ita">the mend, never fitted:</text>
  <text x="652" y="449" class="ita">liability law, mandatory audits,</text>
  <text x="652" y="468" class="ita">hard deployment gates</text>
  <path d="M 700 476 q -4 14 0 26" class="la"/>
  <text x="480" y="645" text-anchor="middle" class="title">A Bucket Under the Leak</text>
  <line x1="300" y1="662" x2="660" y2="662" class="thin"/>
  <text x="480" y="683" text-anchor="middle" class="cap">DIA-005 · Shifting the burden: while the bucket catches the drip, nobody is made to mend the joint.</text>
</svg>
