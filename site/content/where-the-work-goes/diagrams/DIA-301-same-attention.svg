<line class="p301-rule" x1="66" y1="470.5" x2="830" y2="470.5"/>
<text class="p301-s" x="66" y="500">Each bar is one change. Height is the attention it gets. The total area is the same in every row. Counts are illustrative.</text>
<line class="p301-rule" x1="66" y1="520.5" x2="834" y2="520.5"/>
<text class="p301-c" x="66" y="546">DIA-301 · The same attention, spent three ways. The third is one possible path, not the only one.</text>
