# Models the relay offers. One entry per Ollama model.
# model_name is what clients ask for. The part after "ollama_chat/" must match
# a name from `ollama list` on the desktop.
model_list:
  - model_name: qwen2.5-coder:14b
    litellm_params:
      model: ollama_chat/qwen2.5-coder:14b
      api_base: http://host.docker.internal:11434
      # Keep the model loaded so the next request skips the slow first load.
      keep_alive: "24h"

litellm_settings:
  # Send a trace of every request to Langfuse.
  callbacks: ["langfuse_otel"]
