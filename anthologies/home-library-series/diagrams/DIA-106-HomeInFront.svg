  <line x1="888" y1="438" x2="888" y2="254" stroke="#A28438" stroke-width="2.5"/>
  <line x1="870" y1="252" x2="906" y2="252" stroke="#A85B49" stroke-width="4"/>
  <rect x="24" y="284" width="126" height="92" rx="46" fill="#FAFAF8" stroke="#4F627F" stroke-width="2"/>
  <text x="87" y="326" font-size="16" fill="#4F627F" text-anchor="middle" font-weight="700">YOU</text>
  <text x="87" y="346" font-size="12.5" fill="#4F627F" text-anchor="middle">any device</text>
  <text x="87" y="266" font-size="12.5" fill="#5A8270" text-anchor="middle" font-weight="600">private things</text>
  <text x="87" y="402" font-size="12.5" fill="#4F627F" text-anchor="middle" font-weight="600">everything else</text>
  <rect x="200" y="130" width="210" height="92" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="305.0" y="156" text-anchor="middle" font-size="16" font-weight="700" fill="#5A8270">THE PRIVATE DOOR</text>
  <text x="305.0" y="177" text-anchor="middle" font-size="13" fill="#5A8270">home only</text>
  <text x="305.0" y="195" text-anchor="middle" font-size="13" fill="#5A8270">no way out to a paid AI</text>
  <text x="305.0" y="214" text-anchor="middle" font-size="11" fill="#6B6873">a second gateway · port 4001</text>
  <rect x="200" y="438" width="210" height="92" rx="12" fill="#DEE3EC" stroke="#4F627F" stroke-width="2"/>
  <text x="305.0" y="464" text-anchor="middle" font-size="16" font-weight="700" fill="#4F627F">THE FRONT DOOR</text>
  <text x="305.0" y="485" text-anchor="middle" font-size="13" fill="#4F627F">has a switch: home or paid</text>
  <text x="305.0" y="503" text-anchor="middle" font-size="13" fill="#4F627F">home unless you flip it</text>
  <text x="305.0" y="522" text-anchor="middle" font-size="11" fill="#6B6873">LiteLLM</text>
  <rect x="520" y="284" width="200" height="92" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="620.0" y="310" text-anchor="middle" font-size="16" font-weight="700" fill="#5A8270">THE HOME AI</text>
  <text x="620.0" y="331" text-anchor="middle" font-size="13" fill="#5A8270">answers at home</text>
  <text x="620.0" y="349" text-anchor="middle" font-size="13" fill="#5A8270">reads both drives</text>
  <text x="620.0" y="368" text-anchor="middle" font-size="11" fill="#6B6873">Ollama</text>
  <rect x="520" y="438" width="200" height="92" rx="12" fill="#F0E5CD" stroke="#A28438" stroke-width="2"/>
  <text x="620.0" y="464" text-anchor="middle" font-size="16" font-weight="700" fill="#A28438">THE PAID AI</text>
  <text x="620.0" y="485" text-anchor="middle" font-size="13" fill="#A28438">on the internet</text>
  <text x="620.0" y="503" text-anchor="middle" font-size="13" fill="#A28438">sees only what is sent</text>
  <text x="620.0" y="522" text-anchor="middle" font-size="11" fill="#6B6873">Claude · the route named paid</text>
  <rect x="800" y="130" width="176" height="92" rx="2" fill="#DEE8E1" stroke="#5A8270" stroke-width="2.5"/>
  <text x="888" y="154" font-size="14" fill="#5A8270" text-anchor="middle" font-weight="700">THE PRIVATE DRIVE</text>
  <text x="888" y="174" font-size="12" fill="#5A8270" text-anchor="middle">health, family, money</text>
  <text x="888" y="191" font-size="12" fill="#5A8270" text-anchor="middle">no paid AI may open it</text>
  <text x="888" y="210" font-size="11" fill="#6B6873" text-anchor="middle">drives C: and D:</text>
  <rect x="800" y="438" width="176" height="92" rx="2" fill="#DEE3EC" stroke="#4F627F" stroke-width="2.5"/>
  <text x="888" y="462" font-size="14" fill="#4F627F" text-anchor="middle" font-weight="700">THE WORKING DRIVE</text>
  <text x="888" y="482" font-size="12" fill="#4F627F" text-anchor="middle">projects and drafts</text>
  <text x="888" y="499" font-size="12" fill="#4F627F" text-anchor="middle">the one drive a paid AI sees</text>
  <text x="888" y="518" font-size="11" fill="#6B6873" text-anchor="middle">drive F:</text>
  <text x="472" y="250" font-size="12.5" fill="#5A8270" font-weight="600">always home</text>
  <text x="472" y="404" font-size="12.5" fill="#4F627F" font-weight="600">by default</text>
  <text x="463" y="526" font-size="12.5" fill="#A28438" text-anchor="middle" font-weight="600">if you flip it</text>
  <text x="766" y="246" font-size="12" fill="#5A8270">reads,</text>
  <text x="766" y="262" font-size="12" fill="#5A8270">writes</text>
  <text x="766" y="420" font-size="12" fill="#4F627F">reads</text>
  <text x="878" y="336" font-size="12" fill="#A85B49" text-anchor="end" font-weight="600">a paid AI cannot</text>
  <text x="878" y="352" font-size="12" fill="#A85B49" text-anchor="end" font-weight="600">reach this drive</text>
  <rect x="24" y="566" width="952" height="110" rx="12" fill="#FAFAF8" stroke="#A85B49" stroke-width="2"/>
  <text x="44" y="590" font-size="12" fill="#A85B49" font-weight="700" letter-spacing="0.03em">FOUR RULES THAT MAKE IT HOLD</text>
  <text x="44" y="611" font-size="13" fill="#2A2A35">1.  A private chat has no switch. It cannot reach the paid AI.</text>
  <text x="44" y="629" font-size="13" fill="#2A2A35">2.  Anything made from the private drive is saved to the private drive, and nowhere else.</text>
  <text x="44" y="647" font-size="13" fill="#2A2A35">3.  The logbook keeps no words from the private side.</text>
  <text x="44" y="665" font-size="13" fill="#2A2A35">4.  Paid AI tools work on the working drive. File permissions keep them off the private drives (a separate account is planned).</text>
  <rect x="24" y="688" width="24" height="16" rx="4" fill="#DEE8E1" stroke="#5A8270" stroke-width="1.5"/>
  <text x="56" y="700" font-size="12.5" fill="#6B6873">private side: never leaves the house</text>
  <rect x="330" y="688" width="24" height="16" rx="4" fill="#DEE3EC" stroke="#4F627F" stroke-width="1.5"/>
  <text x="362" y="700" font-size="12.5" fill="#6B6873">working side</text>
  <rect x="480" y="688" width="24" height="16" rx="4" fill="#F0E5CD" stroke="#A28438" stroke-width="1.5"/>
  <text x="512" y="700" font-size="12.5" fill="#6B6873">leaves the house, on purpose</text>
  <text x="500" y="736" font-size="13.5" fill="#A85B49" text-anchor="middle" font-weight="600">DIA-106 · Home in front: the home AI is in front, a switch passes work to a paid AI, and the private drive is out of its reach.</text>
</svg>
