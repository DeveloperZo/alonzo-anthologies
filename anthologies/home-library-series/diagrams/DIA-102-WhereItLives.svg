  <text x="436" y="123" font-size="12" fill="#6B6873">stays on, never sleeps · named lemonpepper</text>
  <rect x="430" y="134" width="536" height="194" rx="8" fill="none" stroke="#9D9A95" stroke-width="1.2" stroke-dasharray="3,3"/>
