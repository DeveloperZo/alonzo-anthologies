  <text x="144.0" y="215" text-anchor="middle" font-size="13" fill="#4F627F">a paid AI today</text>
  <text x="144.0" y="234" text-anchor="middle" font-size="11" fill="#6B6873">Claude Code today</text>
  <rect x="44" y="270" width="200" height="92" rx="12" fill="#FAFAF8" stroke="#4F627F" stroke-width="2"/>
