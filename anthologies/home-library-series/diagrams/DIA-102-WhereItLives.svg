  <text x="524.0" y="205" font-size="12.5" fill="#5A8270" text-anchor="middle">checks the password</text>
  <text x="524.0" y="222" font-size="11" fill="#6B6873" text-anchor="middle">LiteLLM</text>
  <rect x="618" y="162" width="164" height="72" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="700.0" y="186" font-size="14" fill="#5A8270" text-anchor="middle" font-weight="700">THE CHAT PAGE</text>
  <text x="700.0" y="205" font-size="12.5" fill="#5A8270" text-anchor="middle">ask the home AI</text>
  <text x="700.0" y="222" font-size="11" fill="#6B6873" text-anchor="middle">Open WebUI</text>
  <rect x="794" y="162" width="164" height="72" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="876.0" y="186" font-size="14" fill="#5A8270" text-anchor="middle" font-weight="700">THE LOGBOOK</text>
  <text x="876.0" y="205" font-size="12.5" fill="#5A8270" text-anchor="middle">notes every request</text>
  <text x="876.0" y="222" font-size="11" fill="#6B6873" text-anchor="middle">Langfuse</text>
  <rect x="442" y="244" width="164" height="72" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="524.0" y="268" font-size="14" fill="#5A8270" text-anchor="middle" font-weight="700">THE LIVE BOARD</text>
  <text x="524.0" y="287" font-size="12.5" fill="#5A8270" text-anchor="middle">shows what is happening</text>
  <text x="524.0" y="304" font-size="11" fill="#6B6873" text-anchor="middle">made for this system</text>
  <rect x="618" y="244" width="164" height="72" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="700.0" y="268" font-size="14" fill="#5A8270" text-anchor="middle" font-weight="700">MOVIES AND SHOWS</text>
