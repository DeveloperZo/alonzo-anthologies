  <text x="144.0" y="335" text-anchor="middle" font-size="13" fill="#4F627F">on the computer at home</text>
  <text x="144.0" y="354" text-anchor="middle" font-size="11" fill="#6B6873">any browser</text>
  <line x1="268" y1="244" x2="417" y2="244" stroke="#4F627F" stroke-width="2.5" marker-end="url(#d102-blue)"/>
  <line x1="416" y1="258" x2="267" y2="258" stroke="#4F627F" stroke-width="2.5" marker-end="url(#d102-blue)"/>
  <text x="342" y="222" font-size="12" fill="#4F627F" text-anchor="middle" font-weight="700" letter-spacing="0.03em">PRIVATE CONNECTION</text>
  <text x="342" y="282" font-size="12.5" fill="#6B6873" text-anchor="middle">works at home</text>
  <text x="342" y="298" font-size="12.5" fill="#6B6873" text-anchor="middle">and away</text>
  <text x="342" y="316" font-size="11" fill="#6B6873" text-anchor="middle">Tailscale</text>
  <rect x="420" y="84" width="556" height="366" rx="14" fill="none" stroke="#9D9A95" stroke-width="1.5"/>
