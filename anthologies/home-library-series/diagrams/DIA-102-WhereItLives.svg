  <text x="567.0" y="391" text-anchor="middle" font-size="13" fill="#5A8270">reads, summarizes and drafts</text>
  <text x="567.0" y="409" text-anchor="middle" font-size="13" fill="#5A8270">starts by itself at sign-in</text>
  <text x="567.0" y="428" text-anchor="middle" font-size="11" fill="#6B6873">Ollama</text>
  <line x1="692" y1="390" x2="705" y2="390" stroke="#4F627F" stroke-width="2.5" marker-end="url(#d102-blue)"/>
  <rect x="708" y="344" width="250" height="92" rx="2" fill="#FAFAF8" stroke="#6B6873" stroke-width="2.5"/>
  <text x="833" y="368" font-size="15" fill="#6B6873" text-anchor="middle" font-weight="700">THE GRAPHICS CARD</text>
  <text x="833" y="387" font-size="12.5" fill="#6B6873" text-anchor="middle">where the home AI does its work</text>
  <rect x="728" y="398" width="210" height="9" fill="#F2EEE3" stroke="#9D9A95" stroke-width="1"/>
  <rect x="728" y="398" width="157.5" height="9" fill="#5A8270"/>
  <text x="833" y="425" font-size="11" fill="#6B6873" text-anchor="middle">the home AI fills 12 of its 16 GB</text>
  <rect x="24" y="474" width="24" height="16" rx="4" fill="#DEE3EC" stroke="#4F627F" stroke-width="1.5"/>
  <text x="56" y="486" font-size="12.5" fill="#6B6873">on the laptop</text>
  <rect x="180" y="474" width="24" height="16" rx="4" fill="#DEE8E1" stroke="#5A8270" stroke-width="1.5"/>
  <text x="212" y="486" font-size="12.5" fill="#6B6873">on the computer at home</text>
  <rect x="420" y="474" width="24" height="16" rx="4" fill="none" stroke="#9D9A95" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="452" y="486" font-size="12.5" fill="#6B6873">kept running by one program</text>
  <text x="500" y="518" font-size="13.5" fill="#A85B49" text-anchor="middle" font-weight="600">DIA-102 · Where it lives: everything is on one computer at home, and the laptop reaches it over a private connection.</text>
</svg>
