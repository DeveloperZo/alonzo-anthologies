    <marker id="d101-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L9,5 L0,9 Z" fill="#4F627F"/></marker>
    <marker id="d101-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L9,5 L0,9 Z" fill="#A28438"/></marker>
    <marker id="d101-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L9,5 L0,9 Z" fill="#6B6873"/></marker>
    <marker id="d101-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L9,5 L0,9 Z" fill="#5A8270"/></marker>
  </defs>
  <rect width="1000" height="1216" fill="#F2EEE3"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#A85B49" letter-spacing="0.04em">DIA-101 · THE PIECES</text>
  <text x="500" y="58" text-anchor="middle" font-size="14" fill="#6B6873">What is each piece, why do we have it, and how do you use it?</text>
  <g font-size="12" font-weight="700" fill="#6B6873" letter-spacing="0.03em">
    <text x="24" y="97">NAME</text><text x="250" y="97">WHAT IT IS</text><text x="510" y="97">WHY WE HAVE IT</text><text x="790" y="97">HOW YOU USE IT</text>
  </g>
  <rect x="24" y="104" width="952" height="22" rx="4" fill="#FAFAF8" stroke="#E2DFD6" stroke-width="1"/>
  <text x="34" y="119.5" font-size="12" font-weight="700" fill="#6B6873" letter-spacing="0.03em">THE AI AT HOME</text>
  <text x="24" y="153" font-size="15.5" font-weight="700" fill="#5A8270">The home AI</text>
  <text x="24" y="171" font-size="11.5" fill="#6B6873">Ollama, running the gpt-oss model</text>
  <text x="250" y="153" font-size="13" fill="#2A2A35">An AI program on our own computer. It</text>
  <text x="250" y="171" font-size="13" fill="#2A2A35">reads, summarizes and drafts</text>
  <text x="510" y="153" font-size="13" font-style="italic" fill="#2A2A35">It is in front: everything meets it</text>
  <text x="510" y="171" font-size="13" font-style="italic" fill="#2A2A35">first. Free to use, and private</text>
  <text x="790" y="153" font-size="13" fill="#6B6873">Nothing to open. The chat</text>
  <text x="790" y="171" font-size="13" fill="#6B6873">pages talk to it for you</text>
  <line x1="24" y1="190" x2="976" y2="190" stroke="#E2DFD6" stroke-width="1"/>
  <text x="24" y="217" font-size="15.5" font-weight="700" fill="#5A8270">The graphics card</text>
  <text x="24" y="235" font-size="11.5" fill="#6B6873">RTX 5080, 16 GB</text>
  <text x="250" y="217" font-size="13" fill="#2A2A35">The part inside the computer that</text>
  <text x="250" y="235" font-size="13" fill="#2A2A35">does the AI's work</text>
  <text x="510" y="217" font-size="13" font-style="italic" fill="#2A2A35">A bigger card fits a cleverer AI. Ours</text>
  <text x="510" y="235" font-size="13" font-style="italic" fill="#2A2A35">fits a mid-sized one at full speed</text>
  <text x="790" y="217" font-size="13" fill="#6B6873">Inside the desktop. Nothing</text>
  <text x="790" y="235" font-size="13" fill="#6B6873">to do</text>
  <rect x="24" y="254" width="952" height="22" rx="4" fill="#FAFAF8" stroke="#E2DFD6" stroke-width="1"/>
  <text x="34" y="269.5" font-size="12" font-weight="700" fill="#6B6873" letter-spacing="0.03em">THE TWO DOORS</text>
  <text x="24" y="303" font-size="15.5" font-weight="700" fill="#5A8270">The front door</text>
  <text x="24" y="321" font-size="11.5" fill="#6B6873">LiteLLM, port 4000</text>
  <text x="250" y="303" font-size="13" fill="#2A2A35">The everyday entrance. It has a</text>
  <text x="250" y="321" font-size="13" fill="#2A2A35">switch: home, or paid</text>
  <text x="510" y="303" font-size="13" font-style="italic" fill="#2A2A35">One password and one logbook for</text>
  <text x="510" y="321" font-size="13" font-style="italic" fill="#2A2A35">everything that is not private</text>
  <text x="790" y="303" font-size="13" fill="#6B6873">Behind the scenes. Tools</text>
  <text x="790" y="321" font-size="13" fill="#6B6873">need the password</text>
  <line x1="24" y1="340" x2="976" y2="340" stroke="#E2DFD6" stroke-width="1"/>
  <text x="24" y="367" font-size="15.5" font-weight="700" fill="#5A8270">The private door</text>
  <text x="24" y="385" font-size="11.5" fill="#6B6873">a second LiteLLM, port 4001</text>
  <text x="250" y="367" font-size="13" fill="#2A2A35">A second entrance that only knows the</text>
  <text x="250" y="385" font-size="13" fill="#2A2A35">home AI</text>
  <text x="510" y="367" font-size="13" font-style="italic" fill="#2A2A35">Private things go this way. It has no</text>
  <text x="510" y="385" font-size="13" font-style="italic" fill="#2A2A35">way out to paid help</text>
  <text x="790" y="367" font-size="13" fill="#6B6873">Behind the private chat</text>
  <text x="790" y="385" font-size="13" fill="#6B6873">page</text>
  <rect x="24" y="404" width="952" height="22" rx="4" fill="#FAFAF8" stroke="#E2DFD6" stroke-width="1"/>
  <text x="34" y="419.5" font-size="12" font-weight="700" fill="#6B6873" letter-spacing="0.03em">PAGES YOU CAN OPEN</text>
  <text x="24" y="453" font-size="15.5" font-weight="700" fill="#5A8270">The private chat page</text>
  <text x="24" y="471" font-size="11.5" fill="#6B6873">Open WebUI</text>
  <text x="250" y="453" font-size="13" fill="#2A2A35">A chat page for private things. Only</text>
  <text x="250" y="471" font-size="13" fill="#2A2A35">the home AI answers</text>
  <text x="510" y="453" font-size="13" font-style="italic" fill="#2A2A35">Health, family, money. Nothing typed</text>
  <text x="510" y="471" font-size="13" font-style="italic" fill="#2A2A35">here leaves the house</text>
  <rect x="790" y="439.5" width="137" height="19" rx="4" fill="#FAFAF8" stroke="#5A8270" stroke-width="1"/>
  <text class="m" x="858.5" y="453" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5A8270">lemonpepper:3002</text>
  <text x="790" y="473" font-size="13" fill="#6B6873">in a web browser</text>
  <line x1="24" y1="490" x2="976" y2="490" stroke="#E2DFD6" stroke-width="1"/>
  <text x="24" y="517" font-size="15.5" font-weight="700" fill="#5A8270">The chat page</text>
  <text x="24" y="535" font-size="11.5" fill="#6B6873">Open WebUI</text>
  <text x="250" y="517" font-size="13" fill="#2A2A35">The everyday chat page. The home AI</text>
  <text x="250" y="535" font-size="13" fill="#2A2A35">answers unless you pick paid</text>
  <text x="510" y="517" font-size="13" font-style="italic" fill="#2A2A35">The easy way to use the home AI, with</text>
  <text x="510" y="535" font-size="13" font-style="italic" fill="#2A2A35">paid help one click away</text>
  <rect x="790" y="503.5" width="137" height="19" rx="4" fill="#FAFAF8" stroke="#5A8270" stroke-width="1"/>
  <text class="m" x="858.5" y="517" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5A8270">lemonpepper:3000</text>
  <text x="790" y="537" font-size="13" fill="#6B6873">pick paid in the model list</text>
  <line x1="24" y1="554" x2="976" y2="554" stroke="#E2DFD6" stroke-width="1"/>
  <text x="24" y="581" font-size="15.5" font-weight="700" fill="#5A8270">The live board</text>
  <text x="24" y="599" font-size="11.5" fill="#6B6873">made for this system</text>
  <text x="250" y="581" font-size="13" fill="#2A2A35">A page that shows what the system is</text>
  <text x="250" y="599" font-size="13" fill="#2A2A35">doing right now</text>
  <text x="510" y="581" font-size="13" font-style="italic" fill="#2A2A35">See at a glance that everything is on,</text>
  <text x="510" y="599" font-size="13" font-style="italic" fill="#2A2A35">and watch a request travel</text>
  <rect x="790" y="567.5" width="137" height="19" rx="4" fill="#FAFAF8" stroke="#5A8270" stroke-width="1"/>
  <text class="m" x="858.5" y="581" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5A8270">lemonpepper:8088</text>
  <text x="790" y="601" font-size="13" fill="#6B6873">in a web browser</text>
  <line x1="24" y1="618" x2="976" y2="618" stroke="#E2DFD6" stroke-width="1"/>
  <text x="24" y="645" font-size="15.5" font-weight="700" fill="#5A8270">The logbook</text>
  <text x="24" y="663" font-size="11.5" fill="#6B6873">Langfuse</text>
  <text x="250" y="645" font-size="13" fill="#2A2A35">A record of every request. From the</text>
  <text x="250" y="663" font-size="13" fill="#2A2A35">private door it keeps no words</text>
  <text x="510" y="645" font-size="13" font-style="italic" fill="#2A2A35">Shows how much work the home AI did, and</text>
  <text x="510" y="663" font-size="13" font-style="italic" fill="#2A2A35">what went to paid help</text>
  <rect x="790" y="631.5" width="137" height="19" rx="4" fill="#FAFAF8" stroke="#5A8270" stroke-width="1"/>
  <text class="m" x="858.5" y="645" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5A8270">lemonpepper:3001</text>
  <text x="790" y="665" font-size="13" fill="#6B6873">sign in needed</text>
  <line x1="24" y1="682" x2="976" y2="682" stroke="#E2DFD6" stroke-width="1"/>
  <text x="24" y="709" font-size="15.5" font-weight="700" fill="#5A8270">Movies and shows</text>
  <text x="24" y="727" font-size="11.5" fill="#6B6873">Jellyfin</text>
  <text x="250" y="709" font-size="13" fill="#2A2A35">A shelf for our own films, shows and</text>
  <text x="250" y="727" font-size="13" fill="#2A2A35">music</text>
  <text x="510" y="709" font-size="13" font-style="italic" fill="#2A2A35">Watch our own collection on any of our</text>
  <text x="510" y="727" font-size="13" font-style="italic" fill="#2A2A35">screens. Not set up yet</text>
  <rect x="790" y="695.5" width="137" height="19" rx="4" fill="#FAFAF8" stroke="#5A8270" stroke-width="1"/>
  <text class="m" x="858.5" y="709" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5A8270">lemonpepper:8096</text>
  <text x="790" y="729" font-size="13" fill="#6B6873">in a web browser</text>
  <rect x="24" y="746" width="952" height="22" rx="4" fill="#FAFAF8" stroke="#E2DFD6" stroke-width="1"/>
  <text x="34" y="761.5" font-size="12" font-weight="700" fill="#6B6873" letter-spacing="0.03em">PAID HELP, ON THE INTERNET</text>
  <text x="24" y="795" font-size="15.5" font-weight="700" fill="#A28438">Claude</text>
  <text x="24" y="813" font-size="11.5" fill="#6B6873">the route named paid</text>
  <text x="250" y="795" font-size="13" fill="#2A2A35">A paid AI. Smarter than the home AI,</text>
  <text x="250" y="813" font-size="13" fill="#2A2A35">and charged for each use</text>
  <text x="510" y="795" font-size="13" font-style="italic" fill="#2A2A35">For hard thinking the home AI gets</text>
  <text x="510" y="813" font-size="13" font-style="italic" fill="#2A2A35">wrong. It sees only what is sent</text>
  <text x="790" y="795" font-size="13" fill="#6B6873">Off until an API key is</text>
  <text x="790" y="813" font-size="13" fill="#6B6873">added</text>
  <line x1="24" y1="832" x2="976" y2="832" stroke="#E2DFD6" stroke-width="1"/>
  <text x="24" y="859" font-size="15.5" font-weight="700" fill="#A28438">n8n Cloud</text>
  <text x="24" y="877" font-size="11.5" fill="#6B6873">a paid subscription</text>
  <text x="250" y="859" font-size="13" fill="#2A2A35">A service that runs chores by itself:</text>
  <text x="250" y="877" font-size="13" fill="#2A2A35">on a schedule, or when something</text>
  <text x="250" y="895" font-size="13" fill="#2A2A35">happens</text>
  <text x="510" y="859" font-size="13" font-style="italic" fill="#2A2A35">Connects apps and repeats work. It may</text>
  <text x="510" y="877" font-size="13" font-style="italic" fill="#2A2A35">ask the home AI, never Claude</text>
  <text x="790" y="859" font-size="13" fill="#6B6873">Its AI steps use the</text>
  <text x="790" y="877" font-size="13" fill="#6B6873">credential Home AI (private</text>
  <text x="790" y="895" font-size="13" fill="#6B6873">door)</text>
  <rect x="24" y="914" width="952" height="22" rx="4" fill="#FAFAF8" stroke="#E2DFD6" stroke-width="1"/>
  <text x="34" y="929.5" font-size="12" font-weight="700" fill="#6B6873" letter-spacing="0.03em">UNDERNEATH</text>
  <text x="24" y="963" font-size="15.5" font-weight="700" fill="#5A8270">The private connection</text>
  <text x="24" y="981" font-size="11.5" fill="#6B6873">Tailscale</text>
  <text x="250" y="963" font-size="13" fill="#2A2A35">A private link between our own</text>
  <text x="250" y="981" font-size="13" fill="#2A2A35">devices</text>
  <text x="510" y="963" font-size="13" font-style="italic" fill="#2A2A35">Lets the laptop reach the home computer</text>
  <text x="510" y="981" font-size="13" font-style="italic" fill="#2A2A35">from anywhere. Strangers cannot use it</text>
  <text x="790" y="963" font-size="13" fill="#6B6873">Always on. Nothing to do</text>
  <line x1="24" y1="1000" x2="976" y2="1000" stroke="#E2DFD6" stroke-width="1"/>
  <text x="24" y="1027" font-size="15.5" font-weight="700" fill="#5A8270">The service runner</text>
  <text x="24" y="1045" font-size="11.5" fill="#6B6873">Docker Desktop</text>
  <text x="250" y="1027" font-size="13" fill="#2A2A35">A program that keeps the pages and</text>
  <text x="250" y="1045" font-size="13" fill="#2A2A35">the doors running</text>
  <text x="510" y="1027" font-size="13" font-style="italic" fill="#2A2A35">The chat pages, logbook, movie shelf,</text>
  <text x="510" y="1045" font-size="13" font-style="italic" fill="#2A2A35">board and both doors all run inside it</text>
  <text x="790" y="1027" font-size="13" fill="#6B6873">One command starts it all</text>
  <text x="790" y="1045" font-size="13" fill="#6B6873">after a restart</text>
  <line x1="24" y1="1064" x2="976" y2="1064" stroke="#E2DFD6" stroke-width="1"/>
  <text x="24" y="1085.5" font-size="12" font-weight="700" fill="#6B6873" letter-spacing="0.03em">DROPPED</text>
  <text x="110" y="1085.5" font-size="13" fill="#6B6873">LM Studio: a second AI program that did the same job as Ollama, a little differently. Dropped on 2026-11-18.</text>
  <line x1="24" y1="1098" x2="976" y2="1098" stroke="#E2DFD6" stroke-width="1"/>
  <text x="24" y="1119.5" font-size="12" font-weight="700" fill="#6B6873" letter-spacing="0.03em">LATER</text>
  <text x="110" y="1119.5" font-size="13" fill="#6B6873">A memory, so the home AI can remember earlier work. Not built.</text>
  <line x1="24" y1="1132" x2="976" y2="1132" stroke="#E2DFD6" stroke-width="1"/>
  <rect x="24" y="1146.5" width="130" height="19" rx="4" fill="#FAFAF8" stroke="#5A8270" stroke-width="1"/>
  <text class="m" x="89" y="1160" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5A8270">lemonpepper:3000</text>
  <text x="164" y="1160" font-size="12.5" fill="#6B6873">an address to type into a web browser. It works on a device that has joined the private connection.</text>
  <text x="500" y="1194" text-anchor="middle" font-size="13.5" font-weight="600" fill="#A85B49">DIA-101 · The pieces: what each piece of the home library is, why we have it, and how you use it.</text>
</svg>
