<svg viewBox="0 0 1000 914" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d100-title d100-desc">
  <title id="d100-title">DIA-100 · Home library: what it is for</title>
  <desc id="d100-desc">The overview. You open one of two pages on the computer at home. Private chat, at lemonpepper:3002, is for health, family and money. Everyday chat, at lemonpepper:3000, is for everything else. Each page talks to a door, which is a gateway with no screen of its own. Private chat uses the private door, port 4001, which only knows the home AI and has no way out to paid help. Everyday chat, and tools, use the front door, port 4000, which has a switch: home by default, or paid. Both doors lead to the home AI, which answers at home and costs only electricity. The home AI reads and writes the private files on drives C and D and reads the working files on drive F. Paid help is outside, on the internet. n8n Cloud runs chores by itself and comes in through the private door, so it may ask the home AI and can never reach Claude. Claude, a paid AI for hard thinking, is reached from the front door only if you flip the switch, sees only what is sent, and cannot reach in. Also on the computer at home: the logbook, the live board, and movies and shows.</desc>
