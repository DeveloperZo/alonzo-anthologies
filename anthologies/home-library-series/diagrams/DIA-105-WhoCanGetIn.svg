<svg viewBox="0 0 1000 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d105-title d105-desc">
  <title id="d105-title">DIA-105 · Who can get in</title>
  <desc id="d105-desc">On the left, three kinds of visitor. Our own devices on the private connection: the intended way in. Any device on the home wifi, such as a guest's phone or a smart TV: not intended, but it works. The internet, everyone else: blocked. On the right, the six doors on the computer at home and the lock on each. Movies and shows: never set up, the first visitor becomes its owner. The chat page: no account yet, the first to sign up becomes its owner. The live board: open on purpose, it shows activity only. The logbook: has its own sign-in. The front door: needs the password. The home AI: no lock at all.</desc>
  <defs>
    <style>
      :root {
        --bg: #FAFAF8; --paper: #F2EEE3; --text: #2A2A35; --muted: #6B6873; --muted2: #9D9A95; --line: #E2DFD6;
        --red: #A85B49; --blue: #4F627F; --blue-soft: #DEE3EC; --green: #5A8270; --green-soft: #DEE8E1; --amber: #A28438; --amber-soft: #F0E5CD;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1B1D23; --paper: #1E2128; --text: #E8E5DC; --muted: #B8B5AD; --muted2: #908D87; --line: #3E3D38;
          --red: #D29183; --blue: #94A6C4; --blue-soft: #2A323F; --green: #92BAA6; --green-soft: #233029; --amber: #D6B574; --amber-soft: #3B3220;
        }
      }
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      text.m, tspan.m { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
      [fill="#FAFAF8"] { fill: var(--bg); } [fill="#F2EEE3"] { fill: var(--paper); }
      [fill="#2A2A35"] { fill: var(--text); }
      [fill="#6B6873"] { fill: var(--muted); } [fill="#9D9A95"] { fill: var(--muted2); }
      [stroke="#E2DFD6"] { stroke: var(--line); } [stroke="#9D9A95"] { stroke: var(--muted2); }
      [fill="#A85B49"] { fill: var(--red); }
      [fill="#4F627F"] { fill: var(--blue); } [stroke="#4F627F"] { stroke: var(--blue); } [fill="#DEE3EC"] { fill: var(--blue-soft); }
      [fill="#5A8270"] { fill: var(--green); } [stroke="#5A8270"] { stroke: var(--green); } [fill="#DEE8E1"] { fill: var(--green-soft); }
      [fill="#A28438"] { fill: var(--amber); } [stroke="#A28438"] { stroke: var(--amber); } [fill="#F0E5CD"] { fill: var(--amber-soft); }
      [stroke="#6B6873"] { stroke: var(--muted); } [stroke="#A85B49"] { stroke: var(--red); } [stroke="#2A2A35"] { stroke: var(--text); }
    </style>
    <marker id="d105-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L9,5 L0,9 Z" fill="#4F627F"/></marker>
    <marker id="d105-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L9,5 L0,9 Z" fill="#A28438"/></marker>
    <marker id="d105-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L9,5 L0,9 Z" fill="#6B6873"/></marker>
    <marker id="d105-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L9,5 L0,9 Z" fill="#5A8270"/></marker>
  </defs>
  <rect width="1000" height="630" fill="#F2EEE3"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#A85B49" letter-spacing="0.04em">DIA-105 · WHO CAN GET IN</text>
  <text x="500" y="58" font-size="14" fill="#6B6873" text-anchor="middle">Which doors are open, to whom, and how is each one locked?</text>
  <rect x="428" y="84" width="548" height="428" rx="14" fill="none" stroke="#9D9A95" stroke-width="1.5"/>
  <text x="444" y="106" font-size="12" fill="#6B6873" font-weight="700" letter-spacing="0.03em">THE DOORS ON THE COMPUTER AT HOME</text>
  <rect x="454" y="120" width="506" height="54" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="470" y="143" font-size="15" fill="#5A8270" font-weight="700">MOVIES AND SHOWS</text>
  <text x="470" y="161" font-size="11.5" fill="#6B6873">Jellyfin</text>
  <text x="946" y="143" font-size="13" fill="#A28438" text-anchor="end" font-weight="700">never set up</text>
  <text x="946" y="161" font-size="12.5" fill="#A28438" text-anchor="end" font-style="italic">the first visitor becomes its owner</text>
  <rect x="454" y="184" width="506" height="54" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="470" y="207" font-size="15" fill="#5A8270" font-weight="700">THE CHAT PAGE</text>
  <text x="470" y="225" font-size="11.5" fill="#6B6873">Open WebUI</text>
  <text x="946" y="207" font-size="13" fill="#A28438" text-anchor="end" font-weight="700">no account yet</text>
  <text x="946" y="225" font-size="12.5" fill="#A28438" text-anchor="end" font-style="italic">the first to sign up becomes its owner</text>
  <rect x="454" y="248" width="506" height="54" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="470" y="271" font-size="15" fill="#5A8270" font-weight="700">THE LIVE BOARD</text>
  <text x="470" y="289" font-size="11.5" fill="#6B6873">made for this system</text>
  <text x="946" y="271" font-size="13" fill="#5A8270" text-anchor="end" font-weight="700">open on purpose</text>
  <text x="946" y="289" font-size="12.5" fill="#5A8270" text-anchor="end" font-style="italic">shows activity only, never the words</text>
  <rect x="454" y="312" width="506" height="54" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="470" y="335" font-size="15" fill="#5A8270" font-weight="700">THE LOGBOOK</text>
  <text x="470" y="353" font-size="11.5" fill="#6B6873">Langfuse</text>
  <text x="946" y="335" font-size="13" fill="#5A8270" text-anchor="end" font-weight="700">has its own sign-in</text>
  <text x="946" y="353" font-size="12.5" fill="#5A8270" text-anchor="end" font-style="italic">one account, Zo's</text>
  <rect x="454" y="376" width="506" height="54" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="470" y="399" font-size="15" fill="#5A8270" font-weight="700">THE FRONT DOOR</text>
  <text x="470" y="417" font-size="11.5" fill="#6B6873">LiteLLM</text>
  <text x="946" y="399" font-size="13" fill="#5A8270" text-anchor="end" font-weight="700">needs the password</text>
  <text x="946" y="417" font-size="12.5" fill="#5A8270" text-anchor="end" font-style="italic">one password, shared by every tool</text>
  <rect x="454" y="440" width="506" height="54" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="470" y="463" font-size="15" fill="#5A8270" font-weight="700">THE HOME AI</text>
  <text x="470" y="481" font-size="11.5" fill="#6B6873">Ollama</text>
  <text x="946" y="463" font-size="13" fill="#A85B49" text-anchor="end" font-weight="700">no lock at all</text>
  <text x="946" y="481" font-size="12.5" fill="#A85B49" text-anchor="end" font-style="italic">anyone who gets this far can use it or remove it</text>
  <path d="M424,128 H412 V486 H424" fill="none" stroke="#4F627F" stroke-width="2.5"/>
  <path d="M404,148 H392 V466 H404" fill="none" stroke="#A28438" stroke-width="2.5"/>
  <line x1="264" y1="162" x2="409" y2="162" stroke="#4F627F" stroke-width="2.5" marker-end="url(#d105-blue)"/>
  <line x1="264" y1="312" x2="389" y2="312" stroke="#A28438" stroke-width="2.5" marker-end="url(#d105-amber)"/>
  <line x1="264" y1="452" x2="298" y2="452" stroke="#6B6873" stroke-width="2.5"/>
  <line x1="300" y1="436" x2="300" y2="468" stroke="#6B6873" stroke-width="4"/>
  <text x="312" y="456.5" font-size="12.5" fill="#6B6873" font-weight="700">blocked</text>
  <rect x="24" y="120" width="240" height="84" rx="42" fill="#DEE3EC" stroke="#4F627F" stroke-width="2"/>
  <text x="144" y="150" font-size="15" fill="#4F627F" text-anchor="middle" font-weight="700">OUR OWN DEVICES</text>
  <text x="144" y="170" font-size="13" fill="#4F627F" text-anchor="middle">on the private connection</text>
  <text x="144" y="188" font-size="13" fill="#4F627F" text-anchor="middle" font-style="italic">the intended way in</text>
  <rect x="24" y="270" width="240" height="84" rx="42" fill="#F0E5CD" stroke="#A28438" stroke-width="2"/>
  <text x="144" y="300" font-size="14" fill="#A28438" text-anchor="middle" font-weight="700">ANY DEVICE ON HOME WIFI</text>
  <text x="144" y="320" font-size="13" fill="#A28438" text-anchor="middle">a guest's phone, a smart TV</text>
  <text x="144" y="338" font-size="13" fill="#A28438" text-anchor="middle" font-style="italic">not intended, but it works</text>
  <text x="144" y="376" font-size="12" fill="#A28438" text-anchor="middle">Seen from the computer itself, not</text>
  <text x="144" y="392" font-size="12" fill="#A28438" text-anchor="middle">yet tried from a second device.</text>
  <rect x="24" y="420" width="240" height="64" rx="32" fill="#FAFAF8" stroke="#6B6873" stroke-width="2"/>
  <text x="144" y="448" font-size="15" fill="#6B6873" text-anchor="middle" font-weight="700">THE INTERNET</text>
  <text x="144" y="467" font-size="13" fill="#6B6873" text-anchor="middle">everyone else</text>
  <text x="144" y="506" font-size="12" fill="#6B6873" text-anchor="middle">The private connection lets no one</text>
  <text x="144" y="522" font-size="12" fill="#6B6873" text-anchor="middle">else in. The home router was</text>
  <text x="144" y="538" font-size="12" fill="#6B6873" text-anchor="middle">not checked.</text>
  <line x1="24" y1="568" x2="60" y2="568" stroke="#4F627F" stroke-width="2.5"/>
  <text x="68" y="572" font-size="12.5" fill="#6B6873">the intended way in</text>
  <line x1="220" y1="568" x2="256" y2="568" stroke="#A28438" stroke-width="2.5"/>
  <text x="264" y="572" font-size="12.5" fill="#6B6873">open wider than intended</text>
  <rect x="470" y="561" width="12" height="12" rx="2" fill="#5A8270"/>
  <text x="490" y="572" font-size="12.5" fill="#6B6873">locked, or nothing to lock</text>
  <rect x="670" y="561" width="12" height="12" rx="2" fill="#A28438"/>
  <text x="690" y="572" font-size="12.5" fill="#6B6873">lock not finished</text>
  <rect x="820" y="561" width="12" height="12" rx="2" fill="#A85B49"/>
  <text x="840" y="572" font-size="12.5" fill="#6B6873">no lock</text>
  <text x="500" y="608" font-size="13.5" fill="#A85B49" text-anchor="middle" font-weight="600">DIA-105 · Who can get in: the home wifi reaches every door, two pages have no owner yet, and the home AI has no lock.</text>
</svg>
