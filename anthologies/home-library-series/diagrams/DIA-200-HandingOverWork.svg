<svg viewBox="0 0 1000 738" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d200-title d200-desc">
  <title id="d200-title">DIA-200 · Handing over work</title>
  <desc id="d200-desc">A job arrives at the Arbiter, the AI that plans and checks (a paid AI today, Claude Code; possibly our own model later). It sorts the job three ways. Bulk reading with plain output goes to the quick route on the home AI: summaries, questions about a document, sorting into categories, pulling facts into a form, a small function, an exact small edit; 1 to 3 seconds for a short answer. Work that needs working out goes to the thinking route on the same home AI: putting things in order, counting and comparing, rewriting to a strict rule, or a second try; about three times slower. Work that needs judgement stays with the Arbiter: planning, judgement calls, rules that affect each other, final published wording. Two safety catches sit under the home routes: an input of more than about 12,000 words is refused and split, and an answer that stops part-way is thrown away. The Arbiter then checks what comes back, because about 1 claim in 25 was wrong in testing. A warning band says private things do not go this way yet: a paid Arbiter sees every answer, so health records and the like go through the chat page instead. Scores from 12 kinds of job tried twice: quick route 18 right, 4 partly, 2 wrong; thinking route 19 right, 2 partly, 3 wrong.</desc>
  <defs>
    <style>
      :root {
        --bg: #FAFAF8; --paper: #F2EEE3; --text: #2A2A35; --muted: #6B6873; --muted2: #9D9A95; --line: #E2DFD6;
        --red: #A85B49; --blue: #4F627F; --blue-soft: #DEE3EC; --green: #5A8270; --green-soft: #DEE8E1; --amber: #A28438; --amber-soft: #F0E5CD;
      }
      @media (prefers-color-scheme: dark) {
