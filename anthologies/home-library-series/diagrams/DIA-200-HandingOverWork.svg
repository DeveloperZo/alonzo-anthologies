          --red: #D29183; --blue: #94A6C4; --blue-soft: #2A323F; --green: #92BAA6; --green-soft: #233029; --amber: #D6B574; --amber-soft: #3B3220;
        }
      }
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      text.m, tspan.m { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
      [fill="#FAFAF8"] { fill: var(--bg); } [fill="#F2EEE3"] { fill: var(--paper); }
      [fill="#2A2A35"] { fill: var(--text); }
      [fill="#6B6873"] { fill: var(--muted); } [fill="#9D9A95"] { fill: var(--muted2); }
      [stroke="#E2DFD6"] { stroke: var(--line); } [stroke="#9D9A95"] { stroke: var(--muted2); }
      [fill="#A85B49"] { fill: var(--red); }
      [fill="#4F627F"] { fill: var(--blue); } [stroke="#4F627F"] { stroke: var(--blue); } [fill="#DEE3EC"] { fill: var(--blue-soft); }
      [fill="#5A8270"] { fill: var(--green); } [stroke="#5A8270"] { stroke: var(--green); } [fill="#DEE8E1"] { fill: var(--green-soft); }
      [fill="#A28438"] { fill: var(--amber); } [stroke="#A28438"] { stroke: var(--amber); } [fill="#F0E5CD"] { fill: var(--amber-soft); }
      [stroke="#6B6873"] { stroke: var(--muted); } [stroke="#A85B49"] { stroke: var(--red); } [stroke="#2A2A35"] { stroke: var(--text); }
    </style>
    <marker id="d200-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L9,5 L0,9 Z" fill="#4F627F"/></marker>
    <marker id="d200-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L9,5 L0,9 Z" fill="#A28438"/></marker>
    <marker id="d200-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L9,5 L0,9 Z" fill="#6B6873"/></marker>
    <marker id="d200-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M0,1 L9,5 L0,9 Z" fill="#5A8270"/></marker>
  </defs>
  <rect width="1000" height="738" fill="#F2EEE3"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#A85B49" letter-spacing="0.04em">DIA-200 · HANDING OVER WORK</text>
  <text x="500" y="58" font-size="14" fill="#6B6873" text-anchor="middle">Which jobs go to the home AI, and how is the result kept honest?</text>
  <rect x="350" y="84" width="300" height="56" rx="12" fill="#DEE3EC" stroke="#4F627F" stroke-width="2"/>
  <text x="500" y="108" font-size="16" fill="#4F627F" text-anchor="middle" font-weight="700">A JOB ARRIVES</text>
  <text x="500" y="128" font-size="13" fill="#4F627F" text-anchor="middle">at the Arbiter</text>
  <line x1="500" y1="140" x2="500" y2="162" stroke="#4F627F" stroke-width="2.5"/>
  <line x1="172" y1="162" x2="828" y2="162" stroke="#4F627F" stroke-width="2.5"/>
  <line x1="172" y1="162" x2="172" y2="193" stroke="#4F627F" stroke-width="2.5" marker-end="url(#d200-blue)"/>
  <text x="184" y="184" font-size="12" fill="#6B6873">bulk reading, plain output</text>
  <rect x="24" y="196" width="296" height="170" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="172" y="224" font-size="16" fill="#5A8270" text-anchor="middle" font-weight="700">THE QUICK ROUTE</text>
  <text x="172" y="242" font-size="11" fill="#6B6873" text-anchor="middle">home AI, thinks briefly · local-fast</text>
  <text x="172" y="268" font-size="13" fill="#5A8270" text-anchor="middle">summaries, questions about a document</text>
  <text x="172" y="288" font-size="13" fill="#5A8270" text-anchor="middle">sorting into categories</text>
  <text x="172" y="308" font-size="13" fill="#5A8270" text-anchor="middle">pulling facts into a form</text>
  <text x="172" y="328" font-size="13" fill="#5A8270" text-anchor="middle">a small function, an exact small edit</text>
  <text x="172" y="352" font-size="12.5" fill="#5A8270" text-anchor="middle" font-style="italic">1 to 3 seconds for a short answer</text>
  <line x1="500" y1="162" x2="500" y2="193" stroke="#4F627F" stroke-width="2.5" marker-end="url(#d200-blue)"/>
  <text x="512" y="184" font-size="12" fill="#6B6873">needs working out</text>
  <rect x="352" y="196" width="296" height="170" rx="12" fill="#DEE8E1" stroke="#5A8270" stroke-width="2"/>
  <text x="500" y="224" font-size="16" fill="#5A8270" text-anchor="middle" font-weight="700">THE THINKING ROUTE</text>
  <text x="500" y="242" font-size="11" fill="#6B6873" text-anchor="middle">home AI, thinks first · local-think</text>
  <text x="500" y="268" font-size="13" fill="#5A8270" text-anchor="middle">putting things in order</text>
  <text x="500" y="288" font-size="13" fill="#5A8270" text-anchor="middle">counting and comparing</text>
  <text x="500" y="308" font-size="13" fill="#5A8270" text-anchor="middle">rewriting to a strict rule</text>
  <text x="500" y="328" font-size="13" fill="#5A8270" text-anchor="middle">a second try after a quick-route miss</text>
  <text x="500" y="352" font-size="12.5" fill="#5A8270" text-anchor="middle" font-style="italic">about three times slower</text>
  <line x1="828" y1="162" x2="828" y2="193" stroke="#4F627F" stroke-width="2.5" marker-end="url(#d200-blue)"/>
  <text x="840" y="184" font-size="12" fill="#6B6873">needs judgement</text>
  <rect x="680" y="196" width="296" height="170" rx="12" fill="#DEE3EC" stroke="#4F627F" stroke-width="2"/>
  <text x="828" y="224" font-size="16" fill="#4F627F" text-anchor="middle" font-weight="700">STAYS WITH THE ARBITER</text>
  <text x="828" y="242" font-size="11" fill="#6B6873" text-anchor="middle">Claude Code today</text>
  <text x="828" y="268" font-size="13" fill="#4F627F" text-anchor="middle">planning the work</text>
  <text x="828" y="288" font-size="13" fill="#4F627F" text-anchor="middle">judgement calls</text>
  <text x="828" y="308" font-size="13" fill="#4F627F" text-anchor="middle">rules that affect each other</text>
  <text x="828" y="328" font-size="13" fill="#4F627F" text-anchor="middle">final wording that gets published</text>
  <text x="828" y="352" font-size="12.5" fill="#4F627F" text-anchor="middle" font-style="italic">a paid Arbiter costs money per use</text>
  <line x1="172" y1="366" x2="172" y2="393" stroke="#4F627F" stroke-width="2.5" marker-end="url(#d200-blue)"/>
  <rect x="24" y="396" width="296" height="76" rx="12" fill="#FAFAF8" stroke="#A28438" stroke-width="2"/>
  <text x="172" y="420" font-size="14" fill="#A28438" text-anchor="middle" font-weight="700">SAFETY CATCH: TOO BIG</text>
  <text x="172" y="441" font-size="12.5" fill="#2A2A35" text-anchor="middle">more than about 12,000 words at once</text>
  <text x="172" y="459" font-size="12.5" fill="#2A2A35" text-anchor="middle">is refused, then split into parts</text>
  <line x1="172" y1="472" x2="172" y2="501" stroke="#4F627F" stroke-width="2.5" marker-end="url(#d200-blue)"/>
  <line x1="500" y1="366" x2="500" y2="393" stroke="#4F627F" stroke-width="2.5" marker-end="url(#d200-blue)"/>
  <rect x="352" y="396" width="296" height="76" rx="12" fill="#FAFAF8" stroke="#A28438" stroke-width="2"/>
  <text x="500" y="420" font-size="14" fill="#A28438" text-anchor="middle" font-weight="700">SAFETY CATCH: CUT OFF</text>
  <text x="500" y="441" font-size="12.5" fill="#2A2A35" text-anchor="middle">an answer that stops part-way</text>
  <text x="500" y="459" font-size="12.5" fill="#2A2A35" text-anchor="middle">is thrown away, never used</text>
  <line x1="500" y1="472" x2="500" y2="501" stroke="#4F627F" stroke-width="2.5" marker-end="url(#d200-blue)"/>
  <text x="680" y="412" font-size="12" fill="#6B6873" font-weight="700" letter-spacing="0.03em">HOW WE KNOW</text>
  <text x="680" y="434" font-size="13" fill="#2A2A35">12 kinds of job, each tried twice:</text>
  <text x="680" y="453" font-size="13" fill="#2A2A35">quick route: 18 right, 4 partly, 2 wrong</text>
  <text x="680" y="472" font-size="13" fill="#2A2A35">thinking route: 19 right, 2 partly, 3 wrong</text>
  <rect x="24" y="504" width="952" height="68" rx="12" fill="#DEE3EC" stroke="#4F627F" stroke-width="2"/>
  <text x="500" y="531" font-size="16" fill="#4F627F" text-anchor="middle" font-weight="700">THE ARBITER CHECKS WHAT COMES BACK</text>
  <text x="500" y="554" font-size="13" fill="#4F627F" text-anchor="middle">A summary points to what to read. It is not proof: about 1 claim in 25 was wrong in testing.</text>
  <rect x="24" y="586" width="952" height="62" rx="12" fill="#FAFAF8" stroke="#A85B49" stroke-width="2"/>
  <text x="500" y="611" font-size="15" fill="#A85B49" text-anchor="middle" font-weight="700">PRIVATE THINGS DO NOT GO THIS WAY YET</text>
  <text x="500" y="633" font-size="13" fill="#2A2A35" text-anchor="middle">The Arbiter is a paid AI today, and it sees every answer. For health records and the like, use the chat page.</text>
  <rect x="24" y="670" width="24" height="16" rx="4" fill="#DEE8E1" stroke="#5A8270" stroke-width="1.5"/>
  <text x="56" y="682" font-size="12.5" fill="#6B6873">done at home, free</text>
  <rect x="210" y="670" width="24" height="16" rx="4" fill="#DEE3EC" stroke="#4F627F" stroke-width="1.5"/>
  <text x="242" y="682" font-size="12.5" fill="#6B6873">done by the Arbiter</text>
  <rect x="410" y="670" width="24" height="16" rx="4" fill="#FAFAF8" stroke="#A28438" stroke-width="1.5"/>
  <text x="442" y="682" font-size="12.5" fill="#6B6873">refused or thrown away</text>
  <rect x="640" y="670" width="24" height="16" rx="4" fill="#FAFAF8" stroke="#A85B49" stroke-width="1.5"/>
  <text x="672" y="682" font-size="12.5" fill="#6B6873">a rule to follow</text>
  <text x="500" y="716" font-size="13.5" fill="#A85B49" text-anchor="middle" font-weight="600">DIA-200 · Handing over work: the home AI does the reading, two catches stop bad input and output, the Arbiter checks the rest.</text>
</svg>
